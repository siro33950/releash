[package]
name = "releash"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
releash-client = { path = "../releash-client" }
connectrpc = { version = "=0.9.1", features = ["client"] }
buffa = { version = "0.9.2", features = ["json"] }
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "7"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
