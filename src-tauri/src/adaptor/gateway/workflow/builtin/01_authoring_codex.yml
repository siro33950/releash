name: 01_authoring_codex
description: ユーザーとの対話を通じて requirements / behavior / design の Spec 3 文書をGPT系モデルで構築する。レビューループは行わない。
builtin: true
schemas:
  spec-directory:
    type: object
    properties:
      spec_dir: string
    required:
    - spec_dir
    additionalProperties: false
nodes:
- name: write_requirements
  session:
    model: gpt-5.5
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-requirements
  artifact: spec-directory
- name: write_behavior
  session:
    model: gpt-5.5
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-behavior
  input: spec-directory
  pass_output_from:
  - write_requirements
- name: write_design
  session:
    model: gpt-5.5
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-design
  input: spec-directory
  pass_output_from:
  - write_requirements
- name: spec_finalize
  session:
    model: gpt-5.5
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-finalize
  input: spec-directory
  pass_output_from:
  - write_requirements
