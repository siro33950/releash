name: 03_review
description: Claude 系モデルと GPT-5.5 がそれぞれ 6 観点すべてを確認し、Summary 段では各 Open Thread の reviewer 指摘を Thread 単位でまとめて人間に報告する（議論・Thread 投稿は行わない）。
builtin: true
nodes:
- name: review-fanout
  fanout:
    child:
    - review-opus
    - review-gpt55
  rules:
  - next: reporting
- name: review-opus
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-all
- name: review-gpt55
  session:
    model: gpt-5.5
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-all
- name: reporting
  session:
    model: gpt-5.5
    permission: edit
    gate: approval
    facets:
      policy: reporting
      knowledge: releash-thread-cli
      instruction: review-summary
