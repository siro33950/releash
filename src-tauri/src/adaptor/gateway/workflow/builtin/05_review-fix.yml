name: 05_review-fix
description: 決定済み方針に基づき修正計画の作成と実装を行い、open Threadが解消するまで最大5回繰り返して完了する。

schemas:
  document-reference: string
  directive-text: string
  workflow-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  thread-id: string
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      has_open_threads:
        type: boolean
    required:
    - threads
    - has_open_threads
  fix-plan-task:
    type: object
    properties:
      task_id: string
      thread_id: string
      target_files:
        type: array
        items: document-reference
      implementation_steps:
        type: array
        items: workflow-text
      acceptance_criteria:
        type: array
        items: workflow-text
      non_goals:
        type: array
        items: workflow-text
      source_policy: string
    required:
    - task_id
    - thread_id
    - target_files
    - implementation_steps
    - acceptance_criteria
    - non_goals
    - source_policy
  fix-plan:
    type: object
    properties:
      tasks:
        type: array
        items: fix-plan-task
      summary: string
    required:
    - tasks
    - summary
  fix-verification:
    type: object
    properties:
      issues:
        type: array
        items: workflow-text
      unverifiable:
        type: array
        items: workflow-text
    required:
    - issues
    - unverifiable
  fix-verification-scan:
    type: object
    properties:
      has_issues:
        type: boolean
    required:
    - has_issues

nodes:

  main:
    sequence:
      children:
      - resolve_request:
          inputs:
            goal: request
      - check_open_threads:
          rules:
          - when:
              on: has_open_threads
              then: create_fix_plan
            next: fix_report
      - create_fix_plan:
          inputs:
            spec: resolve_request.spec_dir
          rules:
          - loop_guard:
              max_iterations: 5
              on_exhausted: fix_report
          - next: implement_fix_plan
      - implement_fix_plan:
          inputs:
            create_fix_plan: create_fix_plan
            verify_fixes: verify_fixes
          rules:
          - loop_guard:
              max_iterations: 3
              on_exhausted: fix_report
              reset_on: create_fix_plan
          - next: verify_fixes
      - verify_fixes:
          inputs:
            create_fix_plan: create_fix_plan
      - check_fix_verification:
          rules:
          - when:
              on: has_issues
              then: implement_fix_plan
            next: check_open_threads
      - fix_report:
          inputs:
            check_open_threads: check_open_threads
            verify_fixes: verify_fixes

  resolve_request:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: planning
        instruction: existing-spec-resolve-request
    artifact: implementation-context
    input:
    - goal

  check_open_threads:
    command: >-
      releash review list --state open --json |
      jq '{threads: map({thread_id: .id}), has_open_threads: (length > 0)}'
    artifact: thread-scan

  create_fix_plan:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        - releash-thread-cli
        instruction: existing-spec-create-fix-plan
    artifact: fix-plan
    input:
    - spec

  implement_fix_plan:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: coding
        knowledge: releash-thread-cli
        instruction: implement_fix_plan
    input:
    - create_fix_plan
    - verify_fixes

  verify_fixes:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: verify_fixes
    artifact: fix-verification
    input:
    - create_fix_plan

  check_fix_verification:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node verify_fixes --json |
      jq '{has_issues: (.artifact.issues | length > 0)}'
    artifact: fix-verification-scan

  fix_report:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: fix-report
    input:
    - check_open_threads
    - verify_fixes
