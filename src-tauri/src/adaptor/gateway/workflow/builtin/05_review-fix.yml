name: 05_review-fix
description: フルレビューで残った Open Thread の [FIX_POLICY_APPROVED] 方針と実装差分を確認して不足を Task 化し、Task 実装ループで方針との合致を保証する。最後に人間が承認した Thread を resolve する。
builtin: true

nodes:
  - name: check_and_make_tasks
    type: agent
    model: gpt-5.6-sol
    permission: full
    instruction: review-fix-check-tasks
    output_contract: review-fix-tasks
    policy: reviewing
    knowledge: releash-thread-cli
    rules:
      - match: NEEDS_FIX
        next: implement_tasks
      - match: LGTM
        next: report

  - name: implement_tasks
    type: agent
    model: gpt-5.6-sol
    permission: full
    instruction: review-fix
    policy: coding
    pass_output_from:
      - check_and_make_tasks
    rules:
      - match: ".*"
        next: check_and_make_tasks
    cycle_guard:
      max_iterations: 5
      on_exhausted: report

  - name: report
    type: approval
    model: claude-opus-4-8
    permission: edit
    instruction: review-fix-report
    knowledge: releash-thread-cli
