name: 01_authoring_draft
description: requirements / behavior / design を文書ごとに Claude 系モデルで draft 方式（finalize なし）で一括作成し、Open Questions 解消後に人間のレビューを待つ。
builtin: true
schemas:
  spec-directory:
    type: object
    properties:
      spec_dir: string
    required:
    - spec_dir
nodes:
- name: write_requirements
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-requirements
  artifact: spec-directory
  inputs:
  - request
  rules:
  - next: write_behavior
- name: write_behavior
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-behavior
  inputs:
  - write_requirements
  rules:
  - next: write_design
- name: write_design
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-design
  inputs:
  - write_requirements
