name: 01_authoring_draft
description: requirements / behavior / design を文書ごとに Claude 系モデルで draft 方式（finalize なし）で一括作成し、Open Questions 解消後に人間のレビューを待つ。
builtin: true
nodes:
- name: write_requirements
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-requirements
  output_contract: spec-directory
- name: write_behavior
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-behavior
  input_contracts:
  - spec-directory
  pass_output_from:
  - write_requirements
- name: write_design
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-draft-design
  input_contracts:
  - spec-directory
  pass_output_from:
  - write_requirements
  - write_behavior
