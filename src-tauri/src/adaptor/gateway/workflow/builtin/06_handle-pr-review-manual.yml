name: 06_handle-pr-review-manual
description: 現在のブランチに紐づくPRの未解決review commentを取り込み、修正・返信方針を1つのSessionで1件ずつ人間と合意しながら決定して修正し、確認後にcommit、push、replyを行う。
builtin: true

schemas:
  workflow-text: string
  document-reference: string
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      summary: string
    required:
    - threads
    - summary
  import-scan:
    type: object
    properties:
      has_open_threads:
        type: boolean
    required:
    - has_open_threads
  fix-plan-task:
    type: object
    properties:
      task_id: string
      thread_id: string
      target_files:
        type: array
        items: document-reference
      implementation_steps:
        type: array
        items: workflow-text
      acceptance_criteria:
        type: array
        items: workflow-text
      non_goals:
        type: array
        items: workflow-text
      source_policy: string
    required:
    - task_id
    - thread_id
    - target_files
    - implementation_steps
    - acceptance_criteria
    - non_goals
    - source_policy
  fix-plan:
    type: object
    properties:
      tasks:
        type: array
        items: fix-plan-task
      summary: string
    required:
    - tasks
    - summary
  fix-verification:
    type: object
    properties:
      issues:
        type: array
        items: workflow-text
      unverifiable:
        type: array
        items: workflow-text
    required:
    - issues
    - unverifiable
  fix-verification-scan:
    type: object
    properties:
      has_issues:
        type: boolean
    required:
    - has_issues
  pr-review-reply:
    type: object
    properties:
      thread_id: string
      database_id: string
      reply: string
      thread_outcome: string
      thread_summary: string
    required:
    - thread_id
    - database_id
    - reply
    - thread_outcome
    - thread_summary
  pr-review-finalization:
    type: object
    properties:
      commit_message: string
      replies:
        type: array
        items: pr-review-reply
      summary: string
    required:
    - commit_message
    - replies
    - summary
  finalization-scan:
    type: object
    properties:
      ready:
        type: boolean
    required:
    - ready

nodes:
  main:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: import_pr_review_comments
    artifact: thread-scan
    rules:
    - next: check_imported_threads

  check_imported_threads:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node main --json |
      jq '{has_open_threads: (.artifact.threads | length > 0)}'
    artifact: import-scan
    rules:
    - when:
        on: has_open_threads
        then: decide_pr_review_fix_policies_manual
      next: report_no_pr_review_comments

  report_no_pr_review_comments:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        instruction: report_no_pr_review_comments
    inputs:
    - main

  decide_pr_review_fix_policies_manual:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: triage
        knowledge: releash-thread-cli
        instruction: decide_pr_review_fix_policy_manual
    completion: approval
    inputs:
    - main
    rules:
    - next: create_pr_review_fix_plan

  create_pr_review_fix_plan:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: create_pr_review_fix_plan
    artifact: fix-plan
    inputs:
    - main
    rules:
    - next: implement_pr_review_fix_plan

  implement_pr_review_fix_plan:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: coding
        knowledge: releash-thread-cli
        instruction: implement_pr_review_fix_plan
    inputs:
    - create_pr_review_fix_plan
    - verify_pr_review_fixes
    rules:
    - loop_guard:
        max_iterations: 3
        on_exhausted: pr_review_confirmation
    - next: verify_pr_review_fixes

  verify_pr_review_fixes:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: verify_pr_review_fixes
    artifact: fix-verification
    inputs:
    - create_pr_review_fix_plan
    rules:
    - next: check_pr_review_verification

  check_pr_review_verification:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node verify_pr_review_fixes --json |
      jq '{has_issues: (.artifact.issues | length > 0)}'
    artifact: fix-verification-scan
    rules:
    - when:
        on: has_issues
        then: implement_pr_review_fix_plan
      next: pr_review_confirmation

  pr_review_confirmation:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: pr_review_confirmation
    completion: approval
    artifact: pr-review-finalization
    inputs:
    - main
    - create_pr_review_fix_plan
    - verify_pr_review_fixes
    rules:
    - next: check_finalization

  check_finalization:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node pr_review_confirmation --json |
      jq '{ready: (.artifact.replies | length > 0)}'
    artifact: finalization-scan
    rules:
    - when:
        on: ready
        then: finalize_pr_review
      next: report_incomplete_pr_review

  report_incomplete_pr_review:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        instruction: report_incomplete_pr_review
    inputs:
    - pr_review_confirmation

  finalize_pr_review:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: coding
        knowledge: releash-thread-cli
        instruction: finalize_pr_review
    inputs:
    - pr_review_confirmation
