name: 02_implement_opus48
description: Spec を元にClaude系モデルで実装し、軽量レビューループ（最大 5 周、Human-in-the-Loop なし）で Spec 充足と規約適合を保証する。
builtin: true
nodes:
- name: implement
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: coding
      instruction: implement
- name: review_parallel
  fanout:
    parallel_children:
    - name: review_spec
      model: gpt-5.5
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: spec-implement-review-spec
    - name: review_design
      model: gpt-5.5
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: spec-implement-review-design
- name: fix
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: coding
      knowledge: releash-thread-cli
      instruction: spec-implement-fix
  output_contract: spec-implement-fix-verdict
  rules:
  - match: fixed
    next: review_parallel
  - match: completed
    next: report
  cycle_guard:
    max_iterations: 5
    on_exhausted: report
- name: report
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      knowledge: releash-thread-cli
      instruction: spec-implement-report
