name: 02_implement_opus48
description: Spec を元にClaude系モデルで実装し、軽量レビューループ（最大 5 周、Human-in-the-Loop なし）で Spec 充足と規約適合を保証する。
builtin: true
schemas:
  spec-implement-fix-verdict:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - completed
        - fixed
      summary: string
    required:
    - verdict
    - summary
    additionalProperties: false
nodes:
- name: implement
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: coding
      instruction: implement
  rules:
  - next: review_parallel
- name: review_parallel
  fanout:
    parallel_children:
    - name: review_spec
      model: gpt-5.5
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: spec-implement-review-spec
    - name: review_design
      model: gpt-5.5
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: spec-implement-review-design
  rules:
  - next: fix
- name: fix
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: coding
      knowledge: releash-thread-cli
      instruction: spec-implement-fix
  artifact: spec-implement-fix-verdict
  rules:
  - loop_guard: { max_iterations: 5, on_exhausted: report }
  - switch:
      on: verdict
      cases:
        fixed: review_parallel
        completed: report
- name: report
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      knowledge: releash-thread-cli
      instruction: spec-implement-report
