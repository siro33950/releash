name: 01_authoring_claude
description: ユーザーとの対話を通じて requirements / behavior / design の Spec 3 文書をClaude系モデルで構築する。レビューループは行わない。
builtin: true
schemas:
  spec-directory:
    type: object
    properties:
      spec_dir: string
    required:
    - spec_dir
nodes:
- name: write_requirements
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-requirements
  artifact: spec-directory
  inputs:
  - request
  rules:
  - next: write_behavior
- name: write_behavior
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-behavior
  inputs:
  - write_requirements
  rules:
  - next: write_design
- name: write_design
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-design
  inputs:
  - write_requirements
  rules:
  - next: spec_finalize
- name: spec_finalize
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-finalize
  inputs:
  - write_requirements
