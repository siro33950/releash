- name: behavior_repair
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      instruction: author-spec-repair-behavior
  artifact: repair-result
  inputs:
  - request
  - spec_intake
