        NEEDS_HUMAN: human_decision

# FullSpecSequence: 3文書全体の検証 -> 検討 -> owner文書の修正Sequenceへ戻す
- name: full_spec_validate
  session:
    model: claude-fable-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-validate-full
  artifact: validation-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_repair
  - behavior_author
  - behavior_repair
  - design_author
  - design_repair
  rules:
  - next: full_spec_consider

- name: full_spec_consider
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-consider-full
  artifact: consideration-result
  inputs:
  - request
  - spec_intake
  - full_spec_validate
  rules:
  - switch:
      on: verdict
      cases:
        PASS: final_review
        FIX_REQUIREMENTS: requirements_repair
        FIX_BEHAVIOR: behavior_repair
        FIX_DESIGN: design_repair
        NEEDS_HUMAN: human_decision

# HumanDecisionSequence: 文書レビューではなく、自動判断不能な一点だけを解決する。
- name: human_decision
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: approval
    facets:
      policy: author-spec-governance
      instruction: author-spec-human-decision
  artifact: human-decision-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_consider
  - requirements_repair
  - behavior_author
  - behavior_consider
  - behavior_repair
  - design_author
  - design_consider
  - design_repair
  - full_spec_consider
  - final_review
  rules:
  - loop_guard:
      max_iterations: 64
      on_exhausted: human_decision
  - switch:
      on: resume
      cases:
        AWAITING: human_decision
        INTAKE: spec_intake
        REQUIREMENTS: requirements_author
        BEHAVIOR: behavior_author
        DESIGN: design_author
        FULL_SPEC: full_spec_validate

# FinalReviewSequence: 通常経路で唯一の人間による文書レビュー。
- name: final_review
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: approval
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-final-review
  artifact: final-review-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_repair
  - behavior_author
  - behavior_repair
  - design_author
  - design_repair
  - full_spec_consider
  rules:
  - loop_guard:
      max_iterations: 64
      on_exhausted: human_decision
      reset_on: full_spec_consider
  - switch:
      on: verdict
      cases:
        AWAITING: final_review
        APPROVED: authoring_complete
        REVISE_REQUIREMENTS: requirements_repair
        REVISE_BEHAVIOR: behavior_repair
        REVISE_DESIGN: design_repair

- name: authoring_complete
  command: "true"
