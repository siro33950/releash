name: 01_author-spec
description: Issue、Story、または自由文RequestからRequirements・Behavior・Designを順番に作成し、3文書を1単位として検証・検討・修正を収束させた後、最後に人間が完成Specをレビューする。

schemas:
  workflow-text: string
  document-reference: string
  finding-id: string

  spec-finding:
    type: object
    properties:
      finding_id: string
      owner:
        type: string
        enum:
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
      problem: string
      evidence:
        type: array
        items: workflow-text
      required_change: string
    required:
    - finding_id
    - owner
    - problem
    - evidence
    - required_change

  spec-input:
    type: object
    properties:
      spec_dir: string
      primary_sources:
        type: array
        items: document-reference
      additional_sources:
        type: array
        items: document-reference
      request_items:
        type: array
        items: workflow-text
      question: string
      summary: string
    required:
    - spec_dir
    - primary_sources
    - additional_sources
    - request_items
    - question
    - summary

  document-result:
    type: object
    properties:
      path: string
      digest: string
      question: string
      summary: string
    required:
    - path
    - digest
    - question
    - summary

  validation-result:
    type: object
    properties:
      digest: string
      findings:
        type: array
        items: spec-finding
      question: string
      summary: string
    required:
    - digest
    - findings
    - question
    - summary

  consideration-result:
    type: object
    properties:
      digest: string
      accepted_finding_ids:
        type: array
        items: finding-id
      rejected_finding_ids:
        type: array
        items: finding-id
      question: string
      summary: string
    required:
    - digest
    - accepted_finding_ids
    - rejected_finding_ids
    - question
    - summary

  repair-result:
    type: object
    properties:
      changed_documents:
        type: array
        items: document-reference
      digest: string
      addressed_finding_ids:
        type: array
        items: finding-id
      question: string
      summary: string
    required:
    - changed_documents
    - digest
    - addressed_finding_ids
    - question
    - summary

  human-decision-result:
    type: object
    properties:
      resume:
        type: string
        enum:
        - INTAKE
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
        - SPEC
      question: string
      answer: string
      decision: string
      summary: string
    required:
    - resume
    - question
    - answer
    - decision
    - summary

  question-scan:
    type: object
    properties:
      needs_human:
        type: boolean
    required:
    - needs_human

  validation-scan:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - CLEAR
        - FINDINGS
        - NEEDS_HUMAN
    required:
    - verdict

  consideration-scan:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - PASS
        - FIX
        - NEEDS_HUMAN
    required:
    - verdict

nodes:
# IntakeSequence
- name: spec_intake
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      instruction: author-spec-intake
  artifact: spec-input
  inputs:
  - request
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_intake

- name: check_intake
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node spec_intake --json |
    jq '{needs_human: (.artifact.question | length > 0)}'
  artifact: question-scan
  rules:
  - when:
      on: needs_human
      then: human_decision
    next: requirements_author

# AuthoringSequence: 3文書を上流から順に作成する。検証は行わない。
- name: requirements_author
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge: spec-requirements
      instruction: author-spec-write-requirements
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_requirements

- name: check_requirements
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node requirements_author --json |
    jq '{needs_human: (.artifact.question | length > 0)}'
  artifact: question-scan
  rules:
  - when:
      on: needs_human
      then: human_decision
    next: behavior_author

- name: behavior_author
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      instruction: author-spec-write-behavior
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_behavior

- name: check_behavior
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node behavior_author --json |
    jq '{needs_human: (.artifact.question | length > 0)}'
  artifact: question-scan
  rules:
  - when:
      on: needs_human
      then: human_decision
    next: design_author

- name: design_author
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-write-design
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_design

- name: check_design
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node design_author --json |
    jq '{needs_human: (.artifact.question | length > 0)}'
  artifact: question-scan
  rules:
  - when:
      on: needs_human
      then: human_decision
    next: spec_validate

# SpecSequence: 3文書を1単位として検証 -> 検討 -> 修正し、Findingがなくなるまで繰り返す。
- name: spec_validate
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-validate-spec
  artifact: validation-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_repair
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_validation

- name: check_validation
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node spec_validate --json |
    jq '{verdict: (if (.artifact.question | length > 0) then "NEEDS_HUMAN"
    elif (.artifact.findings | length > 0) then "FINDINGS" else "CLEAR" end)}'
  artifact: validation-scan
  rules:
  - switch:
      on: verdict
      cases:
        CLEAR: final_review
        FINDINGS: spec_consider
    next: human_decision

- name: spec_consider
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-consider-spec
  artifact: consideration-result
  inputs:
  - request
  - spec_intake
  - spec_validate
  rules:
  - next: check_consideration

- name: check_consideration
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node spec_consider --json |
    jq '{verdict: (if (.artifact.question | length > 0) then "NEEDS_HUMAN"
    elif (.artifact.accepted_finding_ids | length > 0) then "FIX" else "PASS" end)}'
  artifact: consideration-scan
  rules:
  - switch:
      on: verdict
      cases:
        PASS: final_review
        FIX: spec_repair
    next: human_decision

- name: spec_repair
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-repair-spec
  artifact: repair-result
  inputs:
  - request
  - spec_intake
  - spec_validate
  - spec_consider
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - next: check_repair

- name: check_repair
  command: >-
    releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
    --node spec_repair --json |
    jq '{needs_human: (.artifact.question | length > 0)}'
  artifact: question-scan
  rules:
  - when:
      on: needs_human
      then: human_decision
    next: spec_validate

# HumanDecisionSequence: 文書レビューではなく、自動判断不能な一点だけを解決する。
- name: human_decision
  session:
    model: claude-opus-5
    permission: edit
    gate: approval
    facets:
      policy: author-spec-governance
      instruction: author-spec-human-decision
  artifact: human-decision-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_validate
  - spec_consider
  - spec_repair
  rules:
  - loop_guard:
      max_iterations: 64
      on_exhausted: human_decision
  - switch:
      on: resume
      cases:
        INTAKE: spec_intake
        REQUIREMENTS: requirements_author
        BEHAVIOR: behavior_author
        DESIGN: design_author
        SPEC: spec_validate

# FinalReviewSequence: 通常経路で唯一の人間による文書レビュー。承認をもって完了する。
- name: final_review
  session:
    model: claude-opus-5
    permission: edit
    gate: approval
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-final-review
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_validate
  - spec_consider
  - spec_repair
