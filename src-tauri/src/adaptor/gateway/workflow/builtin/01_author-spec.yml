name: 01_author-spec
description: Issue、Story、または自由文RequestからRequirements・Behavior・Designを順番に作成し、3文書を1単位として検証・検討・修正を収束させた後、最後に人間が完成Specをレビューする。

schemas:
  workflow-text: string
  document-reference: string
  finding-id: string

  spec-finding:
    type: object
    properties:
      finding_id: string
      owner:
        type: string
        enum:
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
      problem: string
      evidence:
        type: array
        items: workflow-text
      required_change: string
    required:
    - finding_id
    - owner
    - problem
    - evidence
    - required_change

  spec-input:
    type: object
    properties:
      status:
        type: string
        enum:
        - READY
        - NEEDS_HUMAN
      spec_dir: string
      primary_sources:
        type: array
        items: document-reference
      additional_sources:
        type: array
        items: document-reference
      request_items:
        type: array
        items: workflow-text
      question: string
      summary: string
    required:
    - status
    - spec_dir
    - primary_sources
    - additional_sources
    - request_items
    - question
    - summary

  document-result:
    type: object
    properties:
      status:
        type: string
        enum:
        - READY
        - NEEDS_HUMAN
      document:
        type: string
        enum:
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
      path: string
      digest: string
      question: string
      summary: string
    required:
    - status
    - document
    - path
    - digest
    - question
    - summary

  validation-result:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - CLEAR
        - FINDINGS
        - NEEDS_HUMAN
      digest: string
      findings:
        type: array
        items: spec-finding
      question: string
      summary: string
    required:
    - verdict
    - digest
    - findings
    - question
    - summary

  consideration-result:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - PASS
        - FIX
        - NEEDS_HUMAN
      digest: string
      accepted_finding_ids:
        type: array
        items: finding-id
      rejected_finding_ids:
        type: array
        items: finding-id
      question: string
      summary: string
    required:
    - verdict
    - digest
    - accepted_finding_ids
    - rejected_finding_ids
    - question
    - summary

  repair-result:
    type: object
    properties:
      status:
        type: string
        enum:
        - CHANGED
        - NO_CHANGE
        - NEEDS_HUMAN
      changed_documents:
        type: array
        items: document-reference
      digest: string
      addressed_finding_ids:
        type: array
        items: finding-id
      question: string
      summary: string
    required:
    - status
    - changed_documents
    - digest
    - addressed_finding_ids
    - question
    - summary

  human-decision-result:
    type: object
    properties:
      state:
        type: string
        enum:
        - AWAITING
        - RESOLVED
      resume:
        type: string
        enum:
        - AWAITING
        - INTAKE
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
        - SPEC
      question: string
      answer: string
      decision: string
      summary: string
    required:
    - state
    - resume
    - question
    - answer
    - decision
    - summary

  final-review-result:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - AWAITING
        - APPROVED
        - REVISE
      feedback: string
      summary: string
    required:
    - verdict
    - feedback
    - summary

nodes:
# IntakeSequence
- name: spec_intake
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      instruction: author-spec-intake
  artifact: spec-input
  inputs:
  - request
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        READY: requirements_author
        NEEDS_HUMAN: human_decision

# AuthoringSequence: 3文書を上流から順に作成する。検証は行わない。
- name: requirements_author
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge: spec-requirements
      instruction: author-spec-write-requirements
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        READY: behavior_author
        NEEDS_HUMAN: human_decision

- name: behavior_author
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      instruction: author-spec-write-behavior
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        READY: design_author
        NEEDS_HUMAN: human_decision

- name: design_author
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-write-design
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - human_decision
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        READY: spec_validate
        NEEDS_HUMAN: human_decision

# SpecSequence: 3文書を1単位として検証 -> 検討 -> 修正し、Findingがなくなるまで繰り返す。
- name: spec_validate
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-validate-spec
  artifact: validation-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_repair
  - human_decision
  - final_review
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: verdict
      cases:
        CLEAR: final_review
        FINDINGS: spec_consider
        NEEDS_HUMAN: human_decision

- name: spec_consider
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-consider-spec
  artifact: consideration-result
  inputs:
  - request
  - spec_intake
  - spec_validate
  rules:
  - switch:
      on: verdict
      cases:
        PASS: final_review
        FIX: spec_repair
        NEEDS_HUMAN: human_decision

- name: spec_repair
  session:
    model: claude-opus-5
    permission: full
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-repair-spec
  artifact: repair-result
  inputs:
  - request
  - spec_intake
  - spec_validate
  - spec_consider
  - human_decision
  - final_review
  rules:
  - loop_guard:
      max_iterations: 8
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        CHANGED: spec_validate
        NO_CHANGE: spec_validate
        NEEDS_HUMAN: human_decision

# HumanDecisionSequence: 文書レビューではなく、自動判断不能な一点だけを解決する。
- name: human_decision
  session:
    model: claude-opus-5
    permission: edit
    gate: approval
    facets:
      policy: author-spec-governance
      instruction: author-spec-human-decision
  artifact: human-decision-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_validate
  - spec_consider
  - spec_repair
  - final_review
  rules:
  - loop_guard:
      max_iterations: 64
      on_exhausted: human_decision
  - switch:
      on: resume
      cases:
        AWAITING: human_decision
        INTAKE: spec_intake
        REQUIREMENTS: requirements_author
        BEHAVIOR: behavior_author
        DESIGN: design_author
        SPEC: spec_validate

# FinalReviewSequence: 通常経路で唯一の人間による文書レビュー。
- name: final_review
  session:
    model: claude-opus-5
    permission: edit
    gate: approval
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-final-review
  artifact: final-review-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - behavior_author
  - design_author
  - spec_validate
  - spec_consider
  - spec_repair
  rules:
  - loop_guard:
      max_iterations: 64
      on_exhausted: human_decision
      reset_on: spec_repair
  - switch:
      on: verdict
      cases:
        AWAITING: final_review
        APPROVED: authoring_complete
        REVISE: spec_repair

- name: authoring_complete
  command: "true"
