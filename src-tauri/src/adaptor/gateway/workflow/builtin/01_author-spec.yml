# DesignSequence: 作成 -> 検証 -> 検討 -> 修正 -> 再検証
- name: design_author
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-write-design
  artifact: document-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_repair
  - behavior_author
  - behavior_repair
  - human_decision
  - final_review
  rules:
  - loop_guard:
      max_iterations: 16
      on_exhausted: human_decision
      reset_on: human_decision
  - switch:
      on: status
      cases:
        READY: design_validate
        NEEDS_HUMAN: human_decision

- name: design_validate
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-validate-design
  artifact: validation-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_repair
  - behavior_author
  - behavior_repair
  - design_author
  - design_repair
  rules:
  - next: design_consider

- name: design_consider
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-consider-design
  artifact: consideration-result
  inputs:
  - request
  - spec_intake
  - design_validate
  rules:
  - switch:
      on: verdict
      cases:
        PASS: full_spec_validate
        FIX_REQUIREMENTS: requirements_repair
        FIX_BEHAVIOR: behavior_repair
        FIX_DESIGN: design_repair
        NEEDS_HUMAN: human_decision

- name: design_repair
  session:
    model: gpt-5.6-sol
    permission: edit
    gate: auto
    facets:
      policy: author-spec-governance
      knowledge:
      - spec-requirements
      - spec-behavior
      - spec-design
      instruction: author-spec-repair-design
  artifact: repair-result
  inputs:
  - request
