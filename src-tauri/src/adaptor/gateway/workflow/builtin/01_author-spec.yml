      instruction: author-spec-validate-behavior
  artifact: validation-result
  inputs:
  - request
  - spec_intake
  - requirements_author
  - requirements_repair
  - behavior_author
  - behavior_repair
  rules:
  - next: behavior_consider

- name: behavior_consider
  session:
    model: gpt-5.6-sol
    permission: ask
    gate: auto
    facets:
