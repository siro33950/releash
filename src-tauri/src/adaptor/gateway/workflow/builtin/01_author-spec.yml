name: 01_author-spec
description: Issue、Story、または自由文RequestからRequirements・Behavior・Designを順番に作成し、検証・検討・修正の1回パスを経て、最後に人間が完成Specをレビューする。

schemas:
  workflow-text: string
  document-reference: string
  finding-id: string

  spec-finding:
    type: object
    properties:
      finding_id: string
      owner:
        type: string
        enum:
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
      problem: string
      evidence:
        type: array
        items: workflow-text
      required_change: string
    required:
    - finding_id
    - owner
    - problem
    - evidence
    - required_change

  spec-input:
    type: object
    properties:
      spec_dir: string
      primary_sources:
        type: array
        items: document-reference
      additional_sources:
        type: array
        items: document-reference
      request_items:
        type: array
        items: workflow-text
      summary: string
    required:
    - spec_dir
    - primary_sources
    - additional_sources
    - request_items
    - summary

  validation-result:
    type: object
    properties:
      findings:
        type: array
        items: spec-finding
      summary: string
    required:
    - findings
    - summary

  validation-scan:
    type: object
    properties:
      has_findings:
        type: boolean
    required:
    - has_findings

  consideration-result:
    type: object
    properties:
      accepted_finding_ids:
        type: array
        items: finding-id
      rejected_finding_ids:
        type: array
        items: finding-id
      summary: string
    required:
    - accepted_finding_ids
    - rejected_finding_ids
    - summary

  consideration-scan:
    type: object
    properties:
      has_accepted:
        type: boolean
    required:
    - has_accepted

  repair-result:
    type: object
    properties:
      changed_documents:
        type: array
        items: document-reference
      addressed_finding_ids:
        type: array
        items: finding-id
      summary: string
    required:
    - changed_documents
    - addressed_finding_ids
    - summary

nodes:
  # IntakeSequence: Requestを入力参照と配置先へ整理する。
  main:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: author-spec-governance
        instruction: author-spec-intake
    artifact: spec-input
    inputs:
    - request
    rules:
    - next: requirements_author

  # AuthoringSequence: 3文書を上流から順に作成する。検証は行わない。
  requirements_author:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: author-spec-governance
        knowledge: spec-requirements
        instruction: author-spec-write-requirements
    inputs:
    - main
    rules:
    - next: behavior_author

  behavior_author:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        instruction: author-spec-write-behavior
    inputs:
    - main
    rules:
    - next: design_author

  design_author:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-write-design
    inputs:
    - main
    rules:
    - next: spec_validate

  # SpecSequence: 3文書を1単位として検証・検討・修正を一度だけ行う。
  # 修正の確認と残る問題の裁定はFinalReviewの人間が行う。
  spec_validate:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-validate-spec
    artifact: validation-result
    inputs:
    - main
    rules:
    - next: check_validation

  check_validation:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node spec_validate --json |
      jq '{has_findings: (.artifact.findings | length > 0)}'
    artifact: validation-scan
    rules:
    - when:
        on: has_findings
        then: spec_consider
      next: final_review

  spec_consider:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-consider-spec
    artifact: consideration-result
    inputs:
    - main
    - spec_validate
    rules:
    - next: check_consideration

  check_consideration:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node spec_consider --json |
      jq '{has_accepted: (.artifact.accepted_finding_ids | length > 0)}'
    artifact: consideration-scan
    rules:
    - when:
        on: has_accepted
        then: spec_repair
      next: final_review

  spec_repair:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-repair-spec
    artifact: repair-result
    inputs:
    - main
    - spec_validate
    - spec_consider
    rules:
    - next: final_review

  # FinalReviewSequence: 通常経路で唯一の人間による文書レビュー。承認をもって完了する。
  final_review:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-final-review
    completion: approval
    inputs:
    - main
    - spec_validate
    - spec_consider
    - spec_repair
