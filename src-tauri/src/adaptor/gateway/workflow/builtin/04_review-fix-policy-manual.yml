name: 04_review-fix-policy-manual
description: open Review Threadの修正方針を1つのSessionで1件ずつ人間と合意しながら決定し、Human checkpointで承認する。

schemas:
  document-reference: string
  directive-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      has_open_threads:
        type: boolean
    required:
    - threads
    - has_open_threads

nodes:

  main:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: planning
        instruction: existing-spec-resolve-request
    artifact: implementation-context
    inputs:
    - request
    rules:
    - next: check_open_threads

  check_open_threads:
    command: >-
      releash review list --state open --json |
      jq '{threads: map({thread_id: .id}), has_open_threads: (length > 0)}'
    artifact: thread-scan
    rules:
    - when:
        on: has_open_threads
        then: decide_fix_policies_manual
      next: policy_confirmation
  decide_fix_policies_manual:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: triage
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        - releash-thread-cli
        instruction: existing-spec-decide-fix-policy-manual
    completion: approval
    inputs:
    - main
    - check_open_threads
    rules:
    - next: policy_confirmation
  policy_confirmation:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: policy-confirmation
    completion: approval
    inputs:
    - check_open_threads
