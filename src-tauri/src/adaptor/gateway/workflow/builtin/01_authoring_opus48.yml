name: 01_authoring_opus48
description: ユーザーとの対話を通じて requirements / behavior / design の Spec 3 文書をClaude系モデルで構築する。レビューループは行わない。
builtin: true
nodes:
- name: write_requirements
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-requirements
  output_contract: spec-directory
- name: write_behavior
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-behavior
  input_contracts:
  - spec-directory
  pass_output_from:
  - write_requirements
- name: write_design
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-write-design
  input_contracts:
  - spec-directory
  pass_output_from:
  - write_requirements
- name: spec_finalize
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: planning
      instruction: spec-authoring-finalize
  input_contracts:
  - spec-directory
  pass_output_from:
  - write_requirements
