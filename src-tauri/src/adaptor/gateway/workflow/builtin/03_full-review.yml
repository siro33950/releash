name: 03_full-review
description: 既存Specを入力として、FullReview（6観点×2モデル）と検証を実行し、open Threadを提示してHuman checkpointで承認する。

schemas:
  document-reference: string
  directive-text: string
  workflow-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  thread-id: string
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      has_open_threads:
        type: boolean
    required:
    - threads
    - has_open_threads

nodes:

- name: resolve_request
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: planning
      instruction: existing-spec-resolve-request
  artifact: implementation-context
  inputs:
  - request
  rules:
  - next: full_review_fanout

- name: full_review_fanout
  fanout:
    child:
    - full_review_acceptance_opus
    - full_review_acceptance_codex
    - full_review_structure_opus
    - full_review_structure_codex
    - full_review_quality_opus
    - full_review_quality_codex
    - full_review_test_opus
    - full_review_test_codex
    - full_review_security_opus
    - full_review_security_codex
    - full_review_architecture_opus
    - full_review_architecture_codex
  rules:
  - next: verify_full_review_fanout
- name: full_review_acceptance_opus
  session:
    model: claude-opus-5
    permission: edit
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-acceptance
  inputs:
  - resolve_request
- name: full_review_acceptance_codex
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-acceptance
  inputs:
  - resolve_request
- name: full_review_structure_opus
  session:
