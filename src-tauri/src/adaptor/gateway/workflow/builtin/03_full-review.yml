name: 03_full-review
description: 全観点を claude-opus-4-8 / gpt-5.6-sol でレビューし、モデル単位の妥当性チェックを行う。Summary 段では各 Open Thread の reviewer 指摘と verifier 分類を Thread 単位でまとめて人間に報告する（議論・Thread 投稿は行わない）。
builtin: true
nodes:
- name: review-fanout
  fanout:
    child:
    - review-acceptance-opus
    - review-acceptance-gpt55
    - review-structure-opus
    - review-structure-gpt55
    - review-quality-opus
    - review-quality-gpt55
    - review-test-opus
    - review-test-gpt55
    - review-security-opus
    - review-security-gpt55
    - review-architecture-opus
    - review-architecture-gpt55
  rules:
  - next: verify-and-classify
- name: review-acceptance-opus
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-acceptance
- name: review-acceptance-gpt55
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-acceptance
- name: review-structure-opus
