- name: verify_full_review_fanout
  fanout:
    child:
    - verify_full_review_opus
    - verify_full_review_codex
  rules:
  - next: check_full_review_threads
- name: verify_full_review_opus
  session:
    model: claude-opus-5
    permission: edit
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: full-review-verify-and-classify
  inputs:
  - resolve_request
- name: verify_full_review_codex
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: full-review-verify-and-classify
  inputs:
  - resolve_request
- name: check_full_review_threads
  command: >-
    releash review list --session-id "$RELEASH_SESSION_ID" --state open --json |
    jq '{threads: map({thread_id: .id}), has_open_threads: (length > 0)}'
  artifact: thread-scan
  rules:
  - next: review_confirmation
- name: review_confirmation
  session:
    model: gpt-5.6-sol
    permission: full
    gate: approval
    facets:
      policy: reporting
      knowledge: releash-thread-cli
      instruction: existing-spec-confirmation
  inputs:
  - resolve_request
