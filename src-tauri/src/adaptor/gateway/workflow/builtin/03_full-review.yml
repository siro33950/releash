name: 03_full-review
description: 全観点を claude-opus-4-8 / gpt-5.6-sol でレビューし、モデル単位の妥当性チェックを行う。Summary 段では各 Open Thread の reviewer 指摘と verifier 分類を Thread 単位でまとめて人間に報告する（議論・Thread 投稿は行わない）。
builtin: true
nodes:
- name: review-parallel
  fanout:
    parallel_children:
    - name: review-acceptance-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-acceptance
    - name: review-acceptance-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-acceptance
    - name: review-structure-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-structure
    - name: review-structure-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-structure
    - name: review-quality-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-quality
    - name: review-quality-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-quality
    - name: review-test-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-test
    - name: review-test-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-test
    - name: review-security-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-security
    - name: review-security-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-security
    - name: review-architecture-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-architecture
    - name: review-architecture-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-architecture
    aggregate:
      all_match: ".*"
      then: verify-and-classify
      else: verify-and-classify
- name: verify-and-classify
  fanout:
    parallel_children:
    - name: verify-opus
      model: claude-opus-4-8
      permission: edit
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: full-review-verify-and-classify
    - name: verify-gpt55
      model: gpt-5.5
      permission: full
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: full-review-verify-and-classify
    aggregate:
      all_match: ".*"
      then: reporting
      else: reporting
- name: reporting
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: reporting
      knowledge: releash-thread-cli
      instruction: full-review-summary
