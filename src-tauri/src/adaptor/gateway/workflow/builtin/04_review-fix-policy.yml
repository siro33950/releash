name: 04_review-fix-policy
description: フルレビューで残った Open Thread の修正方針を決定し、承認済み方針の整合性を確認する。
builtin: true
nodes:
- name: decide_policy
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: triage
      knowledge: releash-thread-cli
      instruction: review-fix-decide-policy
- name: policy_consistency_review
  session:
    model: gpt-5.5
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-fix-policy-consistency
  rules:
  - match: NEEDS_FIX
    next: decide_policy
  - match: LGTM
    next: summary
- name: summary
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      knowledge: releash-thread-cli
      instruction: review-fix-policy-summary
