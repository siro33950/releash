name: 04_review-fix-policy
description: フルレビューで残った Open Thread の修正方針を決定し、承認済み方針の整合性を確認する。
builtin: true
schemas:
  review-fix-policy-verdict:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - LGTM
        - NEEDS_FIX
      summary: string
    required:
    - verdict
    - summary
    additionalProperties: false
nodes:
- name: decide_policy
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: triage
      knowledge: releash-thread-cli
      instruction: review-fix-decide-policy
  rules:
  - next: policy_consistency_review
- name: policy_consistency_review
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-fix-policy-consistency
  artifact: review-fix-policy-verdict
  rules:
  - loop_guard: { max_iterations: 5, on_exhausted: summary }
  - switch:
      on: verdict
      cases:
        NEEDS_FIX: decide_policy
        LGTM: summary
- name: summary
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      knowledge: releash-thread-cli
      instruction: review-fix-policy-summary
