name: 06_verify-review-comments
description: GitHub PR の unresolved review comment を Releash Thread に取り込み、review-fix 相当で対応後、commit/push して PR comment へまとめて返信する。
builtin: true
schemas:
  review-fix-task-text: string
  review-fix-task:
    type: object
    properties:
      task_id: string
      thread_id: string
      file: string
      objective: string
      acceptance_criteria:
        type: array
        items: review-fix-task-text
      non_goals:
        type: array
        items: review-fix-task-text
      source_policy: string
      problem: string
      expected: string
      actual: string
    required:
    - task_id
    - thread_id
    - file
    - objective
    - source_policy
    - problem
    - expected
    - actual
    additionalProperties: false
  review-fix-tasks:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - LGTM
        - NEEDS_FIX
      tasks:
        type: array
        items: review-fix-task
      summary: string
    required:
    - verdict
    - tasks
    - summary
    additionalProperties: false
nodes:
- name: import_pr_review_comments
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: verify-review-comments-import
  rules:
  - next: decide_pr_review_comment_policy
- name: decide_pr_review_comment_policy
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: triage
      knowledge: releash-thread-cli
      instruction: verify-review-comments-decide-policy
  rules:
  - next: check_and_make_tasks
- name: check_and_make_tasks
  session:
    model: claude-opus-4-8
    permission: edit
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-fix-check-tasks
  artifact: review-fix-tasks
  rules:
  - switch:
      on: verdict
      cases:
        NEEDS_FIX: implement_tasks
        LGTM: commit_push_and_reply
- name: implement_tasks
  session:
    model: gpt-5.6-sol
    permission: full
    gate: auto
    facets:
      policy: coding
      instruction: review-fix
  inputs:
  - check_and_make_tasks
  rules:
  - loop_guard: { max_iterations: 5, on_exhausted: commit_push_and_reply }
  - next: check_and_make_tasks
- name: commit_push_and_reply
  session:
    model: claude-opus-4-8
    permission: edit
    gate: approval
    facets:
      policy: coding
      knowledge: releash-thread-cli
      instruction: verify-review-comments-commit-push-reply
