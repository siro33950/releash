name: 05_review-fix_codex
description: フルレビューで残った Open Thread の [FIX_POLICY_APPROVED] 方針と実装差分を GPT 系モデルで確認して不足を Task 化し、Task 実装ループで方針との合致を保証する。最後に人間が承認した Thread を resolve する。
builtin: true
schemas:
  review-fix-task-text: string
  review-fix-task:
    type: object
    properties:
      task_id: string
      thread_id: string
      file: string
      objective: string
      acceptance_criteria:
        type: array
        items: review-fix-task-text
      non_goals:
        type: array
        items: review-fix-task-text
      source_policy: string
      problem: string
      expected: string
      actual: string
    required:
    - task_id
    - thread_id
    - file
    - objective
    - source_policy
    - problem
    - expected
    - actual
    additionalProperties: false
  review-fix-tasks:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - LGTM
        - NEEDS_FIX
      tasks:
        type: array
        items: review-fix-task
      summary: string
    required:
    - verdict
    - tasks
    - summary
    additionalProperties: false
nodes:
- name: check_and_make_tasks
  session:
    model: gpt-5.5
    permission: full
    gate: auto
    facets:
      policy: reviewing
      knowledge: releash-thread-cli
      instruction: review-fix-check-tasks
  artifact: review-fix-tasks
  rules:
  - match: NEEDS_FIX
    next: implement_tasks
  - match: LGTM
    next: report
- name: implement_tasks
  session:
    model: gpt-5.5
    permission: full
    gate: auto
    facets:
      policy: coding
      instruction: review-fix
  inputs:
  - check_and_make_tasks
  rules:
  - match: ".*"
    next: check_and_make_tasks
  cycle_guard:
    max_iterations: 5
    on_exhausted: report
- name: report
  session:
    model: gpt-5.5
    permission: full
    gate: approval
    facets:
      knowledge: releash-thread-cli
      instruction: review-fix-report
