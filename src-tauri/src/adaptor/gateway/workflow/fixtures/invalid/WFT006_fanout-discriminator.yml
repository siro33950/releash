name: fanout-discriminator
description: fanout nodes cannot use discriminator rules
nodes:
  main:
    sequence:
      children:
      - dispatch:
          rules:
          - when:
              on: passed
              then: done
            next: done
      - done
  dispatch:
    fanout:
      children:
      - child
  child:
    session:
      provider: claude
      facets:
        instruction: child
  done:
    session:
      provider: claude
      facets:
        instruction: done
