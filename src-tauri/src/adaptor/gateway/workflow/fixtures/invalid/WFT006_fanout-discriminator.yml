name: fanout-discriminator
description: fanout nodes cannot use discriminator rules
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
    required:
      - passed
nodes:
  main:
    artifact: verdict
    fanout:
      child: child
    rules:
      - when:
          on: passed
          then: done
        next: done
  child:
    session:
      provider: claude
      facets:
        instruction: child
  done:
    session:
      provider: claude
      facets:
        instruction: done
