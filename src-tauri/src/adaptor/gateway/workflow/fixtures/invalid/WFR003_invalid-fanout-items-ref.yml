name: invalid-fanout-items-ref
description: fanout items must resolve to a declared artifact array field
schemas:
  source-output:
    type: object
    properties:
      values:
        type: string
    required:
      - values
  target:
    type: string
nodes:
  main:
    artifact: source-output
    command: echo source
    rules:
      - next: dispatch
  dispatch:
    fanout:
      child: worker
      items: main.missing
  worker:
    input:
      - item: target
    command: echo {{ item }}
