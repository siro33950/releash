name: multi-segment-switch-non-object
description: nested switch reference traverses a scalar
schemas:
  output:
    type: object
    properties:
      route: string
nodes:
  main:
    sequence:
      children:
      - source:
          rules:
          - switch:
              on: route.status
              cases:
                ready: target
      - target
  source:
    command: source
    artifact: output
  target:
    command: target
