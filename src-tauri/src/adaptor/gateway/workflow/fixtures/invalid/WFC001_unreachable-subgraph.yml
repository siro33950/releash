name: unreachable-subgraph
description: unreachable subgraph edges do not make targets reachable
nodes:
  - name: entry
    session:
      provider: claude
      gate: auto
      facets:
        instruction: entry
  - name: orphan
    session:
      provider: claude
      gate: auto
      facets:
        instruction: orphan
    rules:
      - next: target
  - name: target
    session:
      provider: claude
      gate: auto
      facets:
        instruction: target
