name: unreachable-subgraph
description: unreachable subgraph edges do not make targets reachable
nodes:
  main:
    session:
      provider: claude
      facets:
        instruction: entry
  orphan:
    session:
      provider: claude
      facets:
        instruction: orphan
    rules:
      - next: target
  target:
    session:
      provider: claude
      facets:
        instruction: target
