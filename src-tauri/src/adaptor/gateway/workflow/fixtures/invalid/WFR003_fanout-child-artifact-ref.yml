name: fanout-child-artifact-ref
description: child artifacts are available only through the parent array
schemas:
  result:
    type: object
    properties:
      verdict:
        type: string
    required:
      - verdict
nodes:
  main:
    fanout:
      child: worker
    rules:
      - next: consume
  worker:
    artifact: result
    command: echo work
  consume:
    command: echo {{ worker.verdict }}
