name: fanout-child-artifact-ref
description: child artifacts are available only through the parent array
schemas:
  text: string
  result:
    type: object
    properties:
      targets:
        type: array
        items: text
    required:
    - targets
nodes:
  main:
    sequence:
      children:
      - dispatch
      - relay
  dispatch:
    fanout:
      children:
      - worker
  worker:
    artifact: result
    command: echo work
  relay:
    fanout:
      children:
      - leaf
      items: worker.targets
  leaf:
    input:
    - item: text
    command: echo {{ item }}
