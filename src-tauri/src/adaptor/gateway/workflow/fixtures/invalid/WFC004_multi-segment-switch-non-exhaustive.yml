name: multi-segment-switch-non-exhaustive
description: nested switch omits an enum case without a catch-all
schemas:
  output:
    type: object
    properties:
      route:
        type: object
        properties:
          status:
            type: string
            enum: [ready, blocked]
        required: [status]
nodes:
  main:
    sequence:
      children:
      - source:
          rules:
          - switch:
              on: route.status
              cases:
                ready: target
      - target
  source:
    command: source
    artifact: output
  target:
    command: target
