name: fanout-inputs
description: fanout node must not declare inputs
nodes:
  - name: fanout
    fanout:
      child:
        - lint
        - test
    inputs:
      - request
    rules:
      - next: done
  - name: lint
    command: cargo clippy
  - name: test
    command: cargo test
  - name: done
    command: echo done
