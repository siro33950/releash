name: discriminator-catch-all-must-be-sibling
description: a when catch-all cannot be a separate next rule element
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
    required:
      - passed
nodes:
  main:
    artifact: verdict
    command: printf '{"passed":true}'
    rules:
      - when:
          on: passed
          then: done
      - next: fix
  done:
    command: printf done
  fix:
    command: printf fix
