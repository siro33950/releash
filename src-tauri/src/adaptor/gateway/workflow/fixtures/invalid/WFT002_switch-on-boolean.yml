name: switch-on-boolean
description: switch.on must be enum
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
    required:
    - passed
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - switch:
              on: passed
              cases:
                "true": done
            next: done
      - done
  judge:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
  done:
    session:
      provider: claude
      facets:
        instruction: done
