name: when-on-enum
description: when.on must be boolean
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
          - done
          - retry
    required:
      - decision
nodes:
  - name: judge
    artifact: verdict
    session:
      provider: claude
      gate: auto
      facets:
        instruction: judge
    rules:
      - when:
          on: decision
          then: done
        next: done
  - name: done
    session:
      provider: claude
      gate: auto
      facets:
        instruction: done
