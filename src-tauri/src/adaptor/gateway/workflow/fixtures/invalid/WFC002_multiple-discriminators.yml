name: multiple-discriminators
description: only one discriminator rule is allowed
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
      decision:
        type: string
        enum:
          - done
          - fix
    required:
      - passed
      - decision
nodes:
  - name: judge
    artifact: verdict
    session:
      provider: claude
      gate: auto
      facets:
        instruction: judge
    rules:
      - when:
          on: passed
          then: done
        next: fix
      - switch:
          on: decision
          cases:
            done: done
            fix: fix
  - name: done
    session:
      provider: claude
      gate: auto
      facets:
        instruction: done
  - name: fix
    session:
      provider: claude
      gate: auto
      facets:
        instruction: fix
