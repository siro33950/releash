name: switch-missing-cases
description: non-exhaustive switch requires next
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
          - done
          - fix
    required:
      - decision
nodes:
  main:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
    rules:
      - switch:
          on: decision
          cases:
            done: done
  done:
    session:
      provider: claude
      facets:
        instruction: done
