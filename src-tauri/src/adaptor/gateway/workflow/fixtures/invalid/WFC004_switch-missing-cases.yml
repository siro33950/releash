name: switch-missing-cases
description: non-exhaustive switch requires next
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
        - done
        - fix
    required:
    - decision
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - switch:
              on: decision
              cases:
                done: done
      - done
  judge:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
  done:
    session:
      provider: claude
      facets:
        instruction: done
