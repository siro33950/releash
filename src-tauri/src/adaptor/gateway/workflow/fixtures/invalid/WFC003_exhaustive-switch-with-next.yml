name: exhaustive-switch-with-next
description: exhaustive switch rejects a redundant next catch-all
schemas:
  route:
    type: object
    properties:
      verdict:
        type: string
        enum: [SHIP, HOLD]
    required: [verdict]
nodes:
  - name: judge
    artifact: route
    session:
      provider: claude
      gate: auto
      facets:
        instruction: judge
    rules:
      - switch:
          on: verdict
          cases:
            SHIP: shipped
            HOLD: held
        next: fallback
  - name: shipped
    session:
      provider: claude
      gate: auto
      facets:
        instruction: shipped
  - name: held
    session:
      provider: claude
      gate: auto
      facets:
        instruction: held
  - name: fallback
    session:
      provider: claude
      gate: auto
      facets:
        instruction: fallback
