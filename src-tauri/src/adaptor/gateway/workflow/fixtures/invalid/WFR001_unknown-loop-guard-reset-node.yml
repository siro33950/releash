name: unknown-loop-guard-reset-node
description: loop_guard.reset_on points to a missing node
nodes:
  main:
    sequence:
      children:
      - implement:
          rules:
          - loop_guard:
              max_iterations: 2
              on_exhausted: done
              reset_on: missing-boundary
          - next: done
      - done
  implement:
    session:
      provider: claude
      facets:
        instruction: implement
  done:
    session:
      provider: claude
      facets:
        instruction: implement
