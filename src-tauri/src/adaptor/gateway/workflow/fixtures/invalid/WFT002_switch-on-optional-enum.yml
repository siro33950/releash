name: switch-on-optional-enum
description: switch routing fields must be required by their Contract
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
        - done
        - fix
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - switch:
              on: decision
              cases:
                done: done
                fix: fix
      - done
      - fix
  judge:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
  done:
    command: printf done
  fix:
    command: printf fix
