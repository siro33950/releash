name: when-on-optional-boolean
description: when routing fields must be required by their Contract
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
nodes:
  main:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
    rules:
      - when:
          on: passed
          then: done
        next: fix
  done:
    command: printf done
  fix:
    command: printf fix
