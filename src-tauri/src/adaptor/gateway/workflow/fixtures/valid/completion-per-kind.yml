name: completion-per-kind
description: completion approval on command, fanout, and session nodes
nodes:
  main:
    sequence:
      children:
      - build
      - dispatch
      - review
  build:
    command: printf build
    completion:
      require: approval
  dispatch:
    fanout:
      children:
      - worker
    completion:
      require: approval
  worker:
    command: printf work
  review:
    session:
      provider: claude
      facets:
        instruction: review
    completion:
      require: approval
