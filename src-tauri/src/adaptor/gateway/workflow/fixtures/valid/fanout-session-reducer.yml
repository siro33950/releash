name: fanout-session-reducer
description: session reducer folds a fanout Artifact array into an enum Artifact
schemas:
  review-verdict:
    type: object
    properties:
      lgtm:
        type: boolean
    required:
    - lgtm
  review-decision:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - READY
        - NEEDS_FIX
    required:
    - verdict
nodes:
  main:
    sequence:
      children:
      - dispatch
      - judge:
          inputs:
            reviews: dispatch
          rules:
          - switch:
              on: verdict
              cases:
                READY: ready
                NEEDS_FIX: fix
      - ready:
          rules: []
      - fix
  dispatch:
    fanout:
      children:
      - review-a
      - review-b
  review-a:
    command: >-
      printf '{"lgtm":true}'
    artifact: review-verdict
  review-b:
    command: >-
      printf '{"lgtm":false}'
    artifact: review-verdict
  judge:
    session:
      provider: claude
      facets:
        instruction: reduce-review-verdicts
    input:
    - reviews
    artifact: review-decision
  ready:
    command: printf ready
  fix:
    command: printf fix
