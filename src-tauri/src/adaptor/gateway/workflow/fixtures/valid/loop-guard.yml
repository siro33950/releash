name: loop-guard
description: a reachable cycle is bounded by loop_guard
nodes:
  main:
    command: test -f Cargo.toml
    rules:
      - next: fix
  fix:
    command: printf fix
    rules:
      - loop_guard:
          max_iterations: 2
          on_exhausted: give-up
      - next: main
  give-up:
    command: printf give-up
