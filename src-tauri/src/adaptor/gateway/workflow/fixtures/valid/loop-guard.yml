name: loop-guard
description: a reachable cycle is bounded by loop_guard
nodes:
  main:
    sequence:
      children:
      - check
      - fix:
          rules:
          - loop_guard:
              max_iterations: 2
              on_exhausted: give-up
          - next: check
      - give-up
  check:
    command: test -f Cargo.toml
  fix:
    command: printf fix
  give-up:
    command: printf give-up
