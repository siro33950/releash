name: canonical-syntax-surface
description: canonical Contract, reference, permission, facet, completion, fanout, and routing surface
schemas:
  text: string
  target:
    type: object
    properties:
      path: string
      enabled:
        type: boolean
      count:
        type: integer
      ratio:
        type: number
      labels:
        type: array
        items: text
    required:
      - path
      - enabled
      - count
      - ratio
      - labels
  target-list:
    type: object
    properties:
      targets:
        type: array
        items: target
    required:
      - targets
  route:
    type: object
    properties:
      verdict:
        type: string
        enum:
          - SHIP
          - HOLD
    required:
      - verdict
nodes:
  main:
    command: "printf '%s' '{{ request }}'"
    artifact: target-list
    inputs:
      - request
    rules:
      - next: dispatch
  dispatch:
    fanout:
      child: worker
      items: main.targets
    rules:
      - next: judge
  worker:
    command: "printf '%s' '{{ item }} {{ item.path }}'"
    input:
      - item: target
  judge:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reviewing
        knowledge: releash-thread
        instruction: choose-route
    artifact: route
    inputs:
      - dispatch
    rules:
      - switch:
          on: verdict
          cases:
            SHIP: approved
        next: review
  approved:
    session:
      provider: claude
      facets:
        instruction: approved
  review:
    session:
      provider: claude
      facets:
        instruction: review
    completion: approval
    inputs:
      - judge
    rules:
      - next: done
  done:
    command: "printf '%s' '{{ judge.verdict }}'"
    inputs:
      - judge
