name: canonical-syntax-surface
description: canonical Contract, reference, permission, facet, completion, sequence, fanout, and routing surface
schemas:
  text: string
  target:
    type: object
    properties:
      path: string
      enabled:
        type: boolean
      count:
        type: integer
      ratio:
        type: number
      labels:
        type: array
        items: text
    required:
    - path
    - enabled
    - count
    - ratio
    - labels
  target-list:
    type: object
    properties:
      targets:
        type: array
        items: target
    required:
    - targets
  route:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - SHIP
        - HOLD
    required:
    - verdict
nodes:
  main:
    sequence:
      children:
      - collect:
          inputs:
            goal: request
      - dispatch
      - judge:
          inputs:
            results: dispatch
          rules:
          - switch:
              on: verdict
              cases:
                SHIP: approved
            next: review
      - approved:
          rules: []
      - review:
          rules:
          - loop_guard:
              max_iterations: 2
              on_exhausted: done
          - next: judge
      - done:
          inputs:
            outcome: judge
  collect:
    command: "printf '%s' '{{ goal }}'"
    input:
    - goal
    artifact: target-list
  dispatch:
    fanout:
      children:
      - worker:
          inputs:
            target: items
      items: collect.targets
  worker:
    command: "printf '%s' '{{ target }} {{ target.path }}'"
    input:
    - target: target
  judge:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread
        instruction: choose-route
    input:
    - results
    artifact: route
  approved:
    session:
      provider: claude
      facets:
        instruction: approved
  review:
    session:
      provider: claude
      facets:
        instruction: review
    completion: approval
  done:
    command: "printf '%s' '{{ outcome.verdict }}'"
    input:
    - outcome: route
