name: fanout-items-reference
description: valid fanout with artifact field items
schemas:
  target:
    type: string
  source-output:
    type: object
    properties:
      targets:
        type: array
        items: target
    required:
      - targets
nodes:
  main:
    artifact: source-output
    command: echo source
    rules:
      - next: dispatch
  dispatch:
    fanout:
      child: worker
      items: main.targets
  worker:
    input:
      - item: target
    command: echo {{ item }}
