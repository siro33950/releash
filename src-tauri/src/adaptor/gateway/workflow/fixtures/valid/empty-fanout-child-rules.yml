name: empty-fanout-child-rules
description: empty items complete without invoking any child and the parent sequence routes past the fanout
schemas:
  item-text: string
nodes:
  main:
    sequence:
      children:
      - dispatch
      - done
  dispatch:
    fanout:
      children:
      - worker
      items: []
  worker:
    command: "printf '%s' '{{ item }}'"
    input:
    - item: item-text
  done:
    command: printf done
