name: fanout-command-reducer
description: command reducer folds a fanout Artifact array into a boolean Artifact
schemas:
  review-verdict:
    type: object
    properties:
      lgtm:
        type: boolean
    required:
    - lgtm
  judge-result:
    type: object
    properties:
      all_lgtm:
        type: boolean
    required:
    - all_lgtm
nodes:
  main:
    sequence:
      children:
      - dispatch
      - judge:
          inputs:
            reviews: dispatch
          rules:
          - when:
              on: all_lgtm
              then: ready
            next: fix
      - ready:
          rules: []
      - fix
  dispatch:
    fanout:
      children:
      - review-a
      - review-b
  review-a:
    command: >-
      printf '{"lgtm":true}'
    artifact: review-verdict
  review-b:
    command: >-
      printf '{"lgtm":false}'
    artifact: review-verdict
  judge:
    command: "echo '{{ reviews }}' | jq '{all_lgtm: all(.[]; .lgtm)}'"
    input:
    - reviews
    artifact: judge-result
  ready:
    command: printf ready
  fix:
    command: printf fix
