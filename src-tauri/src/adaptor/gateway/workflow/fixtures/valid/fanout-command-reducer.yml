name: fanout-command-reducer
description: command reducer folds a fanout Artifact array into a boolean Artifact
schemas:
  review-verdict:
    type: object
    properties:
      lgtm:
        type: boolean
    required:
      - lgtm
  judge-result:
    type: object
    properties:
      all_lgtm:
        type: boolean
    required:
      - all_lgtm
nodes:
  main:
    fanout:
      child:
        - review-a
        - review-b
    rules:
      - next: judge
  review-a:
    command: >-
      printf '{"lgtm":true}'
    artifact: review-verdict
  review-b:
    command: >-
      printf '{"lgtm":false}'
    artifact: review-verdict
  judge:
    command: "echo '{{ main }}' | jq '{all_lgtm: all(.[]; .lgtm)}'"
    inputs:
      - main
    artifact: judge-result
    rules:
      - when:
          on: all_lgtm
          then: ready
        next: fix
  ready:
    command: printf ready
  fix:
    command: printf fix
