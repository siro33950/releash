name: fanout-items-matrix
description: valid fanout matrix with literal items
schemas:
  target:
    type: object
    properties:
      path:
        type: string
    required:
    - path
nodes:
  main:
    sequence:
      children:
      - dispatch
      - done
  dispatch:
    fanout:
      children:
      - lint
      - test
      items:
      - path: src/lib.rs
      - path: src/main.rs
  lint:
    input:
    - item: target
    command: echo {{ item.path }}
  test:
    input:
    - item: target
    command: echo {{ item.path }}
  done:
    command: echo done
