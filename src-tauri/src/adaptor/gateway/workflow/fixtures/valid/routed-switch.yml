name: routed-switch
description: valid switch routing
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
          - done
          - retry
    required:
      - decision
nodes:
  main:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
    rules:
      - switch:
          on: decision
          cases:
            done: done
            retry: retry
  done:
    session:
      provider: claude
      facets:
        instruction: done
  retry:
    session:
      provider: claude
      facets:
        instruction: retry
