name: claude-review
description: 全観点をClaude系モデルでレビューし、Summary 段では各 Open Thread の reviewer 指摘を Thread 単位でまとめて人間に報告する（議論・Thread 投稿は行わない）。
builtin: true

nodes:
  # ===== Posting phase: 6 viewpoints × 1 GPT backend = 6 reviewers in parallel =====
  - name: review-parallel
    type: parallel
    parallel_children:
      - name: review-acceptance-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-acceptance
      - name: review-structure-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-structure
      - name: review-quality-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-quality
      - name: review-test-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-test
      - name: review-security-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-security
      - name: review-architecture-claude
        type: agent
        model: claude-opus-4-8
        permission: edit
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-architecture
    aggregate:
      all_match: ".*"
      then: reporting
      else: reporting

  - name: reporting
    type: approval
    model: claude-opus-4-8
    permission: edit
    policy: reporting
    knowledge: releash-thread-cli
    instruction: review-summary
