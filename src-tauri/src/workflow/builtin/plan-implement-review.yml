name: plan-implement-review
description: Plan → implement → review → fix loop
builtin: true

steps:
  - name: plan
    mode: interactive
    prompt:
      template: planner

  - name: implement
    mode: auto
    prompt:
      template: coder

  - name: review
    mode: auto
    prompt:
      template: reviewer
    rules:
      - match: NEEDS_FIX
        next: implement
      - match: LGTM
        next: report
    cycle_guard:
      max_iterations: 5

  - name: report
    mode: approval
    prompt:
      template: reporter
