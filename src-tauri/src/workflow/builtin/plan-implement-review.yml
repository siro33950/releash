name: plan-implement-review
description: Plan → implement → review → fix loop
builtin: true

steps:
  - name: plan
    mode: interactive
    persona: planner
    instruction: plan

  - name: implement
    mode: auto
    persona: coder
    instruction: implement
    policy: coding

  - name: review
    mode: auto
    persona: reviewer
    instruction: review
    policy: review
    rules:
      - match: NEEDS_FIX
        next: implement
      - match: LGTM
        next: report
    cycle_guard:
      max_iterations: 5

  - name: report
    mode: approval
    instruction: report
