name: bug-fix
description: Bug fix workflow (investigate → approve fix plan → fix → review → approve)
builtin: true

# 起動時の task にはバグ症状・再現手順を記述する想定。
# 例: "ログイン後に /dashboard へ遷移すると 500 エラー。再現: ..."

nodes:
  # 1. 原因調査（agent、readonly）
  - name: bug_investigation
    type: agent
    model: default
    permission: readonly
    instruction: bug-investigation
    policy: planning
    output_contract: bug-investigation-result

  # 2. 原因・修正方針の承認（approval）
  - name: bug_fix_policy
    type: approval
    model: default
    permission: readonly
    instruction: bug-fix-policy
    policy: planning
    input_contracts:
      - bug-investigation-result
    output_contract: approved-fix-policy
    pass_output_from:
      - bug_investigation
    rules:
      - match: reject
        next: bug_investigation

  # 3. 初回修正（agent、edit）
  - name: bug_fix
    type: agent
    model: default
    permission: edit
    instruction: bug-apply-fix
    policy: coding
    input_contracts:
      - approved-fix-policy
      - bug-investigation-result
    pass_output_from:
      - bug_investigation
      - bug_fix_policy

  # 4-5. 修正レビュー 3観点（parallel agent）+ 集約
  - name: bug_review_parallel
    type: parallel
    parallel_children:
      - name: bug_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: bug-review-acceptance
        policy: review
        input_contracts:
          - bug-investigation-result
        output_contract: review-verdict
        pass_output_from:
          - bug_investigation
          - bug_fix_loop_policy
      - name: bug_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: bug-review-quality
        policy: review
        input_contracts:
          - bug-investigation-result
        output_contract: review-verdict
        pass_output_from:
          - bug_investigation
          - bug_fix_loop_policy
      - name: bug_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: bug-review-test
        policy: review
        input_contracts:
          - bug-investigation-result
        output_contract: review-verdict
        pass_output_from:
          - bug_investigation
          - bug_fix_loop_policy
    aggregate:
      all_match: LGTM
      then: bug_final_approval
      else: bug_fix_loop_policy

  # 6. 追加修正方針確認（approval）
  - name: bug_fix_loop_policy
    type: approval
    model: default
    permission: readonly
    instruction: bug-fix-loop-policy
    policy: coding
    input_contracts:
      - bug-investigation-result
      - review-verdict
    output_contract: approved-fix-policy
    pass_output_from:
      - bug_investigation
      - bug_review_parallel
      - bug_final_approval
    rules:
      - match: reject
        next: bug_final_approval

  # 7. 追加修正（agent、edit、cycle_guard）
  - name: bug_fix_loop
    type: agent
    model: default
    permission: edit
    instruction: bug-fix-loop
    policy: coding
    input_contracts:
      - approved-fix-policy
      - bug-investigation-result
    pass_output_from:
      - bug_investigation
      - bug_fix_loop_policy
    rules:
      - match: NO_FIX_NEEDED
        next: bug_final_approval
      - match: ".*"
        next: bug_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: bug_final_approval

  # 8. 最終承認（approval）
  - name: bug_final_approval
    type: approval
    model: default
    permission: readonly
    instruction: bug-final-approval
    policy: coding
    input_contracts:
      - bug-investigation-result
      - review-verdict
    pass_output_from:
      - bug_investigation
      - bug_review_parallel
    resets_cycle_for:
      - bug_fix_loop
    rules:
      - match: reject
        next: bug_fix_loop_policy
