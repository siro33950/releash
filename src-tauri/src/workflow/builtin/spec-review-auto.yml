name: spec-review-auto
description: Spec-driven code review workflow without user approvals (auto policy decision + fix loop + summary)
builtin: true

nodes:
  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - fix_policy
    aggregate:
      all_match: LGTM
      then: review_summary
      else: fix_policy

  - name: fix_policy
    type: agent
    model: default
    permission: readonly
    instruction: fix-policy-auto
    policy: coding
    output_contract: approved-fix-policy
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - code_review_parallel

  - name: fix
    type: agent
    model: default
    permission: edit
    instruction: implement-fix
    policy: coding
    input_contracts:
      - spec-directory
      - approved-fix-policy
    pass_output_from:
      - fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: review_summary
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: review_summary

  - name: review_summary
    type: agent
    model: default
    permission: readonly
    instruction: review-summary
    policy: review
    input_contracts:
      - spec-directory
      - review-verdict
      - approved-fix-policy
    pass_output_from:
      - code_review_parallel
      - fix_policy
