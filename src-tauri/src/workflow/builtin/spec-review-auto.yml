name: spec-review-auto
description: Spec-driven code review workflow without user approvals (auto policy decision + fix loop + summary)
builtin: true

# 起動時の task には Spec ファイルパスを記述する想定（例: "Spec: docs/spec/issues-123.md"）。
# 各 step は `input_contracts` で入力データ仕様を宣言する（[02] Contract 双方向対称性）。
# spec-review.yml と異なり、approval node を一切持たず、自動で fix まで進む。
#
# 注意: code_review_parallel の children では approved-fix-policy を input_contracts に
# 含めない。初回レビュー時には fix_policy が未実行で実値が届かないため、input_contracts
# は実行時に必ず届くデータ仕様だけを宣言する原則に従う（再レビュー時の実値注入は
# pass_output_from が担保する）。

nodes:
  # 1. コードレビュー 6観点（parallel agent）+ 集約
  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - fix_policy
    aggregate:
      all_match: LGTM
      then: review_summary
      else: fix_policy

  # 2. 修正方針の妥当性検証・自動決定（agent、readonly）
  #    承認 node ではなく agent。レビュー指摘の妥当性を1件ずつ検証し、
  #    action: fix / skip を自動決定して approved-fix-policy を出力する。
  - name: fix_policy
    type: agent
    model: default
    permission: readonly
    instruction: fix-policy-auto
    policy: coding
    output_contract: approved-fix-policy
    input_contracts:
      - spec-file-path
      - review-verdict
    pass_output_from:
      - code_review_parallel

  # 3. 修正（agent、edit）
  #    既存 implement-fix を流用（approved-fix-policy を受け取る設計のため）。
  - name: fix
    type: agent
    model: default
    permission: edit
    instruction: implement-fix
    policy: coding
    input_contracts:
      - spec-file-path
      - approved-fix-policy
    pass_output_from:
      - fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: review_summary
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: review_summary

  # 4. 最終要約（agent、readonly）— 終端
  - name: review_summary
    type: agent
    model: default
    permission: readonly
    instruction: review-summary
    policy: review
    input_contracts:
      - spec-file-path
      - review-verdict
      - approved-fix-policy
    pass_output_from:
      - code_review_parallel
      - fix_policy
