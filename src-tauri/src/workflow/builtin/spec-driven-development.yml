name: spec-driven-development
description: Spec-driven development workflow (requirements → behavior → architecture → review → implement → review → approve)
builtin: true

nodes:
  # 1. 要求整理（approval、Spec作成）
  - name: plan_requirements
    type: approval
    model: default
    permission: edit
    instruction: plan-requirements
    policy: planning
    output_contract: spec-file-path

  # 2. 振る舞い定義（approval、Spec更新）
  - name: plan_behavior
    type: approval
    model: default
    permission: edit
    instruction: plan-behavior
    policy: planning
    pass_output_from:
      - plan_requirements

  # 3. アーキテクチャ概要（approval、Spec更新）
  - name: plan_architecture
    type: approval
    model: default
    permission: edit
    instruction: plan-architecture
    policy: planning
    pass_output_from:
      - plan_requirements

  # 4-5. アーキテクチャ概要レビュー 4観点（parallel agent）+ 集約
  - name: plan_review_parallel
    type: parallel
    parallel_children:
      - name: plan_review_completeness
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: plan-review-completeness
        policy: plan-review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - plan_fix_policy
      - name: plan_review_clarity
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: plan-review-clarity
        policy: plan-review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - plan_fix_policy
      - name: plan_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: plan-review-security
        policy: plan-review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - plan_fix_policy
      - name: plan_review_consistency
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: plan-review-consistency
        policy: plan-review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - plan_fix_policy
    aggregate:
      all_match: LGTM
      then: plan_approval
      else: plan_fix_policy

  # 6. Plan修正方針確認（approval）
  - name: plan_fix_policy
    type: approval
    model: default
    permission: readonly
    instruction: plan-fix-policy
    policy: planning
    output_contract: approved-fix-policy
    pass_output_from:
      - plan_requirements
      - plan_review_parallel
      - plan_approval
    rules:
      - match: reject
        next: plan_approval

  # 7. アーキテクチャ概要修正（agent、Spec更新）
  - name: plan_fix
    type: agent
    model: default
    permission: edit
    instruction: plan-fix
    policy: planning
    pass_output_from:
      - plan_requirements
      - plan_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: plan_approval
      - match: ".*"
        next: plan_review_parallel
    cycle_guard:
      max_iterations: 2
      on_exhausted: plan_approval

  # 8. アーキテクチャ概要承認（approval）
  - name: plan_approval
    type: approval
    model: default
    permission: readonly
    instruction: plan-approval
    policy: planning
    pass_output_from:
      - plan_requirements
      - plan_review_parallel
    resets_cycle_for:
      - plan_fix
    rules:
      - match: reject
        next: plan_fix_policy

  # 9. 実装（agent）
  - name: implement
    type: agent
    model: default
    permission: edit
    instruction: implement
    policy: coding
    pass_output_from:
      - plan_requirements

  # 10-11. コードレビュー 6観点（parallel agent）+ 集約
  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        pass_output_from:
          - plan_requirements
          - implementation_fix_policy
    aggregate:
      all_match: LGTM
      then: implementation_approval
      else: implementation_fix_policy

  # 12. 実装修正方針確認（approval）
  - name: implementation_fix_policy
    type: approval
    model: default
    permission: readonly
    instruction: implementation-fix-policy
    policy: coding
    output_contract: approved-fix-policy
    pass_output_from:
      - plan_requirements
      - code_review_parallel
      - implementation_approval
    rules:
      - match: reject
        next: implementation_approval

  # 13. 修正（agent）
  - name: fix
    type: agent
    model: default
    permission: edit
    instruction: implement-fix
    policy: coding
    pass_output_from:
      - plan_requirements
      - implementation_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: implementation_approval
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: implementation_approval

  # 14. 実装結果承認（approval）
  - name: implementation_approval
    type: approval
    model: default
    permission: readonly
    instruction: implementation-approval
    policy: coding
    pass_output_from:
      - plan_requirements
      - code_review_parallel
    resets_cycle_for:
      - fix
    rules:
      - match: reject
        next: implementation_fix_policy
