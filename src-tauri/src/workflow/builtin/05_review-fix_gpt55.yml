name: 05_review-fix_gpt55
description: フルレビューで残った Open Thread の [FIX_POLICY_APPROVED] 方針に従って GPT 系モデルで実装し、方針一致レビューループで実装と方針の合致を保証する。最後に人間が承認した Thread を resolve する。
builtin: true

nodes:
  - name: implement
    type: agent
    model: gpt-5.5
    permission: full
    instruction: review-fix
    policy: coding
    knowledge: releash-thread-cli

  - name: policy_match_review
    type: agent
    model: gpt-5.5
    permission: full
    instruction: review-fix-policy-match
    output_contract: review-fix-policy-match
    policy: reviewing
    knowledge: releash-thread-cli
    rules:
      - match: NEEDS_FIX
        next: rework
      - match: LGTM
        next: report

  - name: rework
    type: agent
    model: gpt-5.5
    permission: full
    instruction: review-fix
    policy: coding
    knowledge: releash-thread-cli
    pass_output_from:
      - policy_match_review
    rules:
      - match: ".*"
        next: policy_match_review
    cycle_guard:
      max_iterations: 5
      on_exhausted: report

  - name: report
    type: approval
    model: gpt-5.5
    permission: full
    instruction: review-fix-report
    knowledge: releash-thread-cli
