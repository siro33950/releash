name: spec-plan
description: Spec planning workflow (requirements → behavior → design → spec review → approve)
builtin: true

nodes:
  - name: write_requirements
    type: approval
    model: default
    permission: edit
    instruction: write-requirements
    policy: planning
    output_contract: spec-directory

  - name: write_behavior
    type: approval
    model: default
    permission: edit
    instruction: write-behavior
    policy: planning
    input_contracts:
      - spec-directory
    pass_output_from:
      - write_requirements

  - name: write_design
    type: approval
    model: default
    permission: edit
    instruction: write-design
    policy: planning
    input_contracts:
      - spec-directory
    pass_output_from:
      - write_requirements

  - name: spec_review_parallel
    type: parallel
    parallel_children:
      - name: spec_review_requirements
        type: agent
        model: gpt-5.5
        permission: ask
        instruction: spec-review-requirements
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_behavior
        type: agent
        model: gpt-5.5
        permission: ask
        instruction: spec-review-behavior
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_design
        type: agent
        model: gpt-5.5
        permission: ask
        instruction: spec-review-design
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_consistency
        type: agent
        model: gpt-5.5
        permission: ask
        instruction: spec-review-consistency
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
    aggregate:
      all_match: LGTM
      then: approve_spec
      else: spec_fix_policy

  - name: spec_fix_policy
    type: approval
    model: default
    permission: ask
    instruction: spec-fix-policy
    policy: planning
    output_contract: approved-fix-policy
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - spec_review_parallel
      - approve_spec
    rules:
      - match: reject
        next: approve_spec

  - name: spec_fix
    type: agent
    model: default
    permission: edit
    instruction: spec-fix
    policy: planning
    input_contracts:
      - spec-directory
      - approved-fix-policy
    pass_output_from:
      - write_requirements
      - spec_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: approve_spec
      - match: ".*"
        next: spec_review_parallel
    cycle_guard:
      max_iterations: 2
      on_exhausted: approve_spec

  - name: approve_spec
    type: approval
    model: default
    permission: ask
    instruction: spec-approval
    policy: planning
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - spec_review_parallel
    resets_cycle_for:
      - spec_fix
    rules:
      - match: reject
        next: spec_fix_policy
