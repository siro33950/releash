name: 03_review
description: Fable と GPT-5.5 がそれぞれ 6 観点すべてを確認し、Summary 段では各 Open Thread の reviewer 指摘を Thread 単位でまとめて人間に報告する（議論・Thread 投稿は行わない）。
builtin: true

nodes:
  - name: review-parallel
    type: parallel
    parallel_children:
      - name: review-fable
        type: agent
        model: claude-fable-5
        permission: edit
        instruction: review-all
        policy: reviewing
        knowledge: releash-thread-cli

      - name: review-gpt55
        type: agent
        model: gpt-5.5
        permission: full
        instruction: review-all
        policy: reviewing
        knowledge: releash-thread-cli
    aggregate:
      all_match: ".*"
      then: reporting
      else: reporting

  - name: reporting
    type: approval
    model: gpt-5.5
    permission: edit
    policy: reporting
    knowledge: releash-thread-cli
    instruction: review-summary
