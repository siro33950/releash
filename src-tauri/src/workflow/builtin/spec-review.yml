name: spec-review
description: Spec-driven code review workflow (review against an approved Spec → fix loop → approve)
builtin: true

# 起動時の task には Spec ファイルパスを記述する想定（例: "Spec: docs/spec/issues-123.md"）。
# 各 step は `input_contracts: [spec-file-path]` で task からの入力データ仕様を宣言し、
# 後続 step は `pass_output_from` + `input_contracts: [approved-fix-policy]` で
# 前段ステップ出力の入力データ仕様を宣言する（[02] Contract 双方向対称性）。
#
# 注意: code_review_parallel は初回レビュー時には implementation_fix_policy が未実行のため、
# その時点では approved-fix-policy 入力が存在しない。input_contracts は実行時に必ず届く
# データ仕様だけを宣言する原則に従い、code_review_parallel の children では
# approved-fix-policy を input_contracts に含めない（pass_output_from は維持し、
# 再レビュー時に (not yet completed) ではなく実値が届く経路は engine が担保する）。

nodes:
  # 1. コードレビュー 6観点（parallel agent）+ 集約
  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-file-path
        pass_output_from:
          - implementation_fix_policy
    aggregate:
      all_match: LGTM
      then: implementation_approval
      else: implementation_fix_policy

  # 2. 実装修正方針確認（approval）
  - name: implementation_fix_policy
    type: approval
    model: default
    permission: readonly
    instruction: implementation-fix-policy
    policy: coding
    output_contract: approved-fix-policy
    input_contracts:
      - spec-file-path
      - review-verdict
    pass_output_from:
      - code_review_parallel
      - implementation_approval
    rules:
      - match: reject
        next: implementation_approval

  # 3. 修正（agent）
  - name: fix
    type: agent
    model: default
    permission: edit
    instruction: implement-fix
    policy: coding
    input_contracts:
      - spec-file-path
      - approved-fix-policy
    pass_output_from:
      - implementation_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: implementation_approval
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: implementation_approval

  # 4. 実装結果承認（approval）
  - name: implementation_approval
    type: approval
    model: default
    permission: readonly
    instruction: implementation-approval
    policy: coding
    input_contracts:
      - spec-file-path
      - review-verdict
    pass_output_from:
      - code_review_parallel
    resets_cycle_for:
      - fix
    rules:
      - match: reject
        next: implementation_fix_policy
