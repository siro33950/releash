name: spec-review
description: Spec-driven code review workflow (review against an approved Spec directory → fix loop → approve)
builtin: true

nodes:
  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - implementation_fix_policy
    aggregate:
      all_match: LGTM
      then: implementation_approval
      else: implementation_fix_policy

  - name: implementation_fix_policy
    type: approval
    model: default
    permission: readonly
    instruction: implementation-fix-policy
    policy: coding
    output_contract: approved-fix-policy
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - code_review_parallel
      - implementation_approval
    rules:
      - match: reject
        next: implementation_approval

  - name: fix
    type: agent
    model: default
    permission: edit
    instruction: implement-fix
    policy: coding
    input_contracts:
      - spec-directory
      - approved-fix-policy
    pass_output_from:
      - implementation_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: implementation_approval
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: implementation_approval

  - name: implementation_approval
    type: approval
    model: default
    permission: readonly
    instruction: implementation-approval
    policy: coding
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - code_review_parallel
    resets_cycle_for:
      - fix
    rules:
      - match: reject
        next: implementation_fix_policy
