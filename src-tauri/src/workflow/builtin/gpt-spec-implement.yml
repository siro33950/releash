name: gpt-spec-implement
description: Spec を元にGPT系モデルで実装し、軽量レビューループ（最大 5 周、Human-in-the-Loop なし）で Spec 充足と規約適合を保証する。
builtin: true

nodes:
  - name: implement
    type: agent
    model: gpt-5.5
    permission: edit
    instruction: implement
    policy: coding

  - name: review_parallel
    type: parallel
    parallel_children:
      - name: review_spec
        type: agent
        model: gpt-5.4-mini
        permission: full
        instruction: spec-implement-review-spec
        policy: reviewing
        knowledge: releash-thread-cli
      - name: review_design
        type: agent
        model: gpt-5.4-mini
        permission: full
        instruction: spec-implement-review-design
        policy: reviewing
        knowledge: releash-thread-cli
    aggregate:
      all_match: LGTM
      then: report
      else: fix

  - name: fix
    type: agent
    model: gpt-5.5
    permission: full
    instruction: spec-implement-fix
    policy: coding
    knowledge: releash-thread-cli
    rules:
      - match: ".*"
        next: review_parallel
    cycle_guard:
      max_iterations: 5
      on_exhausted: report

  - name: report
    type: approval
    model: gpt-5.5
    permission: full
    instruction: spec-implement-report
    knowledge: releash-thread-cli
