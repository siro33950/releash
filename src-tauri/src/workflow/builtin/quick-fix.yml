name: quick-fix
description: Quick bug-fix workflow
builtin: true

steps:
  - name: fix
    mode: auto
    persona: coder
    instruction: fix
    policy: coding

  - name: verify
    mode: auto
    persona: reviewer
    instruction: verify
    policy: review
    rules:
      - match: NEEDS_FIX
        next: fix
      - match: LGTM
        next: done
    cycle_guard:
      max_iterations: 3

  - name: done
    mode: approval
    instruction: report
