name: trace-loop-test
description: Trace view loop test workflow
builtin: true

steps:
  - name: setup
    mode: interactive
    prompt:
      inline: |
        Trace view test workflow.

        Complete this step from the workflow panel after adding any short instruction.

  - name: work
    mode: auto
    prompt:
      inline: |
        This is a test step for Workflow Trace.
        Reply with exactly:
        TRACE_WORK_DONE

  - name: review
    mode: auto
    prompt:
      inline: |
        This step is for testing Trace loop display.

        Reply with NEEDS_FIX to loop through fix and review again.
        Reply with LGTM to continue to approval.
    rules:
      - match: NEEDS_FIX
        next: fix
      - match: LGTM
        next: approval
    cycle_guard:
      max_iterations: 4

  - name: fix
    mode: auto
    prompt:
      inline: |
        This is a test fix step for Workflow Trace.
        Reply with exactly:
        FIX_DONE
    rules:
      - match: FIX_DONE
        next: review
    cycle_guard:
      max_iterations: 4

  - name: approval
    mode: approval
    prompt:
      inline: |
        Human approval gate for Workflow Trace testing.
        Approve to complete the workflow or reject to return to fix.
    rules:
      - match: reject
        next: fix
