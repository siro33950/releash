name: spec-driven-development-gpt-5-5
description: Spec-driven development workflow with every agent step pinned to GPT-5.5 (requirements → behavior → design → spec review → implement → implementation review → approve)
builtin: true

nodes:
  - name: write_requirements
    type: approval
    model: gpt-5.5
    permission: edit
    instruction: write-requirements
    policy: planning
    output_contract: spec-directory

  - name: write_behavior
    type: approval
    model: gpt-5.5
    permission: edit
    instruction: write-behavior
    policy: planning
    input_contracts:
      - spec-directory
    pass_output_from:
      - write_requirements

  - name: write_design
    type: approval
    model: gpt-5.5
    permission: edit
    instruction: write-design
    policy: planning
    input_contracts:
      - spec-directory
    pass_output_from:
      - write_requirements

  - name: spec_review_parallel
    type: parallel
    parallel_children:
      - name: spec_review_requirements
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: spec-review-requirements
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_behavior
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: spec-review-behavior
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_design
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: spec-review-design
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
      - name: spec_review_consistency
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: spec-review-consistency
        policy: plan-review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - spec_fix_policy
    aggregate:
      all_match: LGTM
      then: approve_spec
      else: spec_fix_policy

  - name: spec_fix_policy
    type: approval
    model: gpt-5.5
    permission: readonly
    instruction: spec-fix-policy
    policy: planning
    output_contract: approved-fix-policy
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - spec_review_parallel
      - approve_spec
    rules:
      - match: reject
        next: approve_spec

  - name: spec_fix
    type: agent
    model: gpt-5.5
    permission: edit
    instruction: spec-fix
    policy: planning
    input_contracts:
      - spec-directory
      - approved-fix-policy
    pass_output_from:
      - write_requirements
      - spec_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: approve_spec
      - match: ".*"
        next: spec_review_parallel
    cycle_guard:
      max_iterations: 2
      on_exhausted: approve_spec

  - name: approve_spec
    type: approval
    model: gpt-5.5
    permission: readonly
    instruction: spec-approval
    policy: planning
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - spec_review_parallel
    resets_cycle_for:
      - spec_fix
    rules:
      - match: reject
        next: spec_fix_policy

  - name: implement
    type: agent
    model: gpt-5.5
    permission: edit
    instruction: implement
    policy: coding
    input_contracts:
      - spec-directory
    pass_output_from:
      - write_requirements

  - name: code_review_parallel
    type: parallel
    parallel_children:
      - name: code_review_acceptance
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-acceptance
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
      - name: code_review_structure
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-structure
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
      - name: code_review_quality
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-quality
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
      - name: code_review_test
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-test
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
      - name: code_review_security
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-security
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
      - name: code_review_architecture
        type: agent
        model: gpt-5.5
        permission: readonly
        instruction: review-architecture
        policy: review
        output_contract: review-verdict
        input_contracts:
          - spec-directory
        pass_output_from:
          - write_requirements
          - implementation_fix_policy
    aggregate:
      all_match: LGTM
      then: implementation_approval
      else: implementation_fix_policy

  - name: implementation_fix_policy
    type: approval
    model: gpt-5.5
    permission: readonly
    instruction: implementation-fix-policy
    policy: coding
    output_contract: approved-fix-policy
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - code_review_parallel
      - implementation_approval
    rules:
      - match: reject
        next: implementation_approval

  - name: fix
    type: agent
    model: gpt-5.5
    permission: edit
    instruction: implement-fix
    policy: coding
    input_contracts:
      - spec-directory
      - approved-fix-policy
    pass_output_from:
      - write_requirements
      - implementation_fix_policy
    rules:
      - match: NO_FIX_NEEDED
        next: implementation_approval
      - match: ".*"
        next: code_review_parallel
    cycle_guard:
      max_iterations: 3
      on_exhausted: implementation_approval

  - name: implementation_approval
    type: approval
    model: gpt-5.5
    permission: readonly
    instruction: implementation-approval
    policy: coding
    input_contracts:
      - spec-directory
      - review-verdict
    pass_output_from:
      - write_requirements
      - code_review_parallel
    resets_cycle_for:
      - fix
    rules:
      - match: reject
        next: implementation_fix_policy
