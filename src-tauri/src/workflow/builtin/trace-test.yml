name: trace-test
description: Workflow behavior test (all facets + loop + parallel)
builtin: true

steps:
  - name: plan
    mode: interactive
    persona: planner
    instruction: test-step
    knowledge: test-context
    output_contract: test-report

  - name: execute
    mode: auto
    persona: coder
    instruction: test-step
    policy: coding
    knowledge: test-context
    output_contract: test-report
    pass_previous_response: true
    rules:
      - match: NEEDS_FIX
        next: execute
      - match: DONE
        next: parallel-check
    cycle_guard:
      max_iterations: 3

  - name: parallel-check
    parallel:
      - name: check-a
        mode: auto
        persona: reviewer
        instruction: test-step
        knowledge: test-context
        output_contract: test-report
        pass_output_from:
          - execute
      - name: check-b
        mode: auto
        persona: coder
        instruction: test-step
        policy: coding
        output_contract: test-report
        pass_output_from:
          - execute
    aggregate:
      all_match: DONE
      then: confirm
      else: execute

  - name: confirm
    mode: approval
    persona: planner
    instruction: test-step
    knowledge: test-context
    output_contract: test-report
    pass_previous_response: true
