[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0008", reason = "git2 0.19.0 - awaiting upstream fix" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile - migrate to rustls-pki-types later" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/tauri-apps/fix-path-env-rs",
]
