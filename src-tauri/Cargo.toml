[package]
name = "releash"
version = "0.3.68"
description = "A Tauri App"
authors = ["you"]
license = "MIT OR Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "releash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
parking_lot = "0.12.5"
notify-debouncer-mini = "0.7"
base64 = "0.22"
git2 = "0.21"
thiserror = "2"
ignore = "0.4"
regex = "1"
tree-sitter = "0.26"
tree-sitter-tags = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
toml = "1.1"
serde-saphyr = "0.0"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
log = "0.4"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
lsp-types = "0.97"
bytes = "1"
flate2 = "1"
tar = "0.4"
url = "2"
clap = { version = "4", features = ["derive"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "release" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWindow", "NSResponder"] }

[features]
vendored-openssl = ["git2/vendored-openssl"]

[dev-dependencies]
filetime = "0.2"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
proptest = "1"
# [04] / spec [04] テスト境界: production `WorkflowEngine::dispatch` を直接呼ぶ harness で
# 実 `AppHandle` を構築するために tauri の test feature を有効化する。
tauri = { version = "2.11", features = ["tray-icon", "image-png", "test"] }
