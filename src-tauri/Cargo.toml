[package]
name = "releash"
version = "0.4.19"
description = "A Tauri App"
authors = ["you"]
license = "MIT OR Apache-2.0"
edition = "2021"
default-run = "releash"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "releash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "releash"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "releash-backend"
path = "src/bin/backend.rs"

[build-dependencies]
connectrpc-build = "=0.9.0"
prost-build = "0.14.4"
protoc-bin-vendored = "3"
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
connectrpc = { version = "=0.9.1", features = ["axum", "client"] }
buffa = { version = "0.9.1", features = ["json"] }
tauri = { version = "2.11", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
open = "5"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.9.0"
avt = "0.18.0"
parking_lot = "0.12.5"
notify-debouncer-mini = "0.7"
base64 = "0.23"
git2 = "0.21"
thiserror = "2"
regex = "1"
toml = "1.1"
serde-saphyr = "1.0"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# issues-1499 T-02: bundled SQLite (>= 3.51.3) includes the WAL-reset
# corruption fix required by the permanent local event store.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
futures-util = "0.3"
log = "0.4"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
clap = { version = "4", features = ["derive"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSURL", "NSGeometry", "NSError"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWindow", "NSResponder"], optional = true }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-fs", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
vendored-openssl = ["git2/vendored-openssl"]
performance = []
performance-wdio = ["desktop", "performance", "dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
filetime = "0.2"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
# [04] / spec [04] テスト境界: production `WorkflowEngine::dispatch` を直接呼ぶ harness で
# 実 `AppHandle` を構築するために tauri の test feature を有効化する。
tauri = { version = "2.11", features = ["tray-icon", "image-png", "test"] }

[[test]]
name = "client_api"
path = "tests/client_api/mod.rs"

[[test]]
name = "desktop_restart"
path = "tests/desktop_restart.rs"
harness = false
required-features = ["desktop"]

[[test]]
name = "desktop_tray"
path = "tests/desktop_tray.rs"
harness = false
required-features = ["desktop"]
