[package]
name = "releash"
version = "0.2.7"
description = "A Tauri App"
authors = ["you"]
license = "MIT OR Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "releash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
parking_lot = "0.12.5"
notify-debouncer-mini = "0.7"
base64 = "0.22"
git2 = "0.20"
thiserror = "2"
ignore = "0.4"
regex = "1"
tree-sitter = "0.26"
tree-sitter-tags = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
toml = "1.0"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.28"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
sentry = { version = "0.46", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "release-health"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-aptabase = "1.0.0"
rmcp = { version = "0.17", features = ["server", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
tokio-util = "0.7"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "release" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSObject", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWindow", "NSResponder"] }

[features]
vendored-openssl = ["git2/vendored-openssl"]

[dev-dependencies]
tempfile = "3"

