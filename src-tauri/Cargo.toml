[workspace]
members = ["releash-desktop", "releash-sdk", "releash"]
resolver = "2"

[workspace.package]
version = "0.4.19"

[package]
name = "releash-backend"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
license = "MIT OR Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "releash_lib"

[[bin]]
name = "releash-backend"
path = "src/bin/backend.rs"

[build-dependencies]
prost-reflect = "0.16.5"
prost-build = "0.14.4"
protoc-bin-vendored = "3"

[dependencies]
releash-sdk = { path = "releash-sdk" }
connectrpc = { version = "=0.9.1", features = ["axum", "client"] }
buffa = { version = "0.9.2", features = ["json"] }
open = "5"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.9.0"
avt = "0.18.0"
parking_lot = { version = "0.12.5", features = ["arc_lock", "send_guard"] }
notify-debouncer-mini = "0.7"
base64 = "0.23"
git2 = "0.21"
thiserror = "2"
regex = "1"
toml = "1.1"
serde-saphyr = "1.3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# issues-1499 T-02: bundled SQLite (>= 3.51.3) includes the WAL-reset
# corruption fix required by the permanent local event store.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
sha2 = "0.11"
subtle = "2.6"
hex = "0.4"
futures-util = "0.3"
futures-executor = "0.3"
log = "0.4"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
httpdate = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
url = "2"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.33"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
test-support = ["opentelemetry_sdk/testing"]
vendored-openssl = ["git2/vendored-openssl"]

[dev-dependencies]
releash-backend = { path = ".", features = ["test-support"] }
filetime = "0.2"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "client_api"
path = "tests/client_api/mod.rs"
