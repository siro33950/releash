name: full-pipeline
description: テスト→複数モデルレビュー→Open Thread修正→出荷判断

schemas:
  review_verdict:
    type: object
    properties:
      lgtm:
        type: boolean
    required:
      - lgtm
  judge_result:
    type: object
    properties:
      all_lgtm:
        type: boolean
    required:
      - all_lgtm
  thread:
    type: object
    properties:
      thread_id:
        type: string
  thread_scan:
    type: object
    properties:
      threads:
        type: array
        items: thread
      has_open:
        type: boolean
    required:
      - has_open
  fix_result:
    type: object
    properties:
      fixed:
        type: boolean
    required:
      - fixed
  ship_decision:
    type: object
    properties:
      verdict:
        type: string
        enum:
          - SHIP
          - HOLD
          - ESCALATE
    required:
      - verdict

nodes:
  main:
    command: "cargo test"
    rules:
      - when:
          on: ok
          then: review
        next: fix_tests

  fix_tests:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: implementing
        instruction: fix-failing-tests
    inputs:
      - main
    rules:
      - loop_guard:
          max_iterations: 3
          on_exhausted: give_up
      - next: main

  review:
    fanout:
      child:
        - review_opus
        - review_gpt
    rules:
      - next: judge

  review_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reviewing
        knowledge: releash-review
        instruction: review-diff
    artifact: review_verdict
  review_gpt:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: releash-review
        instruction: review-diff
    artifact: review_verdict

  judge:
    command: "echo '{{ review }}' | jq '{all_lgtm: all(.[]; .lgtm)}'"   # review = 子 artifact の配列
    inputs:
      - review
    artifact: judge_result
    rules:
      - when:
          on: all_lgtm
          then: list_threads
        next: apply_fixes

  apply_fixes:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: implementing
        instruction: apply-review-fixes
    rules:
      - loop_guard:
          max_iterations: 3
          on_exhausted: give_up
      - next: review

  list_threads:
    command: >-
      releash review list --session-id "$RELEASH_SESSION_ID" --state open --json |
      jq '{threads: map({thread_id: .id}), has_open: (length > 0)}'
    artifact: thread_scan
    rules:
      - when:
          on: has_open
          then: fix_each
        next: done

  fix_each:
    fanout:
      child: fix_one
      items: list_threads.threads
    rules:
      - next: triage

  fix_one:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: triage
        knowledge:
          - releash-thread
          - releash-review
        instruction: decide-thread-fix   # item（{{ item.thread_id }}）で参照
    completion: approval
    input:                               # パラメータ。fanout の各要素が入る
      - item: thread
    artifact: fix_result

  triage:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reviewing
        instruction: triage-ship-decision
    artifact: ship_decision
    rules:
      - loop_guard:
          max_iterations: 2
          on_exhausted: escalate
      - switch:
          on: verdict
          cases:
            SHIP: done
            HOLD: list_threads
            ESCALATE: escalate

  done:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        instruction: summarize-ship
    completion: approval
  give_up:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        instruction: summarize-failure
    completion: approval
  escalate:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        instruction: summarize-escalation
    completion: approval
