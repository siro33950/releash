name: Releash
options:
  deploymentTarget:
    macOS: '15.0'
packages:
  Bonsplit:
    url: https://github.com/siro33950/bonsplit
    revision: 088c284ecdd51721da83e2ae121a97d25881cc38
  Connect:
    url: https://github.com/connectrpc/connect-swift
    exactVersion: 1.0.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.4.19'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  Releash:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Lucide-LICENSE
        buildPhase: resources
      - path: Resources/Bonsplit-LICENSE
        buildPhase: resources
      - path: Generated
        excludes: [client-descriptor.bin]
      - path: Generated/client-descriptor.bin
        buildPhase: resources
      - path: .build/Helpers/$(CONFIGURATION)/releashd
        optional: true
        type: file
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
      - path: .build/Helpers/$(CONFIGURATION)/releash
        optional: true
        type: file
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.releash.macos.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.releash.macos
    dependencies:
      - package: Bonsplit
      - package: Connect
      - package: SwiftProtobuf
  ReleashTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - UITests/Fixture.swift
    dependencies:
      - target: Releash
  ReleashUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
      - path: Generated
        excludes: [client-descriptor.bin]
    dependencies:
      - target: Releash
      - package: Connect
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.releash.macos.uitests
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: UITests/ReleashUITests.entitlements
schemes:
  Releash:
    build:
      targets:
        Releash: all
    test:
      targets: [ReleashTests]
  ReleashE2E:
    build:
      targets:
        Releash: all
        ReleashUITests: [test]
    test:
      targets: [ReleashUITests]
      environmentVariables:
        RELEASH_E2E_ROOT: $(SRCROOT)/../..
