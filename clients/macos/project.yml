name: Releash
options:
  preGenCommand: ./Scripts/generate.sh
  deploymentTarget:
    macOS: '15.0'
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    revision: 2dacb6e514be19379c605a5a11564d0f3fea89d9
  Bonsplit:
    url: https://github.com/siro33950/bonsplit
    revision: 088c284ecdd51721da83e2ae121a97d25881cc38
  Connect:
    url: https://github.com/connectrpc/connect-swift
    exactVersion: 1.0.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.4.19'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  Releash:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Lucide-LICENSE
        buildPhase: resources
      - path: Resources/Bonsplit-LICENSE
        buildPhase: resources
      - path: Generated
        excludes: [client-descriptor.bin]
      - path: Generated/client-descriptor.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.releash.macos
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Bonsplit
      - package: Connect
      - package: SwiftProtobuf
    preBuildScripts:
      - name: Generate protocol
        script: '"${SRCROOT}/Scripts/generate.sh"'
        basedOnDependencyAnalysis: false
      - name: Bundle server and CLI
        script: '"${SRCROOT}/Scripts/bundle-helpers.sh"'
        basedOnDependencyAnalysis: false
  ReleashTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests
    dependencies:
      - target: Releash
      - package: ViewInspector
schemes:
  Releash:
    build:
      targets:
        Releash: all
    test:
      targets: [ReleashTests]
