name: when-on-enum
description: when.on must be boolean
schemas:
  verdict:
    type: object
    properties:
      decision:
        type: string
        enum:
        - done
        - retry
    required:
    - decision
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - when:
              on: decision
              then: done
            next: done
      - done
  judge:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
  done:
    session:
      provider: claude
      facets:
        instruction: done
