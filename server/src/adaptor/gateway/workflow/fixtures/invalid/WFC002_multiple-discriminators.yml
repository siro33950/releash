name: multiple-discriminators
description: only one discriminator rule is allowed
schemas:
  verdict:
    type: object
    properties:
      passed:
        type: boolean
      decision:
        type: string
        enum:
        - done
        - fix
    required:
    - passed
    - decision
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - when:
              on: passed
              then: done
            next: fix
          - switch:
              on: decision
              cases:
                done: done
                fix: fix
      - done
      - fix
  judge:
    artifact: verdict
    session:
      provider: claude
      facets:
        instruction: judge
  done:
    session:
      provider: claude
      facets:
        instruction: done
  fix:
    session:
      provider: claude
      facets:
        instruction: fix
