name: exhaustive-switch-with-next
description: exhaustive switch rejects a redundant next catch-all
schemas:
  route:
    type: object
    properties:
      verdict:
        type: string
        enum:
        - SHIP
        - HOLD
    required:
    - verdict
nodes:
  main:
    sequence:
      children:
      - judge:
          rules:
          - switch:
              on: verdict
              cases:
                SHIP: shipped
                HOLD: held
            next: fallback
      - shipped
      - held
      - fallback
  judge:
    artifact: route
    session:
      provider: claude
      facets:
        instruction: judge
  shipped:
    session:
      provider: claude
      facets:
        instruction: shipped
  held:
    session:
      provider: claude
      facets:
        instruction: held
  fallback:
    session:
      provider: claude
      facets:
        instruction: fallback
