name: invalid-fanout-items-ref
description: fanout items must resolve to a declared artifact array field
schemas:
  source-output:
    type: object
    properties:
      values:
        type: string
    required:
    - values
  target:
    type: string
nodes:
  main:
    sequence:
      children:
      - source
      - dispatch
  source:
    command: echo source
    artifact: source-output
  dispatch:
    fanout:
      children:
      - worker
      items: source.missing
  worker:
    input:
    - item: target
    command: echo {{ item }}
