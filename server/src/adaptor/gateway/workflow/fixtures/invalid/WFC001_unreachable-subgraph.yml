name: unreachable-subgraph
description: unreachable subgraph edges do not make targets reachable
nodes:
  main:
    sequence:
      children:
      - start:
          rules: []
      - orphan:
          rules:
          - next: target
      - target
  start:
    session:
      provider: claude
      facets:
        instruction: start
  orphan:
    session:
      provider: claude
      facets:
        instruction: orphan
  target:
    session:
      provider: claude
      facets:
        instruction: target
