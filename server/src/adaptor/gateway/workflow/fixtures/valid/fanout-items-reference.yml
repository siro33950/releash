name: fanout-items-reference
description: valid fanout with artifact field items
schemas:
  target:
    type: string
  source-output:
    type: object
    properties:
      targets:
        type: array
        items: target
    required:
    - targets
nodes:
  main:
    sequence:
      children:
      - source
      - dispatch
  source:
    command: echo source
    artifact: source-output
  dispatch:
    fanout:
      children:
      - worker
      items: source.targets
  worker:
    input:
    - item: target
    command: echo {{ item }}
