service ClientService {
  option (connection_backoff) = {
    initial_backoff_ms: 1000
    multiplier: 1.6
    jitter: 0.2
    max_backoff_ms: 120000
    reset_after_ms: 120000
  };
  option (state_stream_silence_ms) = 20000;
  option (default_timeout_ms) = 120000;
  option (shutdown_timeout_ms) = 15000;
  option (min_connect_timeout_ms) = 20000;
  rpc OpenStateStream(OpenStateStreamRequest) returns (stream StateSubscriptionEvent) { option (scope) = SCOPE_OPERATOR; }
  rpc StartStateSubscription(StartStateSubscriptionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc StopStateSubscription(StopStateSubscriptionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc RefreshWorkspaces(RefreshWorkspacesRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc AbortWorkflow(AbortWorkflowRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ReportTerminalProcessed(ReportTerminalProcessedRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc AddRepoPath(AddRepoPathRequest) returns (ResultBool) { option (scope) = SCOPE_OPERATOR; }
  rpc AppendReviewComment(AppendReviewCommentRequest) returns (ReviewThreadDto) { option (scope) = SCOPE_OPERATOR; }
  rpc ApproveWorkspaceNode(ApproveWorkspaceNodeRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc SendThreadsToSession(SendThreadsToSessionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ArchiveWorkspaceWorkflowExecution(ArchiveWorkspaceWorkflowExecutionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc CreateAgentSession(CreateAgentSessionRequest) returns (SessionSelection) { option (scope) = SCOPE_OPERATOR; }
  rpc CreateReviewThread(CreateReviewThreadRequest) returns (ReviewThreadDto) { option (scope) = SCOPE_OPERATOR; }
  rpc SaveRepositoryGroupState(SaveRepositoryGroupStateRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc CreateWorktrees(CreateWorktreesRequest) returns (Liststring) { option (scope) = SCOPE_OPERATOR; }
  rpc DeleteAgentSession(DeleteAgentSessionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc DeleteNotionConfig(DeleteNotionConfigRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc GetOrSpawnTerminalSurface(GetOrSpawnTerminalSurfaceRequest) returns (GetOrSpawnTerminalV1) { option (scope) = SCOPE_OPERATOR; }
  rpc GitCreateBranch(GitCreateBranchRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc GitStage(GitStageRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc GitUnstage(GitUnstageRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc KillTerminalSurface(KillTerminalSurfaceRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc OpenAgentSession(OpenAgentSessionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc OpenFacetInEditor(OpenFacetInEditorRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc OpenInEditor(OpenInEditorRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc OpenWorkflowDirectoryInEditor(OpenWorkflowDirectoryInEditorRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc OpenWorkflowInEditor(OpenWorkflowInEditorRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc RefreshProviderAvailability(RefreshProviderAvailabilityRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc RemoveRepoPath(RemoveRepoPathRequest) returns (ResultBool) { option (scope) = SCOPE_OPERATOR; }
  rpc RemoveWorktree(RemoveWorktreeRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc RenameWorkspaceSessionNode(RenameWorkspaceSessionNodeRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc StopDaemon(StopDaemonRequest) returns (StopDaemonResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc ResetProviderExecutable(ResetProviderExecutableRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ResizeTerminalSurface(ResizeTerminalSurfaceRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ResolveReviewThread(ResolveReviewThreadRequest) returns (ReviewThreadDto) { option (scope) = SCOPE_OPERATOR; }
  rpc RestoreAgentSession(RestoreAgentSessionRequest) returns (SessionSelection) { option (scope) = SCOPE_OPERATOR; }
  rpc RestoreWorkspaceWorkflowExecution(RestoreWorkspaceWorkflowExecutionRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ResumeAgentSessionHistoryCandidate(ResumeAgentSessionHistoryCandidateRequest) returns (SessionSelection) { option (scope) = SCOPE_OPERATOR; }
  rpc RetryWorkspaceNode(RetryWorkspaceNodeRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ResumeWorkspaceSessionNode(ResumeWorkspaceSessionNodeRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc SaveNotionConfig(SaveNotionConfigRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc SaveWorkspaceState(SaveWorkspaceStateRequest) returns (WorkspaceStateDto) { option (scope) = SCOPE_OPERATOR; }
  rpc SetReleashBase(SetReleashBaseRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc StartWorkflow(StartWorkflowRequest) returns (ResultString) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateAppSettings(UpdateAppSettingsRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateLoginItemPreference(UpdateLoginItemPreferenceRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateCrashReporting(UpdateCrashReportingRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateExternalEditor(UpdateExternalEditorRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdatePerformanceTelemetry(UpdatePerformanceTelemetryRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateProviderExecutable(UpdateProviderExecutableRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateTerminalStartupCommand(UpdateTerminalStartupCommandRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc UpdateWorkflowConfig(UpdateWorkflowConfigRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc ValidateNotionConfig(ValidateNotionConfigRequest) returns (NotionValidationResultView) { option (scope) = SCOPE_OPERATOR; }
  rpc WritePathsToTerminalSurface(WritePathsToTerminalSurfaceRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc WriteTerminalSurface(WriteTerminalSurfaceRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc WorkflowSubmitOutput(WorkflowSubmitOutputRequest) returns (Unit) { option (scope) = SCOPE_OPERATOR; }
  rpc DiagnoseWorkflowDirectory(DiagnoseWorkflowDirectoryRequest) returns (DiagnoseWorkflowDirectoryResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc CreateSessionReviewThread(CreateSessionReviewThreadRequest) returns (CreateSessionReviewThreadResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc AppendSessionReviewComment(AppendSessionReviewCommentRequest) returns (AppendSessionReviewCommentResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc ResolveSessionReviewThread(ResolveSessionReviewThreadRequest) returns (ResolveSessionReviewThreadResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc ReceiveProviderUsage(ReceiveProviderUsageRequest) returns (Unit) { option (scope) = SCOPE_HOOK; }
  rpc ReceiveProviderSignal(ReceiveProviderSignalRequest) returns (ReceiveProviderSignalResponse) { option (scope) = SCOPE_HOOK; }
  rpc InstallCli(InstallCliRequest) returns (InstallCliResponse) { option (scope) = SCOPE_OPERATOR; }
  rpc CheckLoginRegistration(CheckLoginRegistrationRequest) returns (LoginRegistrationResult) { option (scope) = SCOPE_OPERATOR; }
  rpc GetServerInfo(Unit) returns (ServerInfo) { option (scope) = SCOPE_OPERATOR; option (scope) = SCOPE_HOOK; }
}

