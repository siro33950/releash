syntax = "proto3";
package releash.client.v1;
import "client_options.proto";

option (data_dir_name) = "releash";
option (development_data_dir_suffix) = ".dev";
option (data_dir_env) = "RELEASH_DATA_DIR";

message LocalApiDiscovery {
  uint32 port = 1;
  string token = 2;
  string daemon_id = 3;
  uint32 pid = 4;
  uint64 process_started_at = 5;
}

message CommandRequest {
  oneof command {
    ResolveSessionReviewThreadRequest resolve_session_review_thread = 191;
    AppendSessionReviewCommentRequest append_session_review_comment = 190;
    CreateSessionReviewThreadRequest create_session_review_thread = 189;
    DiagnoseWorkflowDirectoryRequest diagnose_workflow_directory = 192;
    AbortWorkflowRequest abort_workflow = 10;
    AddRepoPathRequest add_repo_path = 13;
    AppendReviewCommentRequest append_review_comment = 14;
    ApproveWorkspaceNodeRequest approve_workspace_node = 15;
    SendThreadsToSessionRequest send_threads_to_session = 206;
    ArchiveWorkspaceWorkflowExecutionRequest archive_workspace_workflow_execution = 17;
    CreateAgentSessionRequest create_agent_session = 26;
    CreateReviewThreadRequest create_review_thread = 27;
    CreateWorktreesRequest create_worktrees = 204;
    SaveRepositoryGroupStateRequest save_repository_group_state = 205;
    DeleteAgentSessionRequest delete_agent_session = 29;
    DeleteNotionConfigRequest delete_notion_config = 32;
    GetOrSpawnTerminalSurfaceRequest get_or_spawn_terminal_surface = 59;

    GitCreateBranchRequest git_create_branch = 77;
    GitStageRequest git_stage = 78;
    GitUnstageRequest git_unstage = 80;
    KillTerminalSurfaceRequest kill_terminal_surface = 82;

    OpenAgentSessionRequest open_agent_session = 97;
    OpenFacetInEditorRequest open_facet_in_editor = 98;
    OpenInEditorRequest open_in_editor = 100;
    OpenWorkflowInEditorRequest open_workflow_in_editor = 101;
    OpenWorkflowDirectoryInEditorRequest open_workflow_directory_in_editor = 207;
    RefreshProviderAvailabilityRequest refresh_provider_availability = 105;
    RemoveRepoPathRequest remove_repo_path = 106;
    RemoveWorktreeRequest remove_worktree = 107;
    RenameWorkspaceSessionNodeRequest rename_workspace_session_node = 108;
    StopDaemonRequest stop_daemon = 193;
    InstallCliRequest install_cli = 194;
    CheckLoginRegistrationRequest check_login_registration = 195;
    ResetProviderExecutableRequest reset_provider_executable = 114;
    ResizeTerminalSurfaceRequest resize_terminal_surface = 115;
    ResolveReviewThreadRequest resolve_review_thread = 117;
    RestoreAgentSessionRequest restore_agent_session = 119;
    RestoreWorkspaceWorkflowExecutionRequest restore_workspace_workflow_execution = 120;
    ResumeAgentSessionHistoryCandidateRequest resume_agent_session_history_candidate = 122;
    RetryWorkspaceNodeRequest retry_workspace_node = 124;
    ResumeWorkspaceSessionNodeRequest resume_workspace_session_node = 185;
    SaveNotionConfigRequest save_notion_config = 126;
    SaveWorkspaceStateRequest save_workspace_state = 128;
    SetReleashBaseRequest set_releash_base = 130;

    StartWorkflowRequest start_workflow = 135;

    UpdateAppSettingsRequest update_app_settings = 140;
    UpdateLoginItemPreferenceRequest update_login_item_preference = 184;
    UpdateCrashReportingRequest update_crash_reporting = 141;
    UpdateExternalEditorRequest update_external_editor = 142;
    UpdatePerformanceTelemetryRequest update_performance_telemetry = 143;
    UpdateProviderExecutableRequest update_provider_executable = 144;
    UpdateWorkflowConfigRequest update_workflow_config = 145;
    UpdateTerminalStartupCommandRequest update_terminal_startup_command = 196;
    ValidateNotionConfigRequest validate_notion_config = 146;
    WritePathsToTerminalSurfaceRequest write_paths_to_terminal_surface = 147;
    WriteTerminalSurfaceRequest write_terminal_surface = 148;
    WorkflowSubmitOutputRequest workflow_submit_output = 179;
    RefreshWorkspacesRequest refresh_workspaces = 186;
  }
}

message CommandResult {
  oneof command {
    ResolveSessionReviewThreadResponse resolve_session_review_thread = 191;
    AppendSessionReviewCommentResponse append_session_review_comment = 190;
    CreateSessionReviewThreadResponse create_session_review_thread = 189;
    DiagnoseWorkflowDirectoryResponse diagnose_workflow_directory = 192;
    Unit abort_workflow = 10;
    ResultBool add_repo_path = 13;
    ReviewThreadDto append_review_comment = 14;
    Unit approve_workspace_node = 15;
    Unit send_threads_to_session = 206;
    Unit archive_workspace_workflow_execution = 17;
    SessionSelection create_agent_session = 26;
    ReviewThreadDto create_review_thread = 27;
    Liststring create_worktrees = 204;
    Unit save_repository_group_state = 205;
    Unit delete_agent_session = 29;
    Unit delete_notion_config = 32;
    GetOrSpawnTerminalV1 get_or_spawn_terminal_surface = 59;

    Unit git_create_branch = 77;
    Unit git_stage = 78;
    Unit git_unstage = 80;
    Unit kill_terminal_surface = 82;

    Unit open_agent_session = 97;
    Unit open_facet_in_editor = 98;
    Unit open_in_editor = 100;
    Unit open_workflow_in_editor = 101;
    Unit open_workflow_directory_in_editor = 207;
    Unit refresh_provider_availability = 105;
    ResultBool remove_repo_path = 106;
    Unit remove_worktree = 107;
    Unit rename_workspace_session_node = 108;
    StopDaemonResponse stop_daemon = 193;
    InstallCliResponse install_cli = 194;
    LoginRegistrationResult check_login_registration = 195;
    Unit reset_provider_executable = 114;
    Unit resize_terminal_surface = 115;
    ReviewThreadDto resolve_review_thread = 117;
    SessionSelection restore_agent_session = 119;
    Unit restore_workspace_workflow_execution = 120;
    SessionSelection resume_agent_session_history_candidate = 122;
    Unit retry_workspace_node = 124;
    Unit resume_workspace_session_node = 185;
    Unit save_notion_config = 126;
    WorkspaceStateDto save_workspace_state = 128;
    Unit set_releash_base = 130;

    ResultString start_workflow = 135;

    Unit update_app_settings = 140;
    Unit update_login_item_preference = 184;
    Unit update_crash_reporting = 141;
    Unit update_external_editor = 142;
    Unit update_performance_telemetry = 143;
    Unit update_provider_executable = 144;
    Unit update_workflow_config = 145;
    Unit update_terminal_startup_command = 196;
    NotionValidationResultView validate_notion_config = 146;
    Unit write_paths_to_terminal_surface = 147;
    Unit write_terminal_surface = 148;
    Unit workflow_submit_output = 179;
    Unit refresh_workspaces = 186;
  }
}

message AbortWorkflowRequest {
  optional string execution_id = 1 [json_name = "executionId", (json_required) = true];
}

message Unit {
  option (json_unit) = true;
}

message AddRepoPathRequest {
  optional string path = 1 [json_name = "path", (json_required) = true];
}

message ResultBool {
  option (json_wrapper) = "value";
  optional bool value = 1 [json_name = "value", (json_required) = true];
}

message AppendReviewCommentRequest {
  optional string worktree_name = 1 [json_name = "worktreeName", (json_required) = true];
  optional string thread_id = 2 [json_name = "threadId", (json_required) = true];
  optional string content = 3 [json_name = "content", (json_required) = true];
}

message ReviewThreadDto {
  optional string id = 1 [json_name = "id", (json_required) = true];
  optional string worktree_name = 2 [json_name = "worktreeName", (json_required) = true];
  optional ReviewActorWireDto author = 3 [json_name = "author", (json_required) = true];
  optional ReviewTargetWireDto target = 4 [json_name = "target", (json_required) = true];
  optional ReviewThreadStateDto state = 5 [json_name = "state", (json_required) = true];
  optional ListReviewCommentDto comments = 6 [json_name = "comments", (json_required) = true];
  optional ReviewResolveInfoDto resolve = 7 [json_name = "resolve", (json_nullable) = true];
  optional double created_at = 8 [json_name = "createdAt", (json_required) = true];
  optional double updated_at = 9 [json_name = "updatedAt", (json_required) = true];
  optional uint64 version = 10 [json_name = "version", (json_required) = true];
  optional bool can_resolve = 11 [json_name = "canResolve", (json_required) = true];
}

message ReviewActorWireDto {
  optional ReviewActorKindWireDto kind = 1 [json_name = "kind", (json_required) = true];
  optional string backend_id = 2 [json_name = "backendId", (json_nullable) = true];
  optional string model = 3 [json_name = "model", (json_nullable) = true];
  optional string display_name = 4 [json_name = "displayName", (json_required) = true];
}

message ReviewActorKindWireDto {
  option (json_wrapper) = "value";
  enum Value {
    human = 0 [(json_enum_name) = "human"];
    agent = 1 [(json_enum_name) = "agent"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ReviewLineSideDto {
  option (json_wrapper) = "value";
  enum Value {
    additions = 0 [(json_enum_name) = "additions"];
    deletions = 1 [(json_enum_name) = "deletions"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ReviewTargetWireDto {
  optional string file_path = 1 [json_name = "filePath", (json_nullable) = true];
  optional uint32 line_number = 2 [json_name = "lineNumber", (json_nullable) = true];
  optional uint32 end_line = 3 [json_name = "endLine", (json_nullable) = true];
  optional ReviewLineSideDto side = 4 [json_name = "side"];
  optional ReviewLineSideDto end_side = 5 [json_name = "endSide"];
}

message ReviewThreadStateDto {
  option (json_wrapper) = "value";
  enum Value {
    open = 0 [(json_enum_name) = "open"];
    resolved = 1 [(json_enum_name) = "resolved"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ReviewCommentDto {
  optional string id = 1 [json_name = "id", (json_required) = true];
  optional string thread_id = 2 [json_name = "threadId", (json_required) = true];
  optional ReviewActorWireDto author = 3 [json_name = "author", (json_required) = true];
  optional string content = 4 [json_name = "content", (json_required) = true];
  optional double created_at = 5 [json_name = "createdAt", (json_required) = true];
}

message ListReviewCommentDto {
  option (json_wrapper) = "items";
  repeated ReviewCommentDto items = 1;
}

message ReviewResolveInfoDto {
  optional ReviewActorWireDto actor = 1 [json_name = "actor", (json_required) = true];
  optional string outcome = 2 [json_name = "outcome", (json_required) = true];
  optional string summary = 3 [json_name = "summary", (json_required) = true];
  optional double resolved_at = 4 [json_name = "resolvedAt", (json_required) = true];
}

message ApproveWorkspaceNodeRequest {
  optional string worktree_path = 1 [json_name = "worktreePath", (json_required) = true];
  optional string node_id = 2 [json_name = "nodeId", (json_required) = true];
}

message ArchiveWorkspaceWorkflowExecutionRequest {
  optional string worktree_path = 1 [json_name = "worktreePath", (json_required) = true];
  optional string execution_id = 2 [json_name = "executionId", (json_required) = true];
}

message TerminalSurfaceOwnerV1 {
  option (json_tag) = "kind";
  oneof variant {
    TerminalSurfaceOwnerV1Workspace workspace = 1 [json_name = "workspace"];
    TerminalSurfaceOwnerV1Session session = 2 [json_name = "session"];
    TerminalSurfaceOwnerV1WorkspaceTerminal workspace_terminal = 3 [json_name = "workspace_terminal"];
  }
}

message TerminalSurfaceOwnerV1WorkspaceTerminal {
  optional string workspace_path = 1 [json_name = "workspacePath", (json_required) = true];
  optional string terminal_id = 2 [json_name = "terminalId", (json_required) = true];
}

message TerminalSurfaceOwnerV1Workspace {
  optional string workspace_path = 1 [json_name = "workspacePath", (json_required) = true];
}

message TerminalSurfaceOwnerV1Session {
  optional string workspace_path = 1 [json_name = "workspacePath", (json_required) = true];
  optional string session_id = 2 [json_name = "sessionId", (json_required) = true];
}

message ResultString {
  option (json_wrapper) = "value";
  optional string value = 1 [json_name = "value", (json_required) = true];
}

message CreateAgentSessionRequest {
  optional string workspace_identity = 1 [json_name = "workspaceIdentity", (json_required) = true];
  optional string worktree_path = 2 [json_name = "worktreePath", (json_required) = true];
  optional string provider = 3 [json_name = "provider", (json_required) = true];
  optional uint32 rows = 4 [json_name = "rows", (json_required) = true];
  optional uint32 cols = 5 [json_name = "cols", (json_required) = true];
  optional string caller_request_id = 6 [json_name = "callerRequestId", (json_required) = true];
  // Session のタブを開く pane の ID。省略したときと、配置に無い pane を指定したときは、先頭の pane に開く。
  optional string pane_id = 7 [json_name = "paneId", (json_nullable) = true];
}

message CreateReviewThreadRequest {
  optional string worktree_name = 1 [json_name = "worktreeName", (json_required) = true];
  optional string file_path = 2 [json_name = "filePath", (json_nullable) = true];
  optional uint32 line_number = 3 [json_name = "lineNumber", (json_nullable) = true];
  optional uint32 end_line = 4 [json_name = "endLine", (json_nullable) = true];
  optional string content = 5 [json_name = "content", (json_required) = true];
  optional ReviewLineSideDto side = 6 [json_name = "side"];
  optional ReviewLineSideDto end_side = 7 [json_name = "endSide"];
}

message SaveRepositoryGroupStateRequest {
  string repository_path = 1;
  bool collapsed = 2;
}
message RepositoryGroupState {
  bool collapsed = 1;
}
message CreateWorktreesRequest {
  string repo_path = 1;
  repeated string branches = 2;
  optional string base_branch = 3;
  oneof launch {
    WorktreeSessionLaunch session = 4;
    WorktreeWorkflowLaunch workflow = 5;
  }
}
message WorktreeSessionLaunch {
  string provider = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  string request_id = 4;
}
message WorktreeWorkflowLaunch {
  string name = 1;
  optional string request = 2;
}

message DeleteAgentSessionRequest {
  optional string agent_session_id = 1 [json_name = "agentSessionId", (json_required) = true];
  optional string caller_request_id = 2 [json_name = "callerRequestId", (json_required) = true];
}

message DeleteNotionConfigRequest {
  optional string repo_path = 1 [json_name = "repoPath", (json_required) = true];
}

message EditorInfoDto {
  optional string name = 1 [json_name = "name", (json_required) = true];
  optional string path = 2 [json_name = "path", (json_required) = true];
}

message ListEditorInfoDto {
  option (json_wrapper) = "items";
  repeated EditorInfoDto items = 1;
}

message DiagnosticReport {
  optional ListDiagnosticItem items = 1 [json_name = "items", (json_required) = true];
  optional MapDiagnosticSummary workflow_summaries = 2 [json_name = "workflow_summaries", (json_required) = true];
  optional MapDiagnosticSummary facet_summaries = 3 [json_name = "facet_summaries", (json_required) = true];
  optional MapListFacetUsageEntry facet_usage = 4 [json_name = "facet_usage", (json_required) = true];
  // 診断の全体の件数。1 件の診断は、定義と Facet の両方に関わっていても 1 件と数える。
  optional DiagnosticSummary total = 5 [json_name = "total", (json_required) = true];
}

message DiagnosticItem {
  optional string code = 1 [json_name = "code", (json_required) = true];
  optional Severity severity = 2 [json_name = "severity", (json_required) = true];
  optional DiagnosticStage stage = 3 [json_name = "stage", (json_required) = true];
  optional DiagnosticSpan span = 4 [json_name = "span", (json_nullable) = true, (json_omit_none) = true];
  optional string message = 5 [json_name = "message", (json_required) = true];
  optional string workflow_name = 6 [json_name = "workflow_name", (json_nullable) = true, (json_omit_none) = true];
  optional string node_name = 7 [json_name = "node_name", (json_nullable) = true, (json_omit_none) = true];
  optional string facet_key = 8 [json_name = "facet_key", (json_nullable) = true, (json_omit_none) = true];
  optional string facet_kind = 9 [json_name = "facet_kind", (json_nullable) = true, (json_omit_none) = true];
  optional string field = 10 [json_name = "field", (json_nullable) = true, (json_omit_none) = true];
}

message Severity {
  option (json_wrapper) = "value";
  enum Value {
    error = 0 [(json_enum_name) = "error"];
    info = 1 [(json_enum_name) = "info"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message DiagnosticStage {
  option (json_wrapper) = "value";
  enum Value {
    parse_shape = 0 [(json_enum_name) = "parse_shape"];
    resolve = 1 [(json_enum_name) = "resolve"];
    typecheck = 2 [(json_enum_name) = "typecheck"];
    control_flow = 3 [(json_enum_name) = "control_flow"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message DiagnosticSpan {
  optional string source = 1 [json_name = "source", (json_nullable) = true, (json_omit_none) = true];
  optional uint64 start_line = 2 [json_name = "start_line", (json_required) = true];
  optional uint64 start_col = 3 [json_name = "start_col", (json_required) = true];
  optional uint64 end_line = 4 [json_name = "end_line", (json_required) = true];
  optional uint64 end_col = 5 [json_name = "end_col", (json_required) = true];
}

message ListDiagnosticItem {
  option (json_wrapper) = "items";
  repeated DiagnosticItem items = 1;
}

message DiagnosticSummary {
  optional uint64 error_count = 1 [json_name = "error_count", (json_required) = true];
  optional uint64 info_count = 2 [json_name = "info_count", (json_required) = true];
}

message MapDiagnosticSummary {
  option (json_wrapper) = "entries";
  map<string, DiagnosticSummary> entries = 1;
}

message FacetUsageEntry {
  optional string workflow_name = 1 [json_name = "workflow_name", (json_required) = true];
  optional string node_name = 2 [json_name = "node_name", (json_required) = true];
  optional string slot = 3 [json_name = "slot", (json_required) = true];
}

message ListFacetUsageEntry {
  option (json_wrapper) = "items";
  repeated FacetUsageEntry items = 1;
}

message MapListFacetUsageEntry {
  option (json_wrapper) = "entries";
  map<string, ListFacetUsageEntry> entries = 1;
}

message IssueInfoDto {
  optional uint64 number = 1 [json_name = "number", (json_required) = true];
  optional string default_branch_name = 2 [json_name = "default_branch_name", (json_required) = true];
  optional string title = 3 [json_name = "title", (json_required) = true];
  optional string state = 4 [json_name = "state", (json_required) = true];
  optional string url = 5 [json_name = "url", (json_required) = true];
  optional PrAuthorDto author = 6 [json_name = "author", (json_required) = true];
  optional string created_at = 7 [json_name = "created_at", (json_required) = true];
  optional string updated_at = 8 [json_name = "updated_at", (json_required) = true];
  optional ListIssueLabelDto labels = 9 [json_name = "labels", (json_required) = true];
  optional string body = 11 [json_name = "body", (json_required) = true];
}

message PrAuthorDto {
  optional string login = 1 [json_name = "login", (json_required) = true];
}

message IssueLabelDto {
  optional string name = 1 [json_name = "name", (json_required) = true];
}

message ListIssueLabelDto {
  option (json_wrapper) = "items";
  repeated IssueLabelDto items = 1;
}

message ListIssueInfoDto {
  option (json_wrapper) = "items";
  repeated IssueInfoDto items = 1;
}

message Liststring {
  option (json_wrapper) = "items";
  repeated string items = 1;
}

message AgentSessionItemDto {
  optional string id = 1 [json_name = "id", (json_required) = true];
  optional string workspace_identity = 2 [json_name = "workspaceIdentity", (json_required) = true];
  optional string worktree_path = 3 [json_name = "worktreePath", (json_required) = true];
  optional string workspace_worktree_path = 4 [json_name = "workspaceWorktreePath", (json_required) = true];
  optional AgentSessionProviderDto provider = 5 [json_name = "provider", (json_required) = true];
  optional AgentSessionTreeLocationDto tree_location = 6 [json_name = "treeLocation", (json_required) = true];
  optional string provider_session_id = 8 [json_name = "providerSessionId", (json_nullable) = true];
  optional AgentSessionOperationsDto operations = 10 [json_name = "operations", (json_required) = true];
  optional AgentSessionAvailability availability = 13 [json_name = "availability"];
}

enum AgentSessionAvailability {
  AGENT_SESSION_AVAILABILITY_UNSPECIFIED = 0;
  AGENT_SESSION_AVAILABILITY_OPEN = 1 [(json_enum_name) = "open"];
  AGENT_SESSION_AVAILABILITY_PAUSED = 2 [(json_enum_name) = "paused"];
  AGENT_SESSION_AVAILABILITY_INDETERMINATE = 3 [(json_enum_name) = "indeterminate"];
  AGENT_SESSION_AVAILABILITY_ARCHIVED = 4 [(json_enum_name) = "archived"];
}

message AgentSessionProviderDto {
  option (json_wrapper) = "value";
  enum Value {
    claude = 0 [(json_enum_name) = "claude"];
    codex = 1 [(json_enum_name) = "codex"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message AgentSessionTreeLocationDto {
  optional string tree_id = 1 [json_name = "treeId", (json_required) = true];
  optional string node_execution_id = 2 [json_name = "nodeExecutionId", (json_required) = true];
}

message AgentSessionOperationsDto {
  optional bool can_archive = 1 [json_name = "canArchive", (json_required) = true];
  optional bool can_delete = 3 [json_name = "canDelete", (json_required) = true];
}

message Nullablestring {
  option (json_wrapper) = "value";
  optional string value = 1 [json_name = "value", (json_nullable) = true];
}

message NotionRepoConfigView {
  optional string api_token = 1 [json_name = "api_token", (json_required) = true];
  optional string database_id = 2 [json_name = "database_id", (json_required) = true];
  optional PropertyMappingView property_mapping = 3 [json_name = "property_mapping"];
}

message PropertyMappingView {
  optional string title = 1 [json_name = "title"];
  optional ListLabelPropertyView labels = 2 [json_name = "labels"];
  optional string branch_name = 3 [json_name = "branch_name"];
  optional string branch_prefix = 4 [json_name = "branch_prefix"];
}

message LabelPropertyView {
  optional string name = 1 [json_name = "name", (json_required) = true];
  optional string property_type = 2 [json_name = "property_type", (json_required) = true];
}

message ListLabelPropertyView {
  option (json_wrapper) = "items";
  repeated LabelPropertyView items = 1;
}

message NullableNotionRepoConfigView {
  option (json_wrapper) = "value";
  optional NotionRepoConfigView value = 1 [json_name = "value", (json_nullable) = true];
}

message GetOrSpawnTerminalSurfaceRequest {
  optional uint32 rows = 1 [json_name = "rows", (json_required) = true];
  optional uint32 cols = 2 [json_name = "cols", (json_required) = true];
  optional string cwd = 3 [json_name = "cwd", (json_nullable) = true];
  optional TerminalSurfaceOwnerV1 owner = 4 [json_name = "owner", (json_required) = true];
  optional string label = 5 [json_name = "label", (json_nullable) = true];
}

message GetOrSpawnTerminalV1 {
}

message ProviderAvailabilitySnapshotResponse {
  optional ListProviderAvailabilityItemResponse providers = 1 [json_name = "providers", (json_required) = true];
}

message ProviderAvailabilityItemResponse {
  optional string provider = 1 [json_name = "provider", (json_required) = true];
  optional string display_name = 2 [json_name = "displayName", (json_required) = true];
  optional string default_executable = 3 [json_name = "defaultExecutable", (json_required) = true];
  optional string configured_executable = 4 [json_name = "configuredExecutable", (json_nullable) = true];
  optional string effective_executable = 5 [json_name = "effectiveExecutable", (json_required) = true];
  optional bool available = 6 [json_name = "available", (json_required) = true];
  optional string resolved_executable = 7 [json_name = "resolvedExecutable", (json_nullable) = true];
  optional string unavailable_reason = 8 [json_name = "unavailableReason", (json_nullable) = true];
}

message ListProviderAvailabilityItemResponse {
  option (json_wrapper) = "items";
  repeated ProviderAvailabilityItemResponse items = 1;
}

message ReviewFileViewDto {
  option (json_tag) = "kind";
  oneof variant {
    ReviewTextDiffDto text_diff = 1 [json_name = "textDiff"];
    ReviewImageDto image = 2 [json_name = "image"];
    ReviewBinaryDto binary = 3 [json_name = "binary"];
  }
}

message ReviewTextDiffDto {
  optional string path = 4 [json_name = "path", (json_required) = true];
  optional string original = 5 [json_name = "original", (json_required) = true];
  optional string modified = 6 [json_name = "modified", (json_required) = true];
  optional ReviewTextSource source = 7 [json_name = "source", (json_required) = true];
}

message ReviewTextSource {
  option (json_wrapper) = "value";
  enum Value {
