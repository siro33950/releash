  rpc StartStateSubscription(StartStateSubscriptionRequest) returns (Unit);
  rpc StopStateSubscription(StopStateSubscriptionRequest) returns (Unit);
  rpc RefreshWorkspaces(RefreshWorkspacesRequest) returns (Unit);
  rpc GetReviewBlob(GetReviewBlobRequest) returns (ResultString);
  rpc AbortWorkflow(AbortWorkflowRequest) returns (Unit);
  rpc AckTerminalSurfaceOutput(AckTerminalSurfaceOutputRequest) returns (Unit);
  rpc AddRepoPath(AddRepoPathRequest) returns (ResultBool);
  rpc AppendReviewComment(AppendReviewCommentRequest) returns (ReviewThreadDto);
  rpc ApproveWorkspaceNode(ApproveWorkspaceNodeRequest) returns (Unit);
