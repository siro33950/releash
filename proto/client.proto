  rpc WorkflowSubmitOutput(WorkflowSubmitOutputRequest) returns (Unit);
  rpc WorkflowValidateOutput(WorkflowValidateOutputRequest) returns (WorkflowValidateOutputResponse);
  rpc WorkflowGetOutput(WorkflowGetOutputRequest) returns (WorkflowGetOutputResponse);
  rpc GetServerInfo(Unit) returns (ServerInfo);
  rpc SubscribePush(SubscribePushRequest) returns (stream Push);
  rpc WatchFiles(WatchFilesRequest) returns (ResultUint64);
  rpc WatchGitDirectory(WatchGitDirectoryRequest) returns (ResultUint64);
}

message ServerInfo {
  reserved 1;
  reserved "instance_id";
  string launch_id = 2;
  string release = 3;
  DesktopSettings desktop_settings = 4;
}

message SubscribePushRequest { string subscription_id = 1; }
message WatchFilesRequest { string subscription_id = 1; StartWatchingRequest request = 2; }
message WatchGitDirectoryRequest { string subscription_id = 1; StartGitDirWatchingRequest request = 2; }

message SubscribeTerminalSurfacesRequest { string subscription_id = 1; }
message AttachSubscribedTerminalSurfaceRequest {
  string subscription_id = 1;
  AttachTerminalSurfaceRequest request = 2;
  string stream_id = 3;
}
message TerminalStreamClosed { bool resynchronize = 1; }
message TerminalSubscriptionEvent {
  string attachment_id = 1;
  string stream_id = 5;
  oneof event {
    Unit ready = 2;
    TerminalEvent item = 3;
    TerminalStreamClosed closed = 4;
  }
}


message RefreshWorkspacesRequest {
  optional string repo_path = 2 [json_name = "repoPath", (json_nullable) = true];
  optional string worktree_path = 1 [json_name = "worktreePath", (json_nullable) = true];
}
message WorkspaceListStatusDto {
  optional string state = 3 [json_name = "state", (json_required) = true];
  optional bool loaded = 1 [json_name = "loaded", (json_required) = true];
  optional string error = 2 [json_name = "error", (json_nullable) = true];
}
message WorkspaceBranchDto {
  optional BranchCardDto branch = 1 [(json_flatten) = true, (json_required) = true];
  optional bool has_pr = 2 [json_name = "has_pr", (json_required) = true];
  optional uint64 pr_number = 3 [json_name = "pr_number", (json_nullable) = true];
  optional string pr_url = 4 [json_name = "pr_url", (json_nullable) = true];
}
message WorkspaceWorktreeListDto {
  optional string path = 1 [json_name = "path", (json_required) = true];
  optional WorkspaceListStatusDto status = 2 [json_name = "status", (json_required) = true];
  optional WorkspaceTreeSnapshotDto snapshot = 3 [json_name = "snapshot", (json_nullable) = true];
  optional ListWorkspaceWorkflowHistoryItemDto workflow_history = 4 [json_name = "workflowHistory", (json_required) = true];
}
message WorkspaceRepositoryListDto {
  optional string path = 1 [json_name = "path", (json_required) = true];
  optional WorkspaceListStatusDto status = 2 [json_name = "status", (json_required) = true];
  optional ListWorkspaceBranchDto branches = 3 [json_name = "branches", (json_required) = true];
  optional ListWorkspaceWorktreeListDto worktrees = 4 [json_name = "worktrees", (json_required) = true];
}
message WorkspaceListSnapshotDto {
  optional uint64 generation = 1 [json_name = "generation", (json_required) = true];
  optional WorkspaceListStatusDto status = 2 [json_name = "status", (json_required) = true];
  optional ListWorkspaceRepositoryListDto repositories = 3 [json_name = "repositories", (json_required) = true];
}

message ListWorkspaceBranchDto {
  option (json_wrapper) = "items";
  repeated WorkspaceBranchDto items = 1;
}

message ListWorkspaceWorktreeListDto {
  option (json_wrapper) = "items";
  repeated WorkspaceWorktreeListDto items = 1;
}

message ListWorkspaceRepositoryListDto {
  option (json_wrapper) = "items";
  repeated WorkspaceRepositoryListDto items = 1;
}

message OpenStateStreamRequest { string client_id = 1; }
message StateVersion { string epoch = 1; uint64 sequence = 2; }
message StartStateSubscriptionRequest {
  string client_id = 1;
  string target = 2;
  StateVersion version = 3;
  repeated string args = 4;
}
message StopStateSubscriptionRequest { string client_id = 1; string target = 2; repeated string args = 3; }
message StatePayload {
  oneof value {
    Liststring repository_paths = 1;
    WorkspaceListSnapshotDto workspaces = 2;
    WorkspaceTreeSelectionSnapshotDto selection = 3;
    NullableWorkspaceNodeDetailDto node_detail = 4;
    NullableAgentSessionItemDto agent_session = 5;
    Nullablestring session_node = 6;
    AgentSessionHistoryPageDto session_history = 7;
    ListAgentSessionProviderDto providers = 8;
    ListBranchDto branches = 9;
    Nullablestring branch_base = 10;
    RepositoryBranchCardsSnapshotDto branch_status = 11;
    ResultString current_branch = 12;
    ListIssueInfoDto issues = 13;
    ListWorktreeEntryDto worktrees = 14;
    ResultString repository_root = 15;
    ResultString startup_repository = 16;
    NullableWorkspaceStateDto workspace_state = 17;
  }
}
message StateChange { bool delta = 1; StatePayload payload = 2; }
message StateSubscriptionEvent {
  repeated string args = 7;
  string target = 1;
  StateVersion version = 2;
  oneof event {
    Unit ready = 3;
    StatePayload snapshot = 4;
    StateChange change = 5;
    Unit bookmark = 6;
  }
}
