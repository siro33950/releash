  rpc SaveNotionConfig(SaveNotionConfigRequest) returns (Unit);
  rpc SaveWorkflowSource(SaveWorkflowSourceRequest) returns (SaveWorkflowSourceResultDto);
  rpc SaveWorkspaceState(SaveWorkspaceStateRequest) returns (Unit);
  rpc SetBranchBase(SetBranchBaseRequest) returns (Unit);
  rpc SetReleashBase(SetReleashBaseRequest) returns (Unit);
  rpc StartTerminalInputPerformanceCollection(StartTerminalInputPerformanceCollectionRequest) returns (Unit);
  rpc StartTerminalLaunchPerformanceCollection(StartTerminalLaunchPerformanceCollectionRequest) returns (Unit);
  rpc StartWorkflow(StartWorkflowRequest) returns (ResultString);
  rpc StopWatching(StopWatchingRequest) returns (Unit);
  rpc TakeTerminalInputPerformanceSamples(TakeTerminalInputPerformanceSamplesRequest) returns (ListTerminalInputPerformanceSampleV1);
  rpc TakeTerminalLaunchPerformanceSamples(TakeTerminalLaunchPerformanceSamplesRequest) returns (ListTerminalLaunchPerformanceSampleV1);
  rpc UpdateAppSettings(UpdateAppSettingsRequest) returns (Unit);
  rpc UpdateLoginItemPreference(UpdateLoginItemPreferenceRequest) returns (Unit);
