  rpc CreateAgentSession(CreateAgentSessionRequest) returns (ResultString);
  rpc CreateReviewThread(CreateReviewThreadRequest) returns (ReviewThreadDto);
  rpc CreateWorktree(CreateWorktreeRequest) returns (WorktreeEntryDto);
  rpc DeleteAgentSession(DeleteAgentSessionRequest) returns (Unit);
  rpc DeleteBranch(DeleteBranchRequest) returns (Unit);
  rpc DeleteFacet(DeleteFacetRequest) returns (Unit);
  rpc DeleteNotionConfig(DeleteNotionConfigRequest) returns (Unit);
  rpc DeleteReviewThread(DeleteReviewThreadRequest) returns (Unit);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (Unit);
  rpc DetachTerminalSurface(DetachTerminalSurfaceRequest) returns (Unit);
  rpc DetectEditors(DetectEditorsRequest) returns (ListEditorInfoDto);
  rpc DiagnoseAllCmd(DiagnoseAllCmdRequest) returns (DiagnosticReport);
  rpc DuplicateFacet(DuplicateFacetRequest) returns (Unit);
  rpc DuplicateWorkflow(DuplicateWorkflowRequest) returns (Unit);
  rpc FetchIssues(FetchIssuesRequest) returns (Unit);
  rpc FetchNotionLabelOptions(FetchNotionLabelOptionsRequest) returns (ListNotionLabelOptionView);
  rpc GetAppSettings(GetAppSettingsRequest) returns (AppSection);
  rpc GetApplicationStartupOutcome(GetApplicationStartupOutcomeRequest) returns (ApplicationStartupOutcomeDtoV1);
  rpc GetAutomationConfigDir(GetAutomationConfigDirRequest) returns (ResultString);
  rpc GetExternalEditor(GetExternalEditorRequest) returns (ResultString);
  rpc GetFacet(GetFacetRequest) returns (ResultString);
  rpc GetFileNavigation(GetFileNavigationRequest) returns (FileNavigationResultDto);
  rpc GetLanguageFromPath(GetLanguageFromPathRequest) returns (ResultString);
  rpc GetNotionConfig(GetNotionConfigRequest) returns (NullableNotionRepoConfigView);
  rpc GetOrSpawnTerminalSurface(GetOrSpawnTerminalSurfaceRequest) returns (GetOrSpawnTerminalV1);
  rpc GetPerformanceRealAppMode(GetPerformanceRealAppModeRequest) returns (ResultBool);
  rpc GetPerformanceTelemetryEnabled(GetPerformanceTelemetryEnabledRequest) returns (ResultBool);
  rpc GetProviderAvailability(GetProviderAvailabilityRequest) returns (ProviderAvailabilitySnapshotResponse);
  rpc GetReleashBase(GetReleashBaseRequest) returns (Nullablestring);
  rpc GetReviewFileView(GetReviewFileViewRequest) returns (ReviewFileViewDto);
  rpc GetReviewSnapshot(GetReviewSnapshotRequest) returns (ReviewSnapshotDto);
  rpc GetTerminalPerformanceSwitches(GetTerminalPerformanceSwitchesRequest) returns (TerminalPerformanceSwitchesV1);
  rpc GetTerminalSurface(GetTerminalSurfaceRequest) returns (TerminalSurfaceSummaryV1);
  rpc GetWorkflow(GetWorkflowRequest) returns (WorkflowDto);
  rpc GetWorkflowConfig(GetWorkflowConfigRequest) returns (WorkflowSection);
  rpc GetWorkflowSource(GetWorkflowSourceRequest) returns (ResultString);
  rpc GitCreateBranch(GitCreateBranchRequest) returns (Unit);
  rpc GitStage(GitStageRequest) returns (Unit);
  rpc GitStageReviewGroup(GitStageReviewGroupRequest) returns (Unit);
  rpc GitUnstage(GitUnstageRequest) returns (Unit);
  rpc GitUnstageReviewGroup(GitUnstageReviewGroupRequest) returns (Unit);
  rpc KillTerminalSurface(KillTerminalSurfaceRequest) returns (Unit);
  rpc ListFacetSummaries(ListFacetSummariesRequest) returns (ListFacetSummaryDto);
  rpc ListProviderHookHealthWarnings(ListProviderHookHealthWarningsRequest) returns (ListProviderHookHealthWarningResponse);
  rpc ListReviewThreads(ListReviewThreadsRequest) returns (ListReviewThreadDto);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowSummaryDto);
  rpc OpenAgentSession(OpenAgentSessionRequest) returns (AgentSessionOpenResponse);
  rpc OpenFacetInEditor(OpenFacetInEditorRequest) returns (Unit);
  rpc OpenFolderInEditor(OpenFolderInEditorRequest) returns (Unit);
