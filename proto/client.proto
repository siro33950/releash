  // Repository の名前。origin が GitHub のリポジトリなら GitHub 上のリポジトリ名、それ以外はフォルダ名。
  // 同じ名前の Repository が並ぶときだけ、origin が GitHub の Repository は owner/名前 の形になる。
  optional string name = 5 [json_name = "name", (json_required) = true];
}
