message DirectoryEntry {
  string path = 1;
  string name = 2;
  bool directory = 3;
  bool ignored = 4;
  string status = 5;
}
message DirectorySnapshot {
  repeated DirectoryEntry entries = 1;
  repeated string removed = 2;
  bool delta = 3;
  repeated string order = 4;
}
// 検索と「差分のみ」で絞り込んだファイル一覧。購読の対象 `filtered-files` で届く。
// 購読の引数は、worktree の path に続けて、`name=<検索の入力>` と `changed=true` のうち指定するものを、この順で並べる。
// どちらも無い指定は受け付けない。
message FilteredFilesSnapshot {
  // 項目が残ったディレクトリ。worktree の直下は path が "." である。残った項目が無いときは空である。
  repeated FilteredDirectory directories = 1;
  // 条件に合うファイルが上限の 512 件を超え、結果が一致の一部だけであるとき true。
  bool truncated = 2;
}
// 絞り込みで項目が残ったディレクトリ一つと、その直下に残った項目。
message FilteredDirectory {
  // worktree からの相対 path。
  string path = 1;
  // 直下に残った項目。ファイル一覧の並び（ディレクトリが先、名前の順）で入る。
  repeated DirectoryEntry entries = 2;
}
