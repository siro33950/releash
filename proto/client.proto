message AbortWorkflowRequest {
  optional string execution_id = 1 [json_name = "executionId", (json_required) = true];
}

message Unit {
  option (json_unit) = true;
}

message AckTerminalSurfaceOutputRequest {
  optional string attachment_id = 1 [json_name = "attachmentId", (json_required) = true];
  optional uint64 sequence = 2 [json_name = "sequence", (json_required) = true];
}

message AddRepoPathRequest {
  optional string path = 1 [json_name = "path", (json_required) = true];
}

message ResultBool {
  option (json_wrapper) = "value";
  optional bool value = 1 [json_name = "value", (json_required) = true];
}

message AppendReviewCommentRequest {
  optional string worktree_name = 1 [json_name = "worktreeName", (json_required) = true];
  optional string thread_id = 2 [json_name = "threadId", (json_required) = true];
  optional string content = 3 [json_name = "content", (json_required) = true];
}

message ReviewThreadDto {
  optional string id = 1 [json_name = "id", (json_required) = true];
  optional string worktree_name = 2 [json_name = "worktreeName", (json_required) = true];
  optional ReviewActorWireDto author = 3 [json_name = "author", (json_required) = true];
  optional ReviewTargetWireDto target = 4 [json_name = "target", (json_required) = true];
  optional ReviewThreadStateDto state = 5 [json_name = "state", (json_required) = true];
  optional ListReviewCommentDto comments = 6 [json_name = "comments", (json_required) = true];
  optional ReviewResolveInfoDto resolve = 7 [json_name = "resolve", (json_nullable) = true];
  optional double created_at = 8 [json_name = "createdAt", (json_required) = true];
  optional double updated_at = 9 [json_name = "updatedAt", (json_required) = true];
  optional uint64 version = 10 [json_name = "version", (json_required) = true];
  optional bool can_resolve = 11 [json_name = "canResolve", (json_required) = true];
}

message ReviewActorWireDto {
  optional ReviewActorKindWireDto kind = 1 [json_name = "kind", (json_required) = true];
  optional string backend_id = 2 [json_name = "backendId", (json_nullable) = true];
  optional string model = 3 [json_name = "model", (json_nullable) = true];
  optional string display_name = 4 [json_name = "displayName", (json_required) = true];
}

message ReviewActorKindWireDto {
  option (json_wrapper) = "value";
  enum Value {
    human = 0 [(json_enum_name) = "human"];
    agent = 1 [(json_enum_name) = "agent"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ReviewTargetWireDto {
  optional string file_path = 1 [json_name = "filePath", (json_nullable) = true];
  optional uint32 line_number = 2 [json_name = "lineNumber", (json_nullable) = true];
  optional uint32 end_line = 3 [json_name = "endLine", (json_nullable) = true];
}

message ReviewThreadStateDto {
  option (json_wrapper) = "value";
  enum Value {
    open = 0 [(json_enum_name) = "open"];
    resolved = 1 [(json_enum_name) = "resolved"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ReviewCommentDto {
  optional string id = 1 [json_name = "id", (json_required) = true];
  optional string thread_id = 2 [json_name = "threadId", (json_required) = true];
  optional ReviewActorWireDto author = 3 [json_name = "author", (json_required) = true];
  optional string content = 4 [json_name = "content", (json_required) = true];
  optional double created_at = 5 [json_name = "createdAt", (json_required) = true];
}

message ListReviewCommentDto {
  option (json_wrapper) = "items";
  repeated ReviewCommentDto items = 1;
}

message ReviewResolveInfoDto {
  optional ReviewActorWireDto actor = 1 [json_name = "actor", (json_required) = true];
  optional string outcome = 2 [json_name = "outcome", (json_required) = true];
  optional string summary = 3 [json_name = "summary", (json_required) = true];
  optional double resolved_at = 4 [json_name = "resolvedAt", (json_required) = true];
}

message ApproveWorkspaceNodeRequest {
  optional string worktree_path = 1 [json_name = "worktreePath", (json_required) = true];
  optional string node_id = 2 [json_name = "nodeId", (json_required) = true];
}

message ArchiveAgentSessionRequest {
  optional string agent_session_id = 1 [json_name = "agentSessionId", (json_required) = true];
  optional string caller_request_id = 2 [json_name = "callerRequestId", (json_required) = true];
}

message AgentSessionArchiveResponse {
  option (json_wrapper) = "value";
  enum Value {
    reserved 2;
    reserved "delete_confirmation_required";
    archived = 0 [(json_enum_name) = "archived"];
    already_archived = 1 [(json_enum_name) = "already_archived"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ArchiveWorkspaceWorkflowExecutionRequest {
  optional string worktree_path = 1 [json_name = "worktreePath", (json_required) = true];
  optional string execution_id = 2 [json_name = "executionId", (json_required) = true];
}

message TerminalSurfaceOwnerV1 {
  option (json_tag) = "kind";
  oneof variant {
    TerminalSurfaceOwnerV1Workspace workspace = 1 [json_name = "workspace"];
    TerminalSurfaceOwnerV1Session session = 2 [json_name = "session"];
  }
}

message TerminalSurfaceOwnerV1Workspace {
  optional string workspace_path = 1 [json_name = "workspacePath", (json_required) = true];
}

message TerminalSurfaceOwnerV1Session {
  optional string workspace_path = 1 [json_name = "workspacePath", (json_required) = true];
  optional string session_id = 2 [json_name = "sessionId", (json_required) = true];
}

message AttachTerminalSurfaceRequest {
  optional string attachment_id = 1 [json_name = "attachmentId", (json_required) = true];
  optional TerminalSurfaceOwnerV1 owner = 2 [json_name = "owner", (json_required) = true];
  optional bool recovery = 3 [json_name = "recovery", (json_required) = true];
}

message BuildReviewThreadHandoffRequest {
  optional string worktree_name = 1 [json_name = "worktreeName", (json_required) = true];
  optional string thread_id = 2 [json_name = "threadId", (json_required) = true];
}

message ResultString {
  option (json_wrapper) = "value";
  optional string value = 1 [json_name = "value", (json_required) = true];
}

message ComputeHiddenRangesFromContentRequest {
  optional string original = 1 [json_name = "original", (json_required) = true];
  optional string modified = 2 [json_name = "modified", (json_required) = true];
  optional uint32 context_lines = 3 [json_name = "contextLines", (json_required) = true];
}

message HiddenRangeDto {
  optional uint32 start_line = 1 [json_name = "startLine", (json_required) = true];
  optional uint32 end_line = 2 [json_name = "endLine", (json_required) = true];
  optional uint32 hidden_count = 3 [json_name = "hiddenCount", (json_required) = true];
}

message ListHiddenRangeDto {
  option (json_wrapper) = "items";
  repeated HiddenRangeDto items = 1;
}

message MarkdownDiffSideInput {
  option (json_wrapper) = "value";
  enum Value {
    modified = 0 [(json_enum_name) = "modified"];
    original = 1 [(json_enum_name) = "original"];
  }
  optional Value value = 1 [json_name = "value", (json_required) = true];
}

message ComputeMarkdownDiffRangesRequest {
  optional string original = 1 [json_name = "original", (json_required) = true];
  optional string modified = 2 [json_name = "modified", (json_required) = true];
  optional MarkdownDiffSideInput side = 3 [json_name = "side", (json_required) = true];
}

message DiffRangeDto {
  optional uint32 start_line = 1 [json_name = "startLine", (json_required) = true];
  optional uint32 end_line = 2 [json_name = "endLine", (json_required) = true];
  optional DiffRangeKindDto kind = 3 [json_name = "type", (json_required) = true];
}

message DiffRangeKindDto {
  option (json_wrapper) = "value";
