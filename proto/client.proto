    StatePayload snapshot = 4;
    StateChange change = 5;
    Unit bookmark = 6;
    StateReadFailure failure = 8;
  }
}

message ReportTerminalProcessedRequest {
  reserved 1, 2;
  reserved "client_id", "args";
  string subscription_id = 4;
  uint32 units = 3;
}

