config_version = "0"

exclude_patterns = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/coverage/**",
    "**/*.min.js",
    "server/resources/**",
]

[[source]]
name = "default"
default = true

[[plugin]]
name = "clippy"

[smells.function_complexity]
threshold = 20

[smells.nested_control_flow]
threshold = 5
