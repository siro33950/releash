config_version = "0"

exclude_patterns = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/coverage/**",
    "**/*.min.js",
    "server/resources/**",
]

[[source]]
name = "default"
default = true

[[plugin]]
name = "clippy"

[[plugin]]
name = "biome"
version = "2.5.15"
prefix = "clients/desktop"

[[plugin]]
name = "ast-grep"
version = "0.40.0"
affects_cache = [".ast-grep/rules/*.yml"]

[smells.function_complexity]
threshold = 20

[smells.nested_control_flow]
threshold = 5
