# 新規・変更構文の網羅例: feature-batch
# 目的: full-pipeline.yml（既存例の変換）に登場しない新構文をすべて使う。
# 構文の正本は syntax.md、モデルの決定は decisions.md。
#
# シナリオ: spike で実現可能性を確認 → 機能計画 → 機能ごとに「実装+検証」の
#           一連の流れを隔離 worktree で並走 → 品質チェック → リリース確認 → 報告
#
# 構文カバレッジ:
#   - children ①文字列参照            … quality_gate の lint_docs
#   - children ②参照 + 扱い           … main の大半
#   - children ③名前付きインライン宣言 … main の gate_judge
#   - children ④無名エントリ          … quality_gate の command 2つと ref
#   - ref（カタログ形）               … release_check
#   - sequence のネスト（部品 sequence + input / artifact） … implement_and_verify
#   - sequence の output（artifact の供給元指定） … implement_and_verify
#   - fanout の items + 複数パラメータ供給（items / 共通文脈の配線）… implement_all
#   - fanout node の worktree: isolated    … implement_all
#   - fanout node の completion: approval  … implement_all（全子完了 + human 承認）
#   - 単独 node の worktree: isolated … spike
#   - session 以外への completion / 省略時の既定 … 全体
#   - input はリスト（文字列 = 型なし、名前キーのマップ = Contract あり）… 各所
#   - Node 共通フィールド（input / artifact / completion / worktree）は
#     kind ブロックの外 … 全体
#   - request の配線（供給元名として書く） … spike / plan_features
#   - 本文のパラメータ名参照          … gate_judge の {{ checks }}

name: feature-batch
description: spike → 機能計画 → 機能ごとに実装+検証を隔離並走 → 品質チェック → リリース確認
entry: main

schemas:
  feature:
    type: object
    properties:
      feature_id:
        type: string
  plan:
    type: object
    properties:
      features:
        type: array
        items: feature
  spike_findings:
    type: string
  verify_result:
    type: object
    properties:
      passed:
        type: boolean
  gate_result:
    type: object
    properties:
      all_pass:
        type: boolean

nodes:

  # ---- root の Sequence ----

  main:
    sequence:
      entry: spike
      children:
        - spike:
            inputs:
              goal: request                    # request は供給元名として配線する
            rules:
              - next: plan_features
        - plan_features:
            inputs:
              goal: request
              findings: spike
            rules:
              - next: implement_all
        - implement_all:
            rules:
              - next: quality_gate
        - quality_gate:
            rules:
              - next: gate_judge
        - gate_judge:                          # ③ 名前付きインライン宣言（one-off の畳み）
            command: "echo '{{ checks }}' | jq '{all_pass: all(.[].ok)}'"
            input:
              - checks                         # Contract なし
            artifact: gate_result
            inputs:
              checks: quality_gate             # fanout の artifact = 子 artifact の配列
            rules:
              - when:
                  on: all_pass
                  then: release_check
                next: fix_integration
        - fix_integration:
            inputs:
              log: quality_gate
            rules:
              - loop_guard:
                  max_iterations: 2
                  on_exhausted: report
              - next: quality_gate
        - release_check:
            rules:
              - next: report
        - report:                              # rules なし = 終端
            inputs:
              results: implement_all
              gate: gate_judge

  # ---- 葉・合成子の部品 ----

  spike:
    session:
      model: claude-opus-4-8
      permission: edit
      facets:
        instruction: spike-feasibility
    completion: approval          # human が spike の知見を確認してから先へ
    worktree: isolated            # 単独 node の隔離。diff は branch に残り本体を汚さない
    input:
      - goal
    artifact: spike_findings

  plan_features:
    session:
      model: claude-opus-4-8
      permission: read
      facets:
        instruction: plan-features
    input:
      - goal
      - findings
    artifact: plan

  implement_all:
    fanout:
      children:
        - implement_and_verify:
            inputs:
              feature: items               # 展開の各要素をこのパラメータへ
              plan: plan_features          # 全子共通の供給
      items: plan_features.features
    worktree: isolated                     # 子（実行）ごとに独立 worktree で並走
    completion: approval                   # 全子完了後、human が一括確認して完了

  implement_and_verify:                    # 部品 sequence（Interface を持つ）
    sequence:
      entry: implement
      output: verify                       # verify の Artifact がこの sequence の Artifact になる
      children:
        - implement:
            inputs:
              feature: feature             # 自分の input パラメータを供給元に書く
              plan: plan
            rules:
              - next: verify
        - verify:
            inputs:
              feature: feature
    input:
      - feature: feature                   # items 検証のため型あり
      - plan                               # 共通文脈。型なし
    artifact: verify_result

  implement:
    session:
      model: claude-sonnet-5
      permission: edit
      facets:
        instruction: implement-feature
    input:
      - feature: feature
      - plan

  verify:
    command: "scripts/verify.sh {{ feature.feature_id }}"
    input:
      - feature: feature
    artifact: verify_result

  quality_gate:
    fanout:
      children:
        - command: "cargo test --workspace"       # ④ 無名インライン宣言
        - command: "cargo clippy -- -D warnings"  # ④
        - lint_docs                               # ① 文字列参照
        - ref: security-scan                      # ④ 無名の ref（別 workflow の手順を走らせる）

  lint_docs:
    command: "cargo doc --no-deps"

  release_check:
    ref: release-checklist                 # 別 WorkflowDefinition の埋め込み

  fix_integration:
    session:
      model: claude-opus-4-8
      permission: edit
      facets:
        instruction: fix-integration-failures
    input:
      - log

  report:
    session:
      model: claude-opus-4-8
      permission: read
      facets:
        instruction: summarize-batch
    completion: approval
    input:
      - results
      - gate
