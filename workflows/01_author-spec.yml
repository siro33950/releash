name: 01_author-spec
description: Issue、Story、または自由文RequestからRequirements・Behavior・Designを順番に作成し、検証・検討・修正の1回パスを経て、最後に人間が完成Specをレビューする。

schemas:
  workflow-text: string
  document-reference: string
  finding-id: string

  spec-finding:
    type: object
    properties:
      finding_id: string
      owner:
        type: string
        enum:
        - REQUIREMENTS
        - BEHAVIOR
        - DESIGN
      problem: string
      evidence:
        type: array
        items: workflow-text
      required_change: string
    required:
    - finding_id
    - owner
    - problem
    - evidence
    - required_change

  spec-input:
    type: object
    properties:
      spec_dir: string
      primary_sources:
        type: array
        items: document-reference
      additional_sources:
        type: array
        items: document-reference
      request_items:
        type: array
        items: workflow-text
      summary: string
    required:
    - spec_dir
    - primary_sources
    - additional_sources
    - request_items
    - summary

  validation-result:
    type: object
    properties:
      findings:
        type: array
        items: spec-finding
      summary: string
    required:
    - findings
    - summary

  validation-scan:
    type: object
    properties:
      has_findings:
        type: boolean
    required:
    - has_findings

  consideration-result:
    type: object
    properties:
      accepted_finding_ids:
        type: array
        items: finding-id
      rejected_finding_ids:
        type: array
        items: finding-id
      summary: string
    required:
    - accepted_finding_ids
    - rejected_finding_ids
    - summary

  consideration-scan:
    type: object
    properties:
      has_accepted:
        type: boolean
    required:
    - has_accepted

  repair-result:
    type: object
    properties:
      changed_documents:
        type: array
        items: document-reference
      addressed_finding_ids:
        type: array
        items: finding-id
      summary: string
    required:
    - changed_documents
    - addressed_finding_ids
    - summary

nodes:
  # main: IntakeSequence（Request整理）→AuthoringSequence（3文書作成）→
  # SpecSequence（検証・検討・修正）→FinalReviewSequence（人間レビュー）の順に進む。
  main:
    sequence:
      children:
      - intake:
          inputs:
            goal: request
      - requirements_author:
          inputs:
            intake: intake
      - behavior_author:
          inputs:
            intake: intake
      - design_author:
          inputs:
            intake: intake
      - spec_validate:
          inputs:
            intake: intake
      - check_validation:
          rules:
          - when:
              on: has_findings
              then: spec_consider
            next: final_review
      - spec_consider:
          inputs:
            intake: intake
            spec_validate: spec_validate
      - check_consideration:
          rules:
          - when:
              on: has_accepted
              then: spec_repair
            next: final_review
      - spec_repair:
          inputs:
            intake: intake
            spec_validate: spec_validate
            spec_consider: spec_consider
      - final_review:
          inputs:
            intake: intake
            spec_validate: spec_validate
            spec_consider: spec_consider
            spec_repair: spec_repair

  # IntakeSequence: Requestを入力参照と配置先へ整理する。
  intake:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: author-spec-governance
        instruction: author-spec-intake
    artifact: spec-input
    input:
    - goal

  # AuthoringSequence: 3文書を上流から順に作成する。検証は行わない。
  requirements_author:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge: spec-requirements
        instruction: author-spec-write-requirements
    input:
    - intake

  behavior_author:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        instruction: author-spec-write-behavior
    input:
    - intake

  design_author:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-write-design
    input:
    - intake

  # SpecSequence: 3文書を1単位として検証・検討・修正を一度だけ行う。
  # 修正の確認と残る問題の裁定はFinalReviewの人間が行う。
  spec_validate:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-validate-spec
    artifact: validation-result
    input:
    - intake

  check_validation:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node spec_validate --json |
      jq '{has_findings: (.artifact.findings | length > 0)}'
    artifact: validation-scan

  spec_consider:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-consider-spec
    artifact: consideration-result
    input:
    - intake
    - spec_validate

  check_consideration:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node spec_consider --json |
      jq '{has_accepted: (.artifact.accepted_finding_ids | length > 0)}'
    artifact: consideration-scan

  spec_repair:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-repair-spec
    artifact: repair-result
    input:
    - intake
    - spec_validate
    - spec_consider

  # FinalReviewSequence: 通常経路で唯一の人間による文書レビュー。承認をもって完了する。
  final_review:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: author-spec-governance
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        instruction: author-spec-final-review
    completion: approval
    input:
    - intake
    - spec_validate
    - spec_consider
    - spec_repair
