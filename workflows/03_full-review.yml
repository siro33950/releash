name: 03_full-review
description: 既存Specを入力として、FullReview（6観点×2モデル）と検証を実行し、open Threadを提示して完了する。

schemas:
  document-reference: string
  directive-text: string
  workflow-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  thread-id: string
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      has_open_threads:
        type: boolean
    required:
    - threads
    - has_open_threads

nodes:

  main:
    sequence:
      children:
      - resolve_request:
          inputs:
            goal: request
      - full_review_fanout:
          inputs:
            resolve_request: resolve_request
      - verify_full_review_fanout:
          inputs:
            resolve_request: resolve_request
      - check_full_review_threads
      - review_report:
          inputs:
            check_full_review_threads: check_full_review_threads

  resolve_request:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: planning
        instruction: existing-spec-resolve-request
    artifact: implementation-context
    input:
    - goal

  full_review_fanout:
    input:
    - resolve_request
    fanout:
      children:
      - full_review_acceptance_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_acceptance_codex:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_structure_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_structure_codex:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_quality_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_quality_codex:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_test_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_test_codex:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_security_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_security_codex:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_architecture_opus:
          inputs:
            goal: request
            resolve_request: resolve_request
      - full_review_architecture_codex:
          inputs:
            goal: request
            resolve_request: resolve_request

  full_review_acceptance_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-acceptance
    input:
    - goal
    - resolve_request
  full_review_acceptance_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-acceptance
    input:
    - goal
    - resolve_request
  full_review_structure_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-structure
    input:
    - goal
    - resolve_request
  full_review_structure_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-structure
    input:
    - goal
    - resolve_request
  full_review_quality_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-quality
    input:
    - goal
    - resolve_request
  full_review_quality_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-quality
    input:
    - goal
    - resolve_request
  full_review_test_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-test
    input:
    - goal
    - resolve_request
  full_review_test_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-test
    input:
    - goal
    - resolve_request
  full_review_security_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-security
    input:
    - goal
    - resolve_request
  full_review_security_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-security
    input:
    - goal
    - resolve_request
  full_review_architecture_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-architecture
    input:
    - goal
    - resolve_request
  full_review_architecture_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: review-architecture
    input:
    - goal
    - resolve_request

  verify_full_review_fanout:
    input:
    - resolve_request
    fanout:
      children:
      - verify_full_review_opus:
          inputs:
            resolve_request: resolve_request
      - verify_full_review_codex:
          inputs:
            resolve_request: resolve_request

  verify_full_review_opus:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: full-review-verify-and-classify
    input:
    - resolve_request
  verify_full_review_codex:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: auto
      facets:
        policy: reviewing
        knowledge: releash-thread-cli
        instruction: full-review-verify-and-classify
    input:
    - resolve_request

  check_full_review_threads:
    command: >-
      releash review list --state open --json |
      jq '{threads: map({thread_id: .id}), has_open_threads: (length > 0)}'
    artifact: thread-scan

  review_report:
    session:
      provider: claude
      model: claude-opus-5
      permission: auto
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: review-report
    input:
    - check_full_review_threads
