name: 04_review-fix-policy
description: open Review Threadの修正方針を1つのSessionで順に決定し、完了を報告する。

schemas:
  document-reference: string
  directive-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  thread-reference:
    type: object
    properties:
      thread_id: string
    required:
    - thread_id
  thread-scan:
    type: object
    properties:
      threads:
        type: array
        items: thread-reference
      has_open_threads:
        type: boolean
    required:
    - threads
    - has_open_threads

nodes:

  main:
    sequence:
      children:
      - resolve_request:
          inputs:
            goal: request
      - check_open_threads:
          rules:
          - when:
              on: has_open_threads
              then: decide_fix_policies
            next: policy_report
      - decide_fix_policies:
          inputs:
            spec: resolve_request.spec_dir
            check_open_threads: check_open_threads
      - policy_report:
          inputs:
            check_open_threads: check_open_threads

  resolve_request:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: planning
        instruction: existing-spec-resolve-request
    artifact: implementation-context
    input:
    - goal

  check_open_threads:
    command: >-
      releash review list --state open --json |
      jq '{threads: map({thread_id: .id}), has_open_threads: (length > 0)}'
    artifact: thread-scan

  decide_fix_policies:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: triage
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        - releash-thread-cli
        instruction: existing-spec-decide-fix-policy
    input:
    - spec
    - check_open_threads

  policy_report:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: policy-report
    input:
    - check_open_threads
