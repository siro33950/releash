name: 02_implement-existing-spec
description: 既存Specを入力として、並列タスク分解・fanout実装・一括検証ゲートを全Task完了までループし、Human checkpointで承認する。

schemas:
  document-reference: string
  directive-text: string
  workflow-text: string
  implementation-context:
    type: object
    properties:
      spec_dir: string
      spec_documents:
        type: array
        items: document-reference
      reference_documents:
        type: array
        items: document-reference
      directives:
        type: array
        items: directive-text
    required:
    - spec_dir
    - spec_documents
    - reference_documents
    - directives
  requirement-id: string
  implement-task-verification:
    type: object
    properties:
      condition: string
    required:
    - condition
  implement-task:
    type: object
    properties:
      task_id: string
      requirements:
        type: array
        items: requirement-id
      files:
        type: array
        items: document-reference
      outputs:
        type: array
        items: workflow-text
      verify:
        type: array
        items: implement-task-verification
    required:
    - task_id
    - requirements
    - files
    - outputs
    - verify
  implement-tasks:
    type: object
    properties:
      tasks:
        type: array
        items: implement-task
      summary: string
    required:
    - tasks
    - summary
  task-scan:
    type: object
    properties:
      has_tasks:
        type: boolean
    required:
    - has_tasks
  implementation-verification:
    type: object
    properties:
      issues:
        type: array
        items: workflow-text
      unverifiable:
        type: array
        items: workflow-text
    required:
    - issues
    - unverifiable
  verification-scan:
    type: object
    properties:
      has_issues:
        type: boolean
    required:
    - has_issues

nodes:

  main:
    sequence:
      children:
      - resolve_request:
          inputs:
            goal: request
      - create_detailed_design:
          inputs:
            spec: resolve_request.spec_dir
            resolve_request: resolve_request
            verify_implementation: verify_implementation
          rules:
          - loop_guard:
              max_iterations: 3
              on_exhausted: implementation_confirmation
          - next: check_tasks
      - check_tasks:
          rules:
          - when:
              on: has_tasks
              then: implement_fanout
            next: implementation_confirmation
      - implement_fanout:
          inputs:
            spec: resolve_request.spec_dir
            resolve_request: resolve_request
      - verify_implementation:
          inputs:
            spec: resolve_request.spec_dir
            resolve_request: resolve_request
            create_detailed_design: create_detailed_design
      - check_verification:
          rules:
          - when:
              on: has_issues
              then: create_detailed_design
            next: implementation_confirmation
      - implementation_confirmation:
          inputs:
            spec: resolve_request.spec_dir
            create_detailed_design: create_detailed_design
            verify_implementation: verify_implementation

  resolve_request:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: planning
        instruction: existing-spec-resolve-request
    artifact: implementation-context
    input:
    - goal

  create_detailed_design:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: planning
        knowledge:
        - spec-requirements
        - spec-behavior
        - spec-design
        - implement-task
        instruction: create_parallel_tasks
    artifact: implement-tasks
    input:
    - spec
    - resolve_request
    - verify_implementation

  check_tasks:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node create_detailed_design --json |
      jq '{has_tasks: (.artifact.tasks | length > 0)}'
    artifact: task-scan

  implement_fanout:
    input:
    - spec
    - resolve_request
    fanout:
      children:
      - implement_task:
          inputs:
            item: items
            spec: spec
            resolve_request: resolve_request
      items: create_detailed_design.tasks

  implement_task:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: coding
        knowledge: implement-task
        instruction: implement_single_task
    input:
    - item: implement-task
    - spec
    - resolve_request

  verify_implementation:
    session:
      provider: codex
      model: gpt-5.6-sol
      permission: danger-full-access
      facets:
        policy: reviewing
        knowledge: implement-task
        instruction: verify_implementation
    artifact: implementation-verification
    input:
    - spec
    - resolve_request
    - create_detailed_design

  check_verification:
    command: >-
      releash workflow output get "$RELEASH_WORKFLOW_EXECUTION_ID"
      --node verify_implementation --json |
      jq '{has_issues: (.artifact.issues | length > 0)}'
    artifact: verification-scan

  implementation_confirmation:
    session:
      provider: claude
      model: claude-opus-5
      permission: acceptEdits
      facets:
        policy: reporting
        knowledge: releash-thread-cli
        instruction: implementation-confirmation
    completion: approval
    input:
    - spec
    - create_detailed_design
    - verify_implementation
