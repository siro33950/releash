name: CI checks

on:
  workflow_call:
    inputs:
      affected:
        required: true
        type: boolean
      ref:
        required: true
        type: string
      group:
        required: true
        type: string
      project:
        required: true
        type: string
      targets:
        required: true
        type: string
      runner:
        default: ubuntu-latest
        type: string
      skip-breaking:
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  NX_DAEMON: "false"

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.affected
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        if: inputs.affected
      - uses: actions/cache@v6
        if: inputs.affected
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - name: Prepare protocol comparison baseline
        if: ${{ inputs.affected && (inputs.group == 'quality') }}
        run: git branch --force main origin/main
      - name: Install Rust toolchain
        if: inputs.affected
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.affected && (contains(fromJSON('["server", "cli"]'), inputs.group)) }}
        with:
          shared-key: pr-${{ inputs.group }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(matrix.target, 'test-unit') || (runner.os == 'macOS' && inputs.group == 'cli' && matrix.target == 'test-integration')) }}
      - name: Run check
        if: inputs.affected
        env:
          NX_PROJECT: ${{ inputs.project }}
          NX_TARGET: ${{ matrix.target }}
          BUF_SKIP_BREAKING: ${{ inputs.skip-breaking }}
        run: ./nx run "$NX_PROJECT:$NX_TARGET" --parallel=1 --outputStyle=static
