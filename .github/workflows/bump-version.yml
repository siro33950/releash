name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v3
      - name: Bump version with Nx
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          ./nx release version "$BUMP"
          VERSION=$(node -p "require('./clients/desktop/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' clients/desktop/tauri.conf.json > tmp.json && mv tmp.json clients/desktop/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E '/^name = "(releashd|releash|releash-desktop)"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/;}' Cargo.lock
          sed -i -E "s/^(    MARKETING_VERSION:).*/\\1 '$VERSION'/" clients/macos/project.yml

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "release: v${{ env.VERSION }}"
          branch: release/v${{ env.VERSION }}
          title: "release: v${{ env.VERSION }}"
          body: "Bump version to ${{ env.VERSION }} (${{ inputs.bump }})"
