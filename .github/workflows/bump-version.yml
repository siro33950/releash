name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v3
      - name: Bump version with Nx
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node .github/scripts/bump-version.cjs "$BUMP"
          VERSION=$(node -p "require('./clients/desktop/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "release: v${{ env.VERSION }}"
          branch: release/v${{ env.VERSION }}
          title: "release: v${{ env.VERSION }}"
          body: "Bump version to ${{ env.VERSION }} (${{ inputs.bump }})"
