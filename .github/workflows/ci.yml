name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - id: test
        run: pnpm test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Add PR comment with test results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            const passed = '${{ steps.test.outcome }}' !== 'failure';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'All tests passed' : 'Some tests failed';
            const body = [
              `## ${icon} Integration Tests: ${status}`,
              '',
              `📊 [View HTML Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Generated by Playwright integration tests_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Integration Tests:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Workflow decision tests
        run: node --test .github/scripts/workflows-test.mjs

  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &rust-changes
        name: Detect Rust-relevant changes
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const pr = context.payload.pull_request;
            const base = pr ? pr.base.sha : context.payload.before;
            const head = pr ? pr.head.sha : context.sha;
            if (/^0+$/.test(base)) {
              core.setOutput('rust', true);
              return;
            }
            const range = pr ? `${base}...${head}` : base;
            const args = ['diff', '--no-renames', '--name-only', '-z', range];
            if (!pr) args.push(head);
            const paths = execFileSync('git', args).toString('utf8').split('\0').filter(Boolean);
            core.setOutput('rust', paths.some(path => !path.startsWith('docs/') && !/^[^/]+\.md$/.test(path)));
      - name: Install Tauri dependencies
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.rust == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.rust == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Build frontend assets for Tauri
        if: steps.changes.outputs.rust == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: src-tauri
          key: rust-lint
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-deny
        id: setup
        if: steps.changes.outputs.rust == 'true'
      - run: cargo fmt --check
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
      - run: cargo clippy --locked -- -D warnings
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
      - run: cargo deny --locked check
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
      - name: Lint Tauri-free backend
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
        run: cargo clippy --locked --no-default-features --bin releash-backend -- -D warnings

  rust-test-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *rust-changes
      - name: Install Tauri dependencies
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.rust == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.rust == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Build frontend assets for Tauri
        if: steps.changes.outputs.rust == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        id: setup
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: src-tauri
          key: rust-test-desktop
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo test --locked
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}

  rust-test-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *rust-changes
      - name: Install Tauri dependencies
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@v2
        id: setup
        if: steps.changes.outputs.rust == 'true'
        with:
          workspaces: src-tauri
          key: rust-test-headless
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Headless backend unit tests
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
        run: cargo test --locked --no-default-features --lib
      - name: Headless daemon protocol smoke test
        if: ${{ !cancelled() && steps.changes.outputs.rust == 'true' && steps.setup.outcome == 'success' }}
        run: cargo test --locked --no-default-features --test daemon_smoke

  # ruleset の required status check が参照する名前を保つための集約ジョブ。
  # lint と test を並列に回しても、片方の失敗でもう片方の結果を失わない。
  rust:
    needs: [rust-lint, rust-test-desktop, rust-test-headless]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Rust jobs
        run: |
          lint='${{ needs.rust-lint.result }}'
          desktop='${{ needs.rust-test-desktop.result }}'
          headless='${{ needs.rust-test-headless.result }}'
          echo "rust-lint=$lint rust-test-desktop=$desktop rust-test-headless=$headless"
          for result in "$lint" "$desktop" "$headless"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: qltysh/qlty-action/install@v2
      - run: qlty install
      - run: qlty check --no-progress --all
