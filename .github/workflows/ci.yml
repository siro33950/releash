name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: ts-coverage
          path: coverage/coverage-final.json
          retention-days: 7
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: test
        run: pnpm test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Add PR comment with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            const passed = '${{ steps.test.outcome }}' !== 'failure';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'All tests passed' : 'Some tests failed';
            const body = [
              `## ${icon} Integration Tests: ${status}`,
              '',
              `📊 [View HTML Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Generated by Playwright integration tests_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Integration Tests:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - name: Build frontend assets for Tauri
        working-directory: .
        run: pnpm install --frozen-lockfile && pnpm build:bridge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-ci
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo deny --locked check
      - run: cargo llvm-cov --locked --codecov --output-path rust-codecov.json
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: src-tauri/rust-codecov.json
          retention-days: 7
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src-tauri/rust-codecov.json
          flags: rust
          fail_ci_if_error: false
      - run: cargo build --locked

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: qltysh/qlty-action/install@v2
      - run: qlty install
      - run: qlty check --no-progress --all
