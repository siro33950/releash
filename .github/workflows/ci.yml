name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: ts-coverage
          path: coverage/coverage-final.json
          retention-days: 7
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: test
        run: pnpm test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Add PR comment with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            const passed = '${{ steps.test.outcome }}' !== 'failure';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'All tests passed' : 'Some tests failed';
            const body = [
              `## ${icon} Integration Tests: ${status}`,
              '',
              `📊 [View HTML Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Generated by Playwright integration tests_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Integration Tests:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  screenshots:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'src/components/ui/**'
              - 'src/components/layout/**'
              - 'src/hooks/**'
              - 'src/contexts/**'
              - 'src/lib/**'
              - 'tailwind.config.*'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tests/helpers/**'
              - 'playwright.screenshot.config.ts'
            source-control:
              - 'src/components/panels/SourceControl*'
            file-tree:
              - 'src/components/panels/FileTree*'
              - 'src/components/panels/Sidebar*'
            search:
              - 'src/components/panels/SearchPanel*'
            settings:
              - 'src/components/panels/SettingsModal*'
            pull-request:
              - 'src/components/panels/PullRequest*'
            review:
              - 'src/components/panels/ReviewPanel*'
            editor:
              - 'src/components/panels/EditorTabContent*'
              - 'src/components/panels/MonacoDiff*'
              - 'src/components/panels/ImageDiff*'
              - 'src/components/panels/MarkdownDiff*'
            worktree-view:
              - 'src/screens/WorktreeView*'
            workspace:
              - 'src/screens/WorkspaceManager*'
              - 'src/components/workspace/**'
              - 'src/components/panels/IssuePanel*'
              - 'src/components/panels/NotionPanel*'
              - 'src/components/panels/RemotePanel*'

      - name: Determine which screenshot tests to run
        id: check
        run: |
          TEST_FILES=""
          SHARED="${{ steps.filter.outputs.shared }}"

          if [ "$SHARED" = "true" ]; then
            # shared変更なら全テスト
            TEST_FILES="tests/screenshots/"
          else
            # 個別パネルの変更を検出
            if [ "${{ steps.filter.outputs.source-control }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/source-control.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.file-tree }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/file-tree.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.search }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/search-panel.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.settings }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/settings-panel.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.pull-request }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/pull-request.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.review }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/review-panel.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.editor }}" = "true" ] || [ "${{ steps.filter.outputs.worktree-view }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/editor-layout.screenshot.ts tests/screenshots/worktree-dialogs.screenshot.ts"
            fi
            if [ "${{ steps.filter.outputs.workspace }}" = "true" ]; then
              TEST_FILES="$TEST_FILES tests/screenshots/workspace-kanban.screenshot.ts tests/screenshots/workspace-panels.screenshot.ts"
            fi
          fi

          TEST_FILES=$(echo "$TEST_FILES" | xargs)
          if [ -n "$TEST_FILES" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "test_files=" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v5
        if: steps.check.outputs.should_run == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.should_run == 'true'
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.check.outputs.should_run == 'true'

      - name: Run screenshot tests (update snapshots)
        if: steps.check.outputs.should_run == 'true'
        id: screenshots
        continue-on-error: true
        run: pnpm test:screenshots:update -- ${{ steps.check.outputs.test_files }}

      - uses: actions/upload-artifact@v7
        if: always() && steps.check.outputs.should_run == 'true'
        with:
          name: screenshot-diffs
          path: test-results/
          retention-days: 7

      - name: Check for screenshot changes
        if: steps.check.outputs.should_run == 'true' && steps.screenshots.outcome == 'success'
        id: diff
        run: |
          CHANGED=$(git diff --name-only tests/__screenshots__/ | wc -l | tr -d ' ')
          NEW=$(git ls-files --others --exclude-standard tests/__screenshots__/ | wc -l | tr -d ' ')
          TOTAL=$((CHANGED + NEW))
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Create screenshot update PR
        if: steps.diff.outputs.count != '' && steps.diff.outputs.count != '0'
        id: update-pr
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_BRANCH="$PR_HEAD_REF"
          UPDATE_BRANCH="screenshot-update/pr-${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp -r tests/__screenshots__/ /tmp/updated-screenshots/

          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$UPDATE_BRANCH" "origin/$HEAD_BRANCH"

          rm -rf tests/__screenshots__/
          cp -r /tmp/updated-screenshots/ tests/__screenshots__/
          git add tests/__screenshots__/
          git commit -m "chore: update screenshot baselines for PR #${PR_NUMBER}"
          git push origin "$UPDATE_BRANCH" --force

          # 既存の更新PRをチェック
          EXISTING_PR=$(gh pr list --head "$UPDATE_BRANCH" --base "$HEAD_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$EXISTING_PR" ]; then
            # 新規PR作成
            NEW_PR_URL=$(gh pr create \
              --head "$UPDATE_BRANCH" \
              --base "$HEAD_BRANCH" \
              --title "chore: update screenshot baselines for PR #${PR_NUMBER}" \
              --body "$(cat <<EOF
          ## Summary
          - PR #${PR_NUMBER} のスクリーンショットベースラインを自動更新

          このPRをマージすると、スクリーンショットのベースライン画像が更新されます。

          _Generated automatically by CI_
          EOF
            )")
            echo "pr_url=$NEW_PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "pr_url=$(gh pr view "$EXISTING_PR" --json url --jq '.url')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Close stale update PR (no diffs)
        if: steps.diff.outputs.count == '0' && steps.check.outputs.should_run == 'true' && steps.screenshots.outcome == 'success'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_BRANCH="$PR_HEAD_REF"
          UPDATE_BRANCH="screenshot-update/pr-${PR_NUMBER}"

          EXISTING_PR=$(gh pr list --head "$UPDATE_BRANCH" --base "$HEAD_BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --comment "スクリーンショットの差分が解消されたため、このPRを自動クローズします。"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Post PR comment with screenshot results
        if: always() && steps.check.outputs.should_run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            const testFailed = '${{ steps.screenshots.outcome }}' === 'failure';
            const diffCount = parseInt('${{ steps.diff.outputs.count }}' || '0', 10);
            const updatePrUrl = '${{ steps.update-pr.outputs.pr_url }}';
            const testFiles = '${{ steps.check.outputs.test_files }}'.trim();
            const screens = testFiles
              ? testFiles.split(/\s+/).map(f => f.replace('tests/screenshots/', '').replace('.screenshot.ts', '')).filter(Boolean).join(', ') || 'all'
              : 'all';

            const lines = [];

            if (testFailed) {
              lines.push(
                '## ❌ Screenshot Tests: Failed',
                '',
                `**Tested screens:** ${screens}`,
                '',
                `テスト自体が失敗しました。[ワークフローログ](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})を確認してください。`,
              );
            } else if (diffCount > 0) {
              lines.push(
                '## 📸 Screenshot Tests: Baseline update required',
                '',
                `**Tested screens:** ${screens}`,
                '',
                `${diffCount} 件のスクリーンショットに差分が検出されました。`,
              );
              if (updatePrUrl) {
                lines.push(
                  '',
                  `更新PR: ${updatePrUrl}`,
                  '',
                  'このPRをマージするとベースライン画像が更新されます。',
                );
              }
            } else {
              lines.push(
                '## ✅ Screenshot Tests: All screenshots match',
                '',
                `**Tested screens:** ${screens}`,
              );
            }

            lines.push('', '_Generated by Playwright screenshot tests_');
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Screenshot Tests:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - name: Build SDK bridge bundle
        working-directory: .
        run: pnpm install --frozen-lockfile && pnpm build:bridge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo deny check
      - run: cargo llvm-cov --codecov --output-path rust-codecov.json
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: src-tauri/rust-codecov.json
          retention-days: 7
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src-tauri/rust-codecov.json
          flags: rust
          fail_ci_if_error: false
      - run: cargo build

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: qltysh/qlty-action/install@v2
      - run: qlty install
      - run: qlty check --no-progress --all
