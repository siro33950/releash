name: CI

on:
  push:
    branches: [main, feature/milestone/87]
  pull_request:
    branches: [main, feature/milestone/87]

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - id: test
        run: pnpm test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Add PR comment with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            const passed = '${{ steps.test.outcome }}' !== 'failure';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'All tests passed' : 'Some tests failed';
            const body = [
              `## ${icon} Integration Tests: ${status}`,
              '',
              `📊 [View HTML Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '_Generated by Playwright integration tests_',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Integration Tests:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  rust-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build frontend assets for Tauri
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-lint
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo deny --locked check
      - run: cargo build --locked

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build frontend assets for Tauri
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-test
      - name: Agent TUI harness self-test
        run: cargo test --locked --test agent_tui_harness
      - run: cargo test --locked

  # ruleset の required status check が参照する名前を保つための集約ジョブ。
  # lint と test を並列に回しても、片方の失敗でもう片方の結果を失わない。
  rust:
    needs: [rust-lint, rust-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Rust jobs
        run: |
          lint='${{ needs.rust-lint.result }}'
          test='${{ needs.rust-test.result }}'
          echo "rust-lint=$lint rust-test=$test"
          for result in "$lint" "$test"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: qltysh/qlty-action/install@v2
      - run: qlty install
      - run: qlty check --no-progress --all

  # カバレッジ計測は instrument 付きの追加ビルドを伴うため PR の待ち時間へ乗せない。
  # main への push でだけ測り、推移を Codecov で追う。
  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rust-coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --codecov --output-path rust-codecov.json
        working-directory: src-tauri
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src-tauri/rust-codecov.json
          flags: rust
          fail_ci_if_error: false
