name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  NX_DAEMON: "false"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      projects: ${{ steps.affected.outputs.projects }}
      ref: ${{ steps.affected.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - uses: nrwl/nx-set-shas@v5
      - run: ./nx --version
      - id: affected
        env:
          VALIDATION_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$VALIDATION_REF" ]; then
            projects=$(./nx show projects --json)
          else
            projects=$(./nx show projects --affected --json)
          fi
          projects=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1])))' "$projects")
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  frontend-checks:
    needs: plan
    uses: ./.github/workflows/ci-checks.yml
    with:
      affected: ${{ contains(fromJSON(needs.plan.outputs.projects), 'desktop') }}
      ref: ${{ needs.plan.outputs.ref }}
      group: frontend
      project: desktop
      targets: '["frontend-lint", "build", "frontend-test-unit", "frontend-test-integration"]'

  server-checks:
    needs: plan
    uses: ./.github/workflows/ci-checks.yml
    with:
      affected: ${{ contains(fromJSON(needs.plan.outputs.projects), 'server') }}
      ref: ${{ needs.plan.outputs.ref }}
      group: server
      project: server
      targets: '["lint", "test-unit", "test-integration"]'

  shell-checks:
    needs: plan
    uses: ./.github/workflows/ci-checks.yml
    with:
      affected: ${{ contains(fromJSON(needs.plan.outputs.projects), 'desktop') }}
      ref: ${{ needs.plan.outputs.ref }}
      group: shell
      project: desktop
      targets: '["rust-lint", "rust-test-unit", "rust-test-integration"]'

  cli-checks:
    needs: plan
    uses: ./.github/workflows/ci-checks.yml
    with:
      affected: ${{ contains(fromJSON(needs.plan.outputs.projects), 'cli') }}
      ref: ${{ needs.plan.outputs.ref }}
      group: cli
      project: cli
      targets: '["lint", "test-unit", "test-integration"]'

  quality-checks:
    needs: plan
    uses: ./.github/workflows/ci-checks.yml
    with:
      affected: ${{ contains(fromJSON(needs.plan.outputs.projects), 'workspace') }}
      ref: ${{ needs.plan.outputs.ref }}
      group: quality
      project: workspace
      targets: '["lint"]'
      skip-breaking: ${{ contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}

  macos-checks:
    needs: plan
    name: macos-checks / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test-unit, test-integration]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos')
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos')
      - name: Read Xcode version
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos')
        id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos')
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Install Metal Toolchain
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos') && matrix.target != 'lint'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install Rust toolchain
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos') && matrix.target != 'lint'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos') && matrix.target != 'lint'
      - uses: actions/cache@v6
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos') && matrix.target != 'lint'
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos') && matrix.target != 'lint'
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Run check
        if: contains(fromJSON(needs.plan.outputs.projects), 'macos')
        env:
          NX_TARGET: ${{ matrix.target }}
        run: ./nx run "macos:$NX_TARGET" --parallel=2 --outputStyle=static

  frontend-required:
    needs: [plan, frontend-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful frontend checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.frontend-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success

  server-required:
    needs: [plan, server-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful server checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.server-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success

  shell-required:
    needs: [plan, shell-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful shell checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.shell-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success

  cli-required:
    needs: [plan, cli-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful cli checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.cli-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success

  quality-required:
    needs: [plan, quality-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful quality checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.quality-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success

  macos-required:
    needs: [plan, macos-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful macos checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.macos-checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success
