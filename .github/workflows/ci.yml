name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  NX_DAEMON: "false"

permissions:
  contents: read
  actions: read

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - uses: nrwl/nx-set-shas@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: pnpm --dir clients/desktop install --frozen-lockfile
      - run: pnpm --dir clients/desktop exec playwright install --with-deps chromium
      - name: Run affected checks
        env:
          BUF_SKIP_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            NX_BASE=$(git hash-object -t tree /dev/null)
            export NX_BASE
            export NX_HEAD=${{ inputs.ref }}
          fi
          ./nx affected -t lint test build --exclude=macos --outputStyle=static
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: clients/desktop/playwright-report/
          retention-days: 7

  macos-native:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - uses: nrwl/nx-set-shas@v4
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Run affected native checks
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            NX_BASE=$(git hash-object -t tree /dev/null)
            export NX_BASE
            export NX_HEAD=${{ inputs.ref }}
          fi
          ./nx affected -t lint test build --exclude=server,cli,desktop,workspace --parallel=1 --outputStyle=static

  # 既存 ruleset の必須 check 名を維持する。
  required:
    name: ${{ matrix.check }}
    needs: [affected, macos-native]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [frontend, server, shell, cli, quality]
    steps:
      - run: test "$AFFECTED" = success && test "$MACOS" = success
        env:
          AFFECTED: ${{ needs.affected.result }}
          MACOS: ${{ needs.macos-native.result }}
