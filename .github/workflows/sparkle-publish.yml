name: Publish Sparkle feed
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      nightly:
        required: true
        type: boolean
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Validate feed and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          NIGHTLY: ${{ inputs.nightly }}
        run: node .github/scripts/sparkle-release.cjs publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
