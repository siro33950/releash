name: Renovate postprocess

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - clients/macos/project.yml
      - clients/macos/BuildTools/Package.swift
      - nx.json

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: renovate-postprocess-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"

jobs:
  postprocess:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - name: Load App credentials
        run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          POSTPROCESS_APP_CLIENT_ID: op://releash/releash-dependency-updates/client-id
          POSTPROCESS_APP_PRIVATE_KEY: op://releash/releash-dependency-updates/private-key
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.POSTPROCESS_APP_CLIENT_ID }}
          private-key: ${{ env.POSTPROCESS_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Clear App credentials
        run: |
          echo 'POSTPROCESS_APP_CLIENT_ID=' >> "$GITHUB_ENV"
          echo 'POSTPROCESS_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Get App identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/$bot" --jq .id)
          echo "name=$bot" >> "$GITHUB_OUTPUT"
          echo "email=$id+$bot@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select postprocessing
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          if printf '%s\n' "$files" | grep -qxE 'clients/macos/(project[.]yml|BuildTools/Package[.]swift)'; then
            echo 'swift=true' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qx 'nx.json'; then
            echo 'nx=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@v3
      - name: Read Xcode version
        if: steps.changes.outputs.swift == 'true'
        id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.changes.outputs.swift == 'true'
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Migrate Nx
        if: steps.changes.outputs.nx == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(node -p 'require("./nx.json").installation.version')
          previous=$(git show "$BASE_SHA:nx.json" | node -e 'let s=""; process.stdin.on("data", d => s += d); process.stdin.on("end", () => console.log(JSON.parse(s).installation.version));')
          if [ "$version" != "$previous" ]; then
            node -e 'const fs = require("node:fs"); const {execFileSync} = require("node:child_process"); const file = JSON.parse(fs.readFileSync("nx.json")); file.installation = JSON.parse(execFileSync("git", ["show", process.env.BASE_SHA + ":nx.json"], {encoding: "utf8"})).installation; fs.writeFileSync("nx.json", JSON.stringify(file, null, 2) + "\n");'
            rm -f migrations.json
            ./nx migrate "$version" --interactive=false
            pnpm --dir clients/desktop install --no-frozen-lockfile
            if [ -f migrations.json ]; then
              ./nx migrate --run-migrations --interactive=false
            fi
          fi
      - name: Resolve Swift packages
        if: steps.changes.outputs.swift == 'true'
        run: ./nx run macos:resolve-dependencies
      - name: Push postprocessing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.identity.outputs.name }}
          BOT_EMAIL: ${{ steps.identity.outputs.email }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git commit -m 'chore(deps): 依存更新後の生成結果を同期'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
