name: Cleanup screenshot diff branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete screenshot diff branch
        uses: actions/github-script@v8
        with:
          script: |
            const branch = `screenshot-update/pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch: ${branch}`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Branch ${branch} does not exist, skipping`);
              } else {
                throw e;
              }
            }
