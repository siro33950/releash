name: Nightly

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const { data: main } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'heads/main',
            });
            core.setOutput('sha', main.sha);
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', true);
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const latest = releases
              .filter(release => !release.draft && release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
              .sort((a, b) => b.published_at.localeCompare(a.published_at) || b.id - a.id)[0];
            const previous = latest && (await github.rest.repos.getCommit({
              ...context.repo, ref: `tags/${latest.tag_name}`,
            })).data.sha;
            core.setOutput('run', previous !== main.sha);
      - name: Verify workflow commit
        if: steps.changes.outputs.run == 'true' && github.workflow_sha != steps.changes.outputs.sha
        run: |
          echo "::error::Workflow commit differs from main HEAD. Start a new Nightly run from main."
          exit 1

  validation:
    needs: check
    if: needs.check.outputs.run == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  coverage:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - id: apt-key
        run: echo "key=apt-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-
      - name: Install Tauri dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo chown -R "$USER" ~/apt-archives
      - uses: jdx/mise-action@v3
      - working-directory: clients/desktop
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: coverage
          save-if: false
      - working-directory: clients/desktop
        run: pnpm exec playwright install --with-deps chromium
      - run: ./nx run-many -t e2e coverage --parallel=1 --outputStyle=static
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: clients/desktop/coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: rust-codecov.json
          flags: rust
          fail_ci_if_error: true

  release:
    needs: [check, validation]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - id: version
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        with:
          script: |
            const { version } = require('./clients/desktop/package.json');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected an X.Y.Z version');
            const date = new Date().toISOString().slice(0, 10).replaceAll('-', '');
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo, per_page: 100,
            });
            const numbers = tags.map(tag => tag.name.match(/^v\d+\.\d+\.\d+-nightly\.(\d{8})\.([1-9]\d*)$/))
              .filter(match => match?.[1] === date).map(match => Number(match[2]));
            const number = numbers.reduce((max, n) => Math.max(max, n), 0) + 1;
            const tag = `v${version}-nightly.${date}.${number}`;
            core.setOutput('version', tag.slice(1));
            core.setOutput('tag', tag);
      - name: Create tag and release notes with Nx
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./nx release changelog "$RELEASE_VERSION" --replace-existing-contents --git-tag --git-push --git-push-args="refs/tags/$RELEASE_TAG"
      - id: create
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: process.env.RELEASE_TAG, target_commitish: process.env.RELEASE_SHA,
              name: process.env.RELEASE_TAG, body: readFileSync('.nx/release-notes.md', 'utf8'),
              draft: true, prerelease: true, make_latest: 'false',
            });
            core.setOutput('release-id', data.id);

      - working-directory: clients/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: macos-universal
          save-if: false

      - run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          TAURI_SIGNING_PRIVATE_KEY: op://releash/tauri-updater/private-key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://releash/tauri-updater/password
          OTLP_ENDPOINT: op://releash/new-relic/otlp-endpoint
          NEW_RELIC_LICENSE_KEY: op://releash/new-relic/license-key

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTLP_ENDPOINT: ${{ env.OTLP_ENDPOINT }}
          NEW_RELIC_LICENSE_KEY: ${{ env.NEW_RELIC_LICENSE_KEY }}
        with:
          uploadUpdaterJson: true
          releaseId: ${{ steps.create.outputs.release-id }}
          projectPath: clients/desktop
          tauriScript: ../../nx run desktop:tauri --
          args: --target universal-apple-darwin --config tauri.conf.bundle.json -- --features vendored-openssl

      - name: Publish nightly
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.create.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, prerelease: true, make_latest: 'false',
            });

  cleanup:
    needs: release
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep the latest 14 nightlies
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const nightlies = releases
              .filter(release => release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
              .sort((a, b) => (b.published_at || b.created_at).localeCompare(a.published_at || a.created_at) || b.id - a.id);
            for (const release of [...nightlies.filter(release => release.draft), ...nightlies.filter(release => !release.draft).slice(14)]) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
            }
