name: Nightly

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const { data: main } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'heads/main',
            });
            core.setOutput('sha', main.sha);
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', true);
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const latest = releases
              .filter(release => !release.draft && release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
              .sort((a, b) => b.published_at.localeCompare(a.published_at) || b.id - a.id)[0];
            const previous = latest && (await github.rest.repos.getCommit({
              ...context.repo, ref: `tags/${latest.tag_name}`,
            })).data.sha;
            core.setOutput('run', previous !== main.sha);
      - name: Verify workflow commit
        if: steps.changes.outputs.run == 'true' && github.workflow_sha != steps.changes.outputs.sha
        run: |
          echo "::error::Workflow commit differs from main HEAD. Start a new Nightly run from main."
          exit 1

  validation:
    needs: check
    if: needs.check.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.sha }}

  performance:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: nightly-performance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Performance headless unit tests
        run: cargo test --locked --no-default-features --features performance --lib
      - name: Performance daemon helper self-test
        working-directory: .
        run: pnpm test:performance:daemon
      - name: Desktop CLI installation test
        run: cargo test --locked --features performance --test desktop_cli_install

  coverage:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C llvm-args=-runtime-counter-relocation
      # 親子で初期化済み profile を共有し、子の起動直後の強制終了でも破損させない。
      LLVM_PROFILE_FILE_NAME: releash-%m%c.profraw
      # 1並列では子テストの行出力が変わるため、計測負荷を抑える最小の2並列にする。
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: main
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: nightly-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage process termination regression test
        run: python3 .github/scripts/coverage.test.py
      - run: cargo llvm-cov --locked --codecov --output-path rust-codecov.json
        working-directory: src-tauri
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: src-tauri/rust-codecov.json
          flags: rust
          fail_ci_if_error: true

  release:
    needs: [check, validation, performance]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - id: create
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        with:
          script: |
            const { version } = require('./package.json');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected an X.Y.Z version');
            const date = new Date().toISOString().slice(0, 10).replaceAll('-', '');
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo, per_page: 100,
            });
            const numbers = tags.map(tag => tag.name.match(/^v\d+\.\d+\.\d+-nightly\.(\d{8})\.([1-9]\d*)$/))
              .filter(match => match?.[1] === date).map(match => Number(match[2]));
            const number = numbers.reduce((max, n) => Math.max(max, n), 0) + 1;
            const tag = `v${version}-nightly.${date}.${number}`;
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${tag}`, sha: process.env.RELEASE_SHA,
            });
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: process.env.RELEASE_SHA,
              name: tag, draft: true, prerelease: true, make_latest: 'false', generate_release_notes: true,
            });
            core.setOutput('release-id', data.id);

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          TAURI_SIGNING_PRIVATE_KEY: op://releash/tauri-updater/private-key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://releash/tauri-updater/password
          OTLP_ENDPOINT: op://releash/new-relic/otlp-endpoint
          NEW_RELIC_LICENSE_KEY: op://releash/new-relic/license-key
        with:
          version: "2.38.1"
          export-env: true

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTLP_ENDPOINT: ${{ env.OTLP_ENDPOINT }}
          NEW_RELIC_LICENSE_KEY: ${{ env.NEW_RELIC_LICENSE_KEY }}
        with:
          uploadUpdaterJson: true
          releaseId: ${{ steps.create.outputs.release-id }}
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin -- --features vendored-openssl

      - name: Publish nightly
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.create.outputs.release-id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID),
              draft: false, prerelease: true, make_latest: 'false',
            });

  cleanup:
    needs: release
    if: ${{ always() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep the latest 14 nightlies
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const nightlies = releases
              .filter(release => release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
              .sort((a, b) => (b.published_at || b.created_at).localeCompare(a.published_at || a.created_at) || b.id - a.id);
            for (const release of [...nightlies.filter(release => release.draft), ...nightlies.filter(release => !release.draft).slice(14)]) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
            }
