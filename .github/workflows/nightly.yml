name: Nightly

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: sparkle-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const { data: main } = await github.rest.repos.getCommit({
              ...context.repo, ref: 'heads/main',
            });
            core.setOutput('sha', main.sha);
            const commits = await github.paginate(github.rest.repos.listCommits, { ...context.repo, sha: 'main', per_page: 100 });
            const retry = commits.find(commit => commit.commit.message.split('\n').includes(`Nightly-Run: ${context.runId}`));
            if (retry) {
              core.setOutput('sha', retry.sha);
              core.setOutput('run', true);
              return;
            }
            if (context.eventName !== 'workflow_dispatch') {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                ...context.repo, per_page: 100,
              });
              const latest = releases
                .filter(release => !release.draft && release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
                .sort((a, b) => b.published_at.localeCompare(a.published_at) || b.id - a.id)[0];
              const previous = latest && (await github.rest.repos.getCommit({
                ...context.repo, ref: latest.tag_name,
              })).data.sha;
              if (previous === main.sha) {
                core.setOutput('run', false);
                return;
              }
            }
            // PR 層の検証は main push の CI が済ませている。Nightly では繰り返さず、成功した run があることだけ確かめる
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: main.sha, per_page: 100,
            });
            if (!runs.some(run => run.conclusion === 'success')) {
              const states = runs.map(run => `${run.id}: ${run.status}/${run.conclusion}`).join(', ') || 'none';
              throw new Error(`No successful CI run on main for ${main.sha} (${states}). Wait for CI or fix main before starting Nightly.`);
            }
            core.setOutput('run', true);
      - uses: actions/checkout@v7
        if: steps.changes.outputs.run == 'true'
        with:
          ref: ${{ steps.changes.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        if: steps.changes.outputs.run == 'true'
      - run: node .github/scripts/load-secrets.mjs
        if: steps.changes.outputs.run == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STABLE_RELEASE_TOKEN: op://releash/releash-stable-release/token
      - uses: actions/checkout@v7
        if: steps.changes.outputs.run == 'true'
        with:
          ref: ${{ steps.changes.outputs.sha }}
          fetch-depth: 0
          token: ${{ env.STABLE_RELEASE_TOKEN }}
      - id: version
        if: steps.changes.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ env.STABLE_RELEASE_TOKEN }}
        run: node .github/scripts/nightly-version.cjs

  macos-e2e:
    needs: check
    if: needs.check.outputs.run == 'true'
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      NX_DAEMON: "false"
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@v6
        id: helpers
        with:
          path: clients/macos/.build/Helpers/Debug
          key: macos-helpers-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'proto/**', 'workflows/**', 'server/**', 'clients/cli/**', '.github/scripts/macos-helpers.py') }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Prepare GUI session
        run: |
          launchctl print "gui/$(id -u)" >/dev/null
          swift .github/scripts/macos-e2e-display.swift
          sudo DevToolsSecurity -enable
          defaults write com.apple.CrashReporter DialogType none
          sudo xcodebuild -runFirstLaunch
      - name: Run all regression tests
        shell: bash
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/e2e.xcconfig
          RELEASH_HELPERS_RESTORED: ${{ steps.helpers.outputs.cache-hit }}
        run: |
          cat > "$XCODE_XCCONFIG_FILE" <<'EOF'
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          EOF
          mkdir -p "$RUNNER_TEMP/e2e-evidence"
          ./nx run macos:e2e --retry --result-bundle="$RUNNER_TEMP/e2e-evidence/Tests.xcresult" --outputStyle=static 2>&1 | tee "$RUNNER_TEMP/e2e-evidence/test.log"
      - name: Export test results and screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/e2e-evidence/Tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/e2e-evidence/Tests.xcresult" > "$RUNNER_TEMP/e2e-evidence/summary.json"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/e2e-evidence/Tests.xcresult" --output-path "$RUNNER_TEMP/e2e-evidence/screenshots"
          fi
      - name: Upload evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-e2e-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
      - name: Report persistent E2E failures
        if: failure()
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            await require('./.github/scripts/macos-e2e-report.cjs')({
              github, context, core, evidence: `${process.env.RUNNER_TEMP}/e2e-evidence`,
              artifactUrl: process.env.EVIDENCE_URL, sha: process.env.RELEASE_SHA,
            });

  coverage:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - id: apt-key
        run: echo "key=apt-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-
      - name: Install Tauri dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo chown -R "$USER" ~/apt-archives
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - working-directory: clients/desktop
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: coverage
          cache-on-failure: true
      - working-directory: clients/desktop
        run: pnpm exec playwright install --with-deps chromium
      - run: ./nx run-many -t e2e coverage --exclude=macos --parallel=1 --outputStyle=static
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: clients/desktop/coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: main
          override_commit: ${{ steps.checkout.outputs.commit }}
          files: rust-codecov.json
          flags: rust
          fail_ci_if_error: true

  # Tauri 版の sidecar と Swift 版の helper は同じ universal binary なので、一度だけ作って両方へ渡す
  helpers:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: macos-helpers-universal
          cache-on-failure: true
      - run: ./nx run macos:helpers -c release
      - uses: actions/upload-artifact@v6
        with:
          name: helpers-universal
          path: clients/macos/.build/Helpers/Release/
          if-no-files-found: error

  swift-build:
    needs: [check, helpers]
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@v6
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - uses: actions/download-artifact@v8
        with:
          name: helpers-universal
          path: clients/macos/.build/Helpers/Release
      - run: chmod +x clients/macos/.build/Helpers/Release/releashd clients/macos/.build/Helpers/Release/releash
      - run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          SPARKLE_PRIVATE_ED_KEY: op://releash/sparkle/private-key
          OTLP_ENDPOINT: op://releash/new-relic/otlp-endpoint
          NEW_RELIC_LICENSE_KEY: op://releash/new-relic/license-key
      - name: Archive, sign and notarize Releash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: bash .github/scripts/macos-release.sh
      - name: Save notarization result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-notarization-${{ github.run_attempt }}
          path: clients/macos/.build/Distribution/notary.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: swift-app
          path: |
            clients/macos/.build/Distribution/Releash_*_universal.zip
            clients/macos/.build/Distribution/sparkle.json
          if-no-files-found: error

  create-release:
    needs: [check, macos-e2e, swift-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - id: version
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        with:
          script: |
            const { version } = require('./clients/desktop/package.json');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected an X.Y.Z version');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find(release => release.prerelease && release.tag_name.startsWith(`v${version}-nightly.`));
            if (existing) {
              const commit = (await github.rest.repos.getCommit({ ...context.repo, ref: existing.tag_name })).data;
              if (commit.sha !== process.env.RELEASE_SHA) throw new Error('Version already belongs to another commit');
              core.setOutput('version', existing.tag_name.slice(1));
              core.setOutput('tag', existing.tag_name);
              core.setOutput('release-id', existing.id);
              return;
            }
            const date = new Date().toISOString().slice(0, 10).replaceAll('-', '');
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo, per_page: 100,
            });
            const numbers = tags.map(tag => tag.name.match(/^v\d+\.\d+\.\d+-nightly\.(\d{8})\.([1-9]\d*)$/))
              .filter(match => match?.[1] === date).map(match => Number(match[2]));
            const number = numbers.reduce((max, n) => Math.max(max, n), 0) + 1;
            const tag = `v${version}-nightly.${date}.${number}`;
            core.setOutput('version', tag.slice(1));
            core.setOutput('tag', tag);
      - name: Create tag and release notes with Nx
        if: steps.version.outputs.release-id == ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./nx release changelog "$RELEASE_VERSION" --replace-existing-contents --git-tag --git-push --git-push-args="refs/tags/$RELEASE_TAG"
      - id: create
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ID: ${{ steps.version.outputs.release-id }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        with:
          script: |
            if (process.env.RELEASE_ID) { core.setOutput('release-id', process.env.RELEASE_ID); return; }
            const { readFileSync } = require('node:fs');
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: process.env.RELEASE_TAG, target_commitish: process.env.RELEASE_SHA,
              name: process.env.RELEASE_TAG, body: readFileSync('.nx/release-notes.md', 'utf8'),
              draft: true, prerelease: true, make_latest: 'false',
            });
            core.setOutput('release-id', data.id);

  upload:
    needs: [check, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: swift-app
          path: ${{ runner.temp }}/assets
      - name: Upload Swift asset and signature metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ASSETS: ${{ runner.temp }}/assets
        run: node .github/scripts/sparkle-release.cjs upload

  publish:
    needs: [check, create-release, upload]
    uses: ./.github/workflows/sparkle-publish.yml
    with:
      sha: ${{ needs.check.outputs.sha }}
      tag: ${{ needs.create-release.outputs.tag }}
      nightly: true
    permissions:
      contents: write
      pages: write
      id-token: write

  cleanup:
    needs: [create-release, upload, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Keep the latest 14 nightlies
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const nightlies = releases
              .filter(release => release.prerelease && /^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(release.tag_name))
              .sort((a, b) => (b.published_at || b.created_at).localeCompare(a.published_at || a.created_at) || b.id - a.id);
            for (const release of [...nightlies.filter(release => release.draft), ...nightlies.filter(release => !release.draft).slice(14)]) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
            }
