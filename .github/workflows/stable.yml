name: Stable

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Published nightly tag"
        required: true
        type: string

concurrency:
  group: sparkle-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.nightly.outputs.sha }}
    steps:
      - id: nightly
        uses: actions/github-script@v9
        env:
          NIGHTLY_TAG: ${{ inputs.nightly }}
        with:
          script: |
            const tag = process.env.NIGHTLY_TAG;
            if (!/^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(tag)) throw new Error('Expected a nightly tag');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (release.draft || !release.prerelease) throw new Error('Expected a published nightly prerelease');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: tag });
            core.setOutput('sha', commit.sha);

  create-release:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      # GITHUB_TOKEN は workflow ファイルがブランチ先端と異なる commit へタグを作れないため、workflows 権限を持つ token を使う
      - id: secrets
        run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STABLE_RELEASE_TOKEN: op://releash/releash-stable-release/token
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          token: ${{ env.STABLE_RELEASE_TOKEN }}
      - id: version
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          NIGHTLY_TAG: ${{ inputs.nightly }}
        with:
          github-token: ${{ env.STABLE_RELEASE_TOKEN }}
          script: |
            const { version } = require('./clients/desktop/package.json');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected an X.Y.Z version');
            if (!process.env.NIGHTLY_TAG.startsWith(`v${version}-nightly.`)) throw new Error('Nightly tag and repository version differ');
            const tag = `v${version}`;
            const commit = await github.rest.repos.getCommit({
              ...context.repo, ref: tag,
            }).then(response => response.data).catch(error => {
              if (error.status !== 404 && error.status !== 422) throw error;
              return null;
            });
            if (commit && commit.sha !== process.env.RELEASE_SHA) throw new Error('Stable tag points to a different commit');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && (!commit || existing.prerelease)) throw new Error('Expected an unpublished stable release at the selected commit');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('tag-exists', Boolean(commit));
            core.setOutput('release-id', existing?.id || '');
      - name: Create tag and release notes with Nx
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag-exists }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./nx release changelog "$RELEASE_VERSION" --replace-existing-contents --git-tag="$([ "$TAG_EXISTS" = true ] && echo false || echo true)" --git-push --git-push-args="refs/tags/$RELEASE_TAG"
      - id: create
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ID: ${{ steps.version.outputs.release-id }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          github-token: ${{ env.STABLE_RELEASE_TOKEN }}
          script: |
            if (process.env.RELEASE_ID) {
              core.setOutput('release-id', process.env.RELEASE_ID);
              return;
            }
            const { readFileSync } = require('node:fs');
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: process.env.RELEASE_TAG, target_commitish: process.env.RELEASE_SHA,
              name: process.env.RELEASE_TAG, body: readFileSync('.nx/release-notes.md', 'utf8'),
              draft: true, prerelease: false, make_latest: 'false',
            });
            core.setOutput('release-id', data.id);

  helpers:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: macos-helpers-universal
          cache-on-failure: true
      - run: ./nx run macos:helpers -c release
      - uses: actions/upload-artifact@v6
        with:
          name: helpers-universal
          path: clients/macos/.build/Helpers/Release/
          if-no-files-found: error

  swift-build:
    needs: [resolve, helpers]
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v6
        with:
          path: .nx/installation
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nx.json', '.nx/nxw.js') }}
      - id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - run: xcodebuild -downloadComponent MetalToolchain
      - uses: actions/cache@v6
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - uses: actions/download-artifact@v8
        with:
          name: helpers-universal
          path: clients/macos/.build/Helpers/Release
      - run: chmod +x clients/macos/.build/Helpers/Release/releashd clients/macos/.build/Helpers/Release/releash
      - run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          SPARKLE_PRIVATE_ED_KEY: op://releash/sparkle/private-key
          OTLP_ENDPOINT: op://releash/new-relic/otlp-endpoint
          NEW_RELIC_LICENSE_KEY: op://releash/new-relic/license-key
      - name: Archive, sign and notarize Releash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: bash .github/scripts/macos-release.sh
      - name: Save notarization result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-notarization-${{ github.run_attempt }}
          path: clients/macos/.build/Distribution/notary.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: swift-app
          path: |
            clients/macos/.build/Distribution/Releash_*_universal.zip
            clients/macos/.build/Distribution/sparkle.json
          if-no-files-found: error

  upload:
    needs: [resolve, create-release, swift-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: swift-app
          path: ${{ runner.temp }}/assets
      - name: Upload Swift asset and signature metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ASSETS: ${{ runner.temp }}/assets
        run: node .github/scripts/sparkle-release.cjs upload

  publish:
    needs: [resolve, create-release, upload]
    uses: ./.github/workflows/sparkle-publish.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      tag: ${{ needs.create-release.outputs.tag }}
      nightly: false
    permissions:
      contents: write
      pages: write
      id-token: write
