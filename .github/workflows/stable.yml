name: Stable

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Published nightly tag"
        required: true
        type: string

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.nightly.outputs.sha }}
    steps:
      - id: nightly
        uses: actions/github-script@v9
        env:
          NIGHTLY_TAG: ${{ inputs.nightly }}
        with:
          script: |
            const tag = process.env.NIGHTLY_TAG;
            if (!/^v\d+\.\d+\.\d+-nightly\.\d{8}\.[1-9]\d*$/.test(tag)) throw new Error('Expected a nightly tag');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            if (release.draft || !release.prerelease) throw new Error('Expected a published nightly prerelease');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: `tags/${tag}` });
            core.setOutput('sha', commit.sha);

  create-release:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
      sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      # GITHUB_TOKEN は workflow ファイルがブランチ先端と異なる commit へタグを作れないため、workflows 権限を持つ token を使う
      - id: secrets
        run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          STABLE_RELEASE_TOKEN: op://releash/releash-stable-release/token
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          token: ${{ env.STABLE_RELEASE_TOKEN }}
      - id: version
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          NIGHTLY_TAG: ${{ inputs.nightly }}
        with:
          github-token: ${{ env.STABLE_RELEASE_TOKEN }}
          script: |
            const { version } = require('./clients/desktop/package.json');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected an X.Y.Z version');
            if (!process.env.NIGHTLY_TAG.startsWith(`v${version}-nightly.`)) throw new Error('Nightly tag and repository version differ');
            const tag = `v${version}`;
            const commit = await github.rest.repos.getCommit({
              ...context.repo, ref: `tags/${tag}`,
            }).then(response => response.data).catch(error => {
              if (error.status !== 404 && error.status !== 422) throw error;
              return null;
            });
            if (commit && commit.sha !== process.env.RELEASE_SHA) throw new Error('Stable tag points to a different commit');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing && (!commit || !existing.draft || existing.prerelease)) throw new Error('Expected an unpublished stable release at the selected commit');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('tag-exists', Boolean(commit));
            core.setOutput('release-id', existing?.id || '');
      - name: Create tag and release notes with Nx
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag-exists }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./nx release changelog "$RELEASE_VERSION" --replace-existing-contents --git-tag="$([ "$TAG_EXISTS" = true ] && echo false || echo true)" --git-push --git-push-args="refs/tags/$RELEASE_TAG"
      - id: create
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ID: ${{ steps.version.outputs.release-id }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          github-token: ${{ env.STABLE_RELEASE_TOKEN }}
          script: |
            if (process.env.RELEASE_ID) {
              core.setOutput('release-id', process.env.RELEASE_ID);
              return;
            }
            const { readFileSync } = require('node:fs');
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: process.env.RELEASE_TAG, target_commitish: process.env.RELEASE_SHA,
              name: process.env.RELEASE_TAG, body: readFileSync('.nx/release-notes.md', 'utf8'),
              draft: true, prerelease: false, make_latest: 'false',
            });
            core.setOutput('release-id', data.id);

  build:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.sha }}

      - uses: jdx/mise-action@v3

      - working-directory: clients/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: macos-universal
          save-if: false

      - run: node .github/scripts/load-secrets.mjs
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          TAURI_SIGNING_PRIVATE_KEY: op://releash/tauri-updater/private-key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://releash/tauri-updater/password
          OTLP_ENDPOINT: op://releash/new-relic/otlp-endpoint
          NEW_RELIC_LICENSE_KEY: op://releash/new-relic/license-key

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTLP_ENDPOINT: ${{ env.OTLP_ENDPOINT }}
          NEW_RELIC_LICENSE_KEY: ${{ env.NEW_RELIC_LICENSE_KEY }}
        with:
          uploadUpdaterJson: true
          releaseId: ${{ needs.create-release.outputs.release-id }}
          projectPath: clients/desktop
          tauriScript: ../../nx run desktop:tauri --
          args: --target universal-apple-darwin --config tauri.conf.bundle.json -- --features vendored-openssl

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish stable as latest
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id, per_page: 100,
            });
            if (!assets.some(asset => asset.name === 'latest.json' && asset.size > 0)) throw new Error('Missing updater manifest');
            await github.rest.repos.updateRelease({
              ...context.repo, release_id,
              draft: false, prerelease: false, make_latest: 'true',
            });

  bump:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: jdx/mise-action@v3
      - name: Bump version with Nx
        env:
          BUMP: patch
        run: |
          ./nx release version "$BUMP"
          VERSION=$(node -p "require('./clients/desktop/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' clients/desktop/tauri.conf.json > tmp.json && mv tmp.json clients/desktop/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E '/^name = "(releashd|releash|releash-desktop)"$/{n;s/^version = ".*"/version = "'"$VERSION"'"/;}' Cargo.lock

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          add-paths: |
            clients/desktop/package.json
            clients/desktop/tauri.conf.json
            Cargo.toml
            Cargo.lock
          commit-message: "release: v${{ env.VERSION }}"
          branch: release/v${{ env.VERSION }}
          title: "release: v${{ env.VERSION }}"
          body: "Bump version to ${{ env.VERSION }} (patch after stable)"
