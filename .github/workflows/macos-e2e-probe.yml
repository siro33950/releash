name: macOS E2E runner probe

on:
  push:
    branches: [feat/issues/2054]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  NX_DAEMON: "false"

jobs:
  e2e:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat clients/macos/.xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: clients/macos/BuildTools/.build
          key: macos-native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/BuildTools/Package.resolved') }}
      - uses: actions/cache@v6
        with:
          path: clients/macos/.build/SourcePackages
          key: macos-native-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('clients/macos/Releash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Inspect GUI session
        run: |
          sw_vers
          xcodebuild -version
          stat -f '%Su' /dev/console
          launchctl print "gui/$(id -u)" >/dev/null
          system_profiler SPDisplaysDataType
          security find-identity -v -p codesigning
      - name: Prepare E2E dependencies
        run: ./nx run-many --projects=macos -t generate helpers test-fixture-build file-viewer --parallel=2 --outputStyle=static
      - name: Run all regression tests
        env:
          XCODE_XCCONFIG_FILE: ${{ runner.temp }}/probe.xcconfig
        run: |
          cat > "$XCODE_XCCONFIG_FILE" <<'EOF'
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          EOF
          mkdir -p "$RUNNER_TEMP/e2e-evidence"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/e2e-evidence/test.log"
          import os
          from pathlib import Path
          import runpy

          e2e = runpy.run_path('.github/scripts/macos-e2e.py')
          result = Path(os.environ['RUNNER_TEMP']) / 'e2e-evidence/Tests.xcresult'
          raise SystemExit(e2e['execute'](Path.cwd(), [], result))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-e2e-probe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-evidence
          if-no-files-found: warn
