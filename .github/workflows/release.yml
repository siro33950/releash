name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              draft: true,
              generate_release_notes: true,
            });
            core.setOutput('release-id', data.id);

  build:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - uses: 1password/load-secrets-action@v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: op://releash/apple-signing/certificate
          APPLE_CERTIFICATE_PASSWORD: op://releash/apple-signing/certificate-password
          APPLE_SIGNING_IDENTITY: op://releash/apple-signing/signing-identity
          APPLE_ID: op://releash/apple-signing/apple-id
          APPLE_PASSWORD: op://releash/apple-signing/app-password
          APPLE_TEAM_ID: op://releash/apple-signing/team-id
          TAURI_SIGNING_PRIVATE_KEY: op://releash/tauri-updater/private-key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: op://releash/tauri-updater/password
          SENTRY_DSN: op://releash/sentry/dsn
          SENTRY_AUTH_TOKEN: op://releash/sentry/auth-token
          SENTRY_ORG: op://releash/sentry/org
          SENTRY_PROJECT: op://releash/sentry/project
        with:
          export-env: true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ env.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ env.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin -- --features vendored-openssl
